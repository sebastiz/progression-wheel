d:"stringsoflife",name:"Strings of Life",artist:"Derrick May",year:1987,bpm:130,tonic:9,progId:"aeolian",baseTemplate:"techno",narrative:"terraced",vary:1,sync:0,tip:"The Detroit techno string riff every later 'stab that builds' descends from \u2014 it doesn't develop so much as arrive in layers, one string figure stacking on the last. `terraced` states a short figure and restates it a step higher, section by section, which is the same layering trick in miniature."},{id:"spastik",name:"Spastik",artist:"Plastikman",year:1993,bpm:135,tonic:0,progId:"aeolian",baseTemplate:"techno",narrative:"ostinato",vary:.2,sync:0,tip:"Minimal techno reduced to its studs: one hypnotic pattern, barely pitched at all, that runs unchanged for most of the record \u2014 the point is the groove's own repetition, not melodic incident. Low variation keeps every pass close to identical, the way the real pattern never really departs from itself."},{id:"strobe",name:"Strobe",artist:"deadmau5",year:2009,bpm:128,tonic:8,progId:"festival",baseTemplate:"melotech",narrative:"archSong",vary:1,sync:0,tip:"Ten minutes as one continuous climb rather than a string of sections \u2014 the famous two-minute intro is the first quarter of a single arc that only resolves at the drop. `archSong` shapes register the same way across the whole running order instead of per section, which is the one narrative built for a song that is itself one long phrase."},{id:"sandstorm",name:"Sandstorm",artist:"Darude",year:2e3,bpm:136,tonic:11,progId:"festival",baseTemplate:"trance",narrative:"motif",vary:1,sync:1,tip:"Built from one small, instantly-hummable synth figure restated through every section rather than developed into a longer tune \u2014 arguably the most recognisable four-bar idea in dance music precisely because it never becomes anything more complicated. `motif` restates and transforms one short cell the same way, section to section."},{id:"silence",name:"Silence",artist:"Delerium ft. Sarah McLachlan",year:2e3,bpm:136,tonic:9,progId:"festival",baseTemplate:"trance",narrative:"wave",vary:1,sync:0,tip:"A vocal trance breakdown built on long, slow-breathing phrases that rise and fall without ever quite settling \u2014 the emotional centre the trance template's own 32-bar, drum-free breakdown exists to hold. `wave`'s long undulation, wider under the hook, is that same unresolved swell."},{id:"greyhound",name:"Greyhound",artist:"Swedish House Mafia",year:2012,bpm:128,tonic:0,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.5,sync:1,tip:"An instrumental main-stage lead: a short stabbing riff that only moves because the chord under it does, rather than a tune with its own contour. `chordLock` snaps every note to the bar's chord tone, so the line spells the changes exactly the way a big-room lead riff does."},{id:"dontyouworrychild",name:"Don't You Worry Child",artist:"Swedish House Mafia ft. John Martin",year:2012,bpm:129,tonic:11,progId:"festival",baseTemplate:"bigroom",narrative:"expand",vary:1,sync:1,tip:"Verses kept deliberately narrow and low so the chorus can leap to the top of the octave and stay there \u2014 the single most common trick in festival pop, and the reason the hook feels enormous relative to everything around it. `expand` is built for exactly that contrast."},{id:"reload",name:"Reload",artist:"Sebastian Ingrosso & Tommy Trash",year:2013,bpm:128,tonic:2,progId:"festival",baseTemplate:"proghouse",narrative:"terraced",vary:1,sync:0,tip:"Progressive house's layer-at-a-time build taken almost to an extreme \u2014 each pass adds one element and nothing is removed until the long breakdown. `terraced` restates its figure a step higher each time, which is the same one-thing-at-a-time logic read as a melodic shape instead of an arrangement one."},{id:"concreteangel",name:"Concrete Angel",artist:"Gareth Emery ft. Christina Novelli",year:2014,bpm:136,tonic:4,progId:"festival",baseTemplate:"proghouse",narrative:"climb",vary:1,sync:0,tip:"A vocal trance-house record where the emotional lift comes from the register climbing across the whole song rather than from a key change \u2014 a cheaper trick than modulating, and one that never announces itself. `climb` sits each section a little higher than the last for exactly that reason."},{id:"innercitylife",name:"Inner City Life",artist:"Goldie",year:1994,bpm:172,tonic:7,progId:"aeolian",baseTemplate:"dnb",narrative:"suspend",vary:1,sync:0,tip:"The record that proved drum & bass could carry a soul vocal \u2014 atmosphere and ache stated over the breaks before either drop properly lands, matching the dnb template's own 'mood before drop' shape. `suspend` writes a line that keeps landing a step above the chord and resolving down, the ache that keeps a slow melody moving over a fast rhythm section."},{id:"scarymonsters",name:"Scary Monsters and Nice Sprites",artist:"Skrillex",year:2010,bpm:140,tonic:7,progId:"axisMinor",baseTemplate:"dubstep",narrative:"chordLock",vary:.5,sync:2,tip:"The mid-range wobble bass *is* the hook here \u2014 the dubstep template's own tip notes that harmony comes out at the drop because the mid-range synth has replaced it, and `chordLock` writes a hard, chord-snapped stutter in that same register instead of a sung line, at the more aggressive syncopation level."},{id:"neverbelikeyou",name:"Never Be Like You",artist:"Flume ft. Kai",year:2016,bpm:150,tonic:0,progId:"futureBass",baseTemplate:"futurebass",pad:"voice",narrative:"gapfill",vary:1,sync:2,tip:"Future bass built from a chopped, pitch-bent vocal \u2014 leaping to a high note and stepping back down through the gap it just left, the shape that makes a vocal chop read as a hook rather than a glitch. `gapfill` is that leap-then-fill pattern exactly; the voice pad stands in for the sung timbre without repeating its words."},{id:"maskoff",name:"Mask Off",artist:"Future",year:2017,bpm:152,tonic:7,progId:"axisMinor",baseTemplate:"trap",bass:"subhold",bassVoice:"sub",narrative:"ostinato",vary:.2,sync:1,tip:"A trap beat built almost entirely around one short woodwind figure looped for the whole record \u2014 the hook barely varies because it doesn't need to; the 808 sub the trap template leaves silent by default is filled in here since the low end carries as much of the track as the riff does."},{id:"rerewind",name:"Re-Rewind (The Crowd Say Bo Selecta)",artist:"Artful Dodger ft. Craig David",year:1999,bpm:132,tonic:9,progId:"deepHouse",baseTemplate:"garage",pat:"shuffle16",swing:.35,narrative:"converse",vary:1,sync:2,tip:"UK garage's 2-step skip lives in the shuffle, not the chords \u2014 swung sixteenths pulling against a four-on-the-floor sound that isn't actually there. The pattern and swing overrides are what carry that; `converse` writes a narrow, speech-like vocal line with air between phrases, which is how the genre's sung top-lines tend to sit over the skip."}],Wi=m1;var{useState:B,useMemo:Wt,useRef:Oe,useEffect:on}=React,g1="4.93.0",f1={"0maj":[[-1,3,2,0,1,0],[0,3,2,0,1,0]],"0dom":[[-1,3,2,3,1,0],[0,3,2,4,1,0]],"2maj":[[-1,-1,0,2,3,2],[0,0,0,1,3,2]],"2min":[[-1,-1,0,2,3,1],[0,0,0,2,3,1]],"2dom":[[-1,-1,0,2,1,2],[0,0,0,2,1,3]],"4maj":[[0,2,2,1,0,0],[0,2,3,1,0,0]],"4min":[[0,2,2,0,0,0],[0,2,3,0,0,0]],"4dom":[[0,2,0,1,0,0],[0,2,0,1,0,0]],"7maj":[[3,2,0,0,0,3],[2,1,0,0,0,3]],"7dom":[[3,2,0,0,0,1],[3,2,0,0,0,1]],"9maj":[[-1,0,2,2,2,0],[0,0,1,2,3,0]],"9min":[[-1,0,2,2,1,0],[0,0,2,3,1,0]],"9dom":[[-1,0,2,0,2,0],[0,0,2,0,3,0]],"11dom":[[-1,2,1,2,0,2],[0,2,1,3,0,4]],"0maj7":[[-1,3,2,0,0,0],[0,3,2,0,0,0]],"2maj7":[[-1,-1,0,2,2,2],[0,0,0,1,1,1]],"4maj7":[[0,2,1,1,0,0],[0,3,1,2,0,0]],"5maj7":[[-1,-1,3,2,1,0],[0,0,3,2,1,0]],"7maj7":[[3,2,0,0,0,2],[2,1,0,0,0,3]],"9maj7":[[-1,0,2,1,2,0],[0,0,2,1,3,0]],"2m7":[[-1,-1,0,2,1,1],[0,0,0,2,1,1]],"4m7":[[0,2,0,0,0,0],[0,2,0,0,0,0]],"9m7":[[-1,0,2,0,1,0],[0,0,2,0,1,0]],"11m7":[[-1,2,0,2,0,2],[0,2,0,3,0,4]]};function Cp(t,a){let r={maj9:"maj7",m9:"m7",dom9:"dom"}[a];if(r)return{...Cp(t,r),add9:Oo[(t+2)%12]};let s={add9:["maj","a         /* ---- design tokens ----

          --ink:#EDE7DA; --ink-serif:#EAE2CC; --text:#C9D2DE; --muted:#8B94A3; --muted-2:#5C6675;
          --green:#54B79D; --coral:#E06A55; --blue:#6EA8FF;

          outline:2px solid ${We}; outline-offset:2px; border-radius:var(--r-sm);
        }

        .mcell.colnow { border-color:var(--ink-serif); }

        .octval { font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-sm); color:var(--ink); min-width:22px; text-align:center; font-variant-numeric:tabular-nums; }
        .lvl { width:104px; accent-color:var(--green); }

        /* On a phone the part buttons and mixer controls were 18\u201323px tall \u2014 under a thumb that is

           layout is dense on purpose. */
        @media (max-width: 560px) {
          .lybtn { padding:7px 13px; font-size:var(--fs-md); min-height:32px; }

          .parthdr { gap:8px 12px; }
          .parthdr .lvl { width:120px; height:26px; }

        /* ---- a section's instrument tabs and its settings panel ----
           The panel is deliberately a different surface from everything around it. What is in it
           belongs to one instrument in one section \u2014 the same pad is a different sound in the
           chorus \u2014 and that is not obvious from the controls themselves, so the background has to
           say it. It takes the part's own colour as a tint, so which tab you are on is legible from

        /* a section's own move and melodic shape, sitting under its chords */
        .secopts { gap:6px 10px; flex-wrap:wrap; align-items:center; margin:5px 0 2px; }

        .optlbl { font-size:var(--fs-xs); font-weight:700; letter-spacing:.07em; text-transform:uppercase;

        .lytabs { margin-bottom:-1px; position:relative; z-index:1; }

          border-color:color-mix(in srgb, var(--ly) 45%, var(--line-2));
          color:var(--text); box-shadow:inset 0 2px 0 var(--ly); }
        .lytab.lyadd { color:var(--muted); }
        .lydot { font-style:normal; font-size:var(--fs-xs); line-height:1; padding:2px 5px; border-radius:var(--r-pill);

          border:1px solid color-mix(in srgb, var(--ly) 34%, var(--line-2));
          border-left:3px solid color-mix(in srgb, var(--ly) 62%, var(--line-2));
          background:
            linear-gradient(color-mix(in srgb, var(--ly) 14%, transparent), color-mix(in srgb, var(--ly) 5%, transparent)),

        .partinstr { flex:1 1 150px; min-width:130px; max-width:280px; }

        .partname { font-size:var(--fs-sm); font-weight:600; color:var(--ly); letter-spacing:.02em; }
        .modtabs { gap:3px; flex-wrap:wrap; margin:9px 0 7px; border-bottom:1px solid var(--line-2); padding-bottom:6px; }
        .modtab { font-size:var(--fs-sm); padding:3px 9px; border-radius:var(--r-pill); border:1px solid transparent;

        /* A grid rather than a wrapping row: 28 controls of different widths in a flex row is a

        .modctl { display:flex; align-items:center; gap:7px; min-width:0; }

        .lybtn { font-size:var(--fs-sm); padding:2px 9px; border-radius:var(--r-pill); border:1px solid var(--line-2); background:var(--surface); color:var(--muted); cursor:pointer; }

        /* The drum rows are binary \u2014 a cell is on or it is not \u2014 so they can be shorter than the

        .mcell.dcell { height:13px; }

        .gridhdr { gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0 2px; }

        .gridbar { display:flex; align-items:center; gap:7px; width:100%; margin-top:7px;
          padding:7px 11px; border:1px solid var(--line-2); border-radius:var(--r-md);

           grid shape, so a track's clip 3 lines up with every other track's clip 3 whether or not
           they're the same length or ever meant to play together. Track headers sit above the
           grid; a scene button in the gutter fires every track's clip at that row at once. Below,
           a plain HTML table for the open clip's own grid \u2014 no playhead or drag-paint to draw, so
           it needs none of the Arrange grid's SVG. */
        .sessgridview { display:grid; gap:5px; margin:8px 0; overflow-x:auto; align-items:stretch; }
        .sesscolhdr { background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-md); padding:6px; min-width:0; }
        .sesscolhdr input.txt { width:100%; min-width:0; box-sizing:border-box; }
        .scenebtn { background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);

        .scenebtn:hover { color:var(--text); border-color:var(--line-3); }
        .sessslot { font-size:var(--fs-sm); border-radius:var(--r-sm); border:1px solid var(--line-2);
          background:var(--surface); color:var(--muted); cursor:pointer; padding:6px 4px; min-width:0;
          font-variant-numeric:tabular-nums; position:relative; overflow:hidden; }
        /* a live clip visibly makes its way round its own loop \u2014 the sliver is the playhead */
        .slotprog { position:absolute; left:0; bottom:0; height:3px; background:rgba(0,0,0,.32);
          pointer-events:none; transition:width .3s linear; }

        .sessslot:hover { color:var(--text); border-color:var(--line-4); }

        .sessslot.live { background:var(--green); border-color:var(--green); color:var(--bg); font-weight:700; }

        .sessgridwrap { overflow-x:auto; margin-top:8px; }

        .sessgridrow { font-size:var(--fs-sm); color:var(--muted); text-align:right; padding-right:6px; white-space:nowrap; }
        .sessgridcell { width:14px; height:14px; border:1px solid var(--line-2); background:var(--surface); cursor:pointer; padding:0; }
        .sessgridcell.barstart { border-left:2px solid var(--line-3); }
        .sessgridcell.on { border-color:var(--line-3); }
        .sessgridcell:hover { border-color:var(--line-4); }
        .mcell.bt { border-left:1px solid var(--line-2); }
        .mcell.mv { touch-action:none; }
        .mscroll.mvmode { user-select:none; -webkit-user-select:none; touch-action:none; }
        .mcell.msel { outline:2px solid var(--blue); outline-offset:-1px; box-shadow:inset 0 0 0 2px rgba(110,168,255,.35); }
        .mcell.mbox { background:rgba(110,168,255,.22); border-color:var(--blue); }
        .mcell.mghost { background:rgba(110,168,255,.5); border-color:var(--blue); }
        .melmodebar { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:6px; }
        .melmodebar .rlbl { font-size:var(--fs-md); color:var(--muted); margin:0 2px; }
        .mscroll { overflow-x:auto; padding-bottom:4px; }

           its own legend away \u2014 nine drum rows of unlabelled cells. Pinning the gutter keeps
           "Snare" beside the snare wherever you have scrolled to. */
        .mline > .mnote, .mline > span:first-child { position:sticky; left:0; z-index:2;
          background:var(--surface); }
        .sugmel { background:var(--bg); border:1px solid var(--line-2); border-radius:var(--r-lg); padding:10px 12px; margin-bottom:10px; }
        /* the arrangement strip: a fixed label gutter beside a proportional track area */
        .tl { display:flex; gap:8px; align-items:stretch; margin-top:11px; padding:9px 11px 10px;
          background:var(--bg); border:1px solid var(--line-2); border-radius:var(--r-lg); }
        .tlgut { flex:0 0 56px; display:flex; flex-direction:column; }
        .tlglbl { height:13px; margin-bottom:3px; font-size:var(--fs-micro); font-weight:700; letter-spacing:.1em;

        .tlgruler { height:14px; }
        .tlgsec { height:26px; line-height:26px; color:${We}; letter-spacing:.04em; }
        .tltrk { position:relative; flex:1; min-width:0; }
        .tlruler { position:relative; height:14px; }

        .tlrow { display:flex; gap:2px; height:13px; margin-bottom:3px; }

           row had lost its sections rather than the layer having gone out. Sunk below the strip
           with a rim around it, it reads as a hole, which is what it is. */
        .tlcell.off { background:var(--sunk); box-shadow:inset 0 0 0 1px var(--line-3); }

        .tlauto { position:relative; height:30px; margin-bottom:3px; border-radius:var(--r-sm); cursor:crosshair;
          background:var(--surface-2); border:1px solid var(--line); touch-action:none; overflow:hidden; }
        .tlauto.has { border-color:var(--line-3); }
        .tlauto:hover { border-color:var(--line-4); }
        .tlcurve { position:absolute; inset:0; width:100%; height:100%; }
        .tlcurve polyline { fill:none; stroke:${We}; stroke-width:2.5; vector-effect:non-scaling-stroke;
          stroke-linejoin:round; }
        .tlautol { position:absolute; left:5px; top:1px; font-size:var(--fs-micro); color:var(--muted-2); pointer-events:none;
          letter-spacing:.08em; text-transform:uppercase; }
        .tlautox { position:absolute; right:2px; top:2px; width:16px; height:16px; padding:0; line-height:1;
          font-size:var(--fs-xs); border-radius:var(--r-xs); background:var(--hover); color:var(--muted); border:1px solid var(--line-2);
          cursor:pointer; }
        .tlautox:hover { color:#E9B3AB; border-color:#7A4A44; }
        /* the energy staircase: one bar per section, height = what is playing in it */
        .tlnrg { height:26px; align-items:flex-end; }
        .tlnrgw { min-width:0; display:flex; align-items:flex-end; height:100%;
          border-bottom:1px solid var(--line-2); }
        .tlnrgb { width:100%; border-radius:var(--r-xs) var(--r-xs) 0 0; transition:height .12s; }
        .tlgnrg { height:26px; line-height:26px; }
        .tlgauto { height:30px; line-height:30px; }
        /* what a template did, said in words beside the strip that draws it */
        .tplnote { margin-top:9px; padding:8px 11px 9px; background:var(--bg);
          border:1px solid var(--line-2); border-left:3px solid ${We}; border-radius:var(--r-lg); }
        /* the full 68-style reference table \u2014 a lookup, so it favours density over the tplnote's
           one-template-at-a-time prose; grouped and ordered exactly as the family tree groups them */
        .styleref { margin-top:8px; max-height:420px; overflow-y:auto; overflow-x:auto;
          border:1px solid var(--line-2); border-radius:var(--r-lg); padding:2px 11px; background:var(--bg); }
        .styleref-fam + .styleref-fam { border-top:1px solid var(--line-2); margin-top:8px; padding-top:6px; }
        .styleref-famname { font-size:var(--fs-md); color:${We}; font-weight:600; margin:6px 0 4px; }
        .styleref table { width:100%; border-collapse:collapse; margin-bottom:6px; }
        .styleref th { text-align:left; font-size:var(--fs-micro); color:var(--muted); font-weight:500;
          padding:2px 8px 4px 0; border-bottom:1px solid var(--line-2); white-space:nowrap; }
        .styleref td { font-size:var(--fs-md); color:var(--muted); padding:5px 8px 5px 0;
          border-bottom:1px solid var(--line); vertical-align:top; }
        .styleref tr:last-child td { border-bottom:none; }
        .styleref td.styleref-name { color:var(--ink); font-weight:600; white-space:nowrap; }
        .tlhead { position:absolute; top:14px; bottom:0; width:2px; background:${We}; border-radius:var(--r-xs);
          pointer-events:none; box-shadow:0 0 6px ${We}AA; z-index:4; }
        /* Section boundaries, drawn down the whole strip. Two sections that letter the same way get
           the same colour, so a 2px gap between them was the only thing saying where one stopped \u2014
           at which point a run of choruses reads as one long chorus. A seam that carries through
           the section row, every lane, the staircase and the automation is what makes a column a
           column.

           Laid out as a flex row with the same bases and the same gap as the rows themselves, so
           the lines land on the seams with no arithmetic and no drift as sections are added. The
           line is an inset shadow rather than a border because a border would widen each item by a
           pixel and walk the overlay out of step with the rows it is meant to be tracking. */
        .tlbounds { position:absolute; left:0; right:0; top:14px; bottom:0; display:flex; gap:2px;

        .secdrum { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-sm); }
        .fxsel { font-size:var(--fs-sm); padding:3px 6px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--text);
          border:1px solid var(--line-2); max-width:150px; }

          border:1px solid var(--line-2); max-width:130px; }
        .mbar { font-size:var(--fs-sm); font-weight:700; border-radius:var(--r-sm); text-align:center; padding:2px 0; margin:0 1px 2px; white-space:nowrap; overflow:hidden; }
        .sug { border-top:1px solid var(--line); padding:10px 2px 8px; margin-top:8px; }
        .modehint { margin:10px 0 0; padding:10px 12px; border:1px solid ${We}55; background:var(--raised); border-radius:var(--r-lg); }
        .progchips { display:flex; flex-wrap:wrap; gap:8px; }
        .progchip { flex:1 1 150px; text-align:left; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-lg);
          padding:8px 11px; cursor:pointer; font-family:inherit; color:var(--ink); display:flex; flex-direction:column; gap:2px; }
        .progchip:hover { border-color:var(--line-4); }
        .progchip.on { border-color:var(--ink-serif); background:var(--raised); box-shadow:inset 0 0 0 1px #EAE2CC55; }
        .progchip .pcname { font-size:var(--fs-lg); font-weight:600; }
        .progchip .pcnums { font-size:var(--fs-md); color:var(--ink-serif); }
        .progchip .pcrn { font-size:var(--fs-sm); color:var(--muted); letter-spacing:.03em; }
