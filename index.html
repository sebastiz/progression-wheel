vary:.5,sync:1,tip:"Trades its lead phrase back and forth between two short answering figures across the drop rather than running one continuous line; `qanda` writes that call-and-answer shape."},{id:"hardstyle_musicmadeaddict",name:"Music Made Addict",artist:"D-Block & S-te-Fan",year:2016,bpm:150,tonic:0,progId:"axisMinor",baseTemplate:"hardstyle",narrative:"chordLock",vary:.4,sync:1,tip:"A raw-leaning hardstyle anthem where the distorted screech-kick carries the low end and the riff is locked hard to the chord changes above it; `chordLock` is that same relationship."},{id:"speedcore_kotzbrocken",name:"Kotzbrocken",artist:"The Speed Freak",year:1996,bpm:200,tonic:9,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.2,sync:0,tip:"German producer Rob Fabrie's foundational speedcore record runs far beyond ordinary gabber tempo on a single distorted four-on-the-floor cell that barely develops \u2014 the real track runs faster than this app can represent, so it's set to the 200 bpm ceiling; `ostinato` at minimal variation matches that static, velocity-first shape."},{id:"speedcore_extermination",name:"Extermination",artist:"The Speed Freak",year:1997,bpm:200,tonic:9,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.2,sync:0,tip:"Pushes the same one-cell, kick-driven approach even further past danceable tempo into pure velocity; the real track exceeds this app's 200 bpm cap, so it's set to the ceiling, and `ostinato` keeps the cell undeveloped throughout."},{id:"speedcore_50hardcoredoller",name:"50 Hardcore Doller",artist:"DJ Freak",year:1994,bpm:200,tonic:0,progId:"axisMinor",baseTemplate:"speedcore",narrative:"chant",vary:.2,sync:0,tip:"A Bloody Fist Records (Australia) noisecore/speedcore release built on a distorted four-on-the-floor pushed well past groove into sheer velocity, with a shouted vocal stab rather than a melody; `chant` gives it that reciting-pitch hook, capped at this app's 200 bpm ceiling since the real tempo runs faster."},{id:"speedcore_gunsnfetuses",name:"Guns 'n' Fetuses",artist:"Nasenbluten",year:1994,bpm:200,tonic:2,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.2,sync:0,tip:"This Melbourne noisecore/speedcore act built entire EPs from one distorted, extremely fast four-on-the-floor cell with almost no harmonic movement; `ostinato` at minimal variation is that same static, velocity-first approach, tempo capped at 200 bpm."},{id:"speedcore_ifyoureintoit",name:"If You're Into It, I'm Out of It",artist:"Christoph De Babalon",year:1997,bpm:190,tonic:4,progId:"aeolian",baseTemplate:"speedcore",narrative:"wave",vary:.6,sync:1,tip:"A landmark speedcore/breakcore crossover record pairing extreme, distorted four-on-the-floor velocity with long, slow-moving ambient chord washes underneath; `wave` gives that undulating pad movement room against the relentless beat."},{id:"speedcore_sarcophage",name:"Sarcophage",artist:"Manu Le Malin",year:1996,bpm:200,tonic:9,progId:"axisMinor",baseTemplate:"speedcore",narrative:"chordLock",vary:.3,sync:1,tip:"French hardcore techno pioneer Manu Le Malin pushes his kick-driven, riff-stab hardcore sound up to speedcore tempo; `chordLock` keeps the stab locked to the chord changes rather than developing its own line, capped at 200 bpm since the real track runs hotter."},{id:"speedcore_sonicthehedgehog",name:"Sonic the Hedgehog Wrecks Havoc",artist:"Enduser",year:2002,bpm:200,tonic:0,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.3,sync:0,tip:"US splittercore producer Enduser builds his tracks from breakbeat-spliced, extremely fast distorted kicks under one repeating cell rather than a developed melody; `ostinato` matches that, real tempo capped at this app's 200 bpm ceiling."},{id:"speedcore_meatmachine",name:"Meat Machine",artist:"Bong-Ra",year:2003,bpm:200,tonic:2,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.3,sync:1,tip:"Dutch breakcore/speedcore producer Bong-Ra piles distorted, ultra-fast four-on-the-floor beats under a barely-developed repeating riff; `ostinato` captures that, real tempo capped at this app's 200 bpm ceiling."},{id:"speedcore_reeperbahn",name:"Reeperbahn",artist:"Sperminator",year:1996,bpm:200,tonic:7,progId:"axisMinor",baseTemplate:"speedcore",narrative:"chant",vary:.2,sync:0,tip:"A Rotterdam-scene terrorcore/speedcore side-project record built on a pounding, distorted kick and a shouted vocal stab pushed well past normal gabber tempo; `chant` gives it that reciting-pitch hook, capped at this app's 200 bpm ceiling."},{id:"speedcore_fuckmeblind",name:"Fuck Me Blind",artist:"The Speed Freak",year:1998,bpm:200,tonic:9,progId:"aeolian",baseTemplate:"speedcore",narrative:"ostinato",vary:.2,sync:0,tip:"Another Speed Freak record in the same one-cell, kick-driven mold pushed past groove into pure velocity; `ostinato` at minimal variation keeps that cell essentially static, tempo capped at this app's 200 bpm ceiling since the real track runs faster."},{id:"nygarage_showmelove",name:"Show Me Love",artist:"Robin S",year:1993,bpm:120,tonic:5,progId:"axis",baseTemplate:"nygarage",narrative:"ostinato",vary:.3,sync:1,tip:"The entire record is one syncopated JX-8P bass riff looped under Robin S's belted vocal and stabbing piano chords \u2014 there's no bridge or key change, just that one hook. `ostinato` writes the same barely-varying repeating cell; sync1 keeps it pushing the backbeat without tipping into UK garage's harder skip."},{id:"nygarage_gotalove",name:"Got a Love for You",artist:"Jomanda",year:1991,bpm:120,tonic:1,progId:"deepHouse",baseTemplate:"nygarage",narrative:"callResp",vary:.6,sync:1,tip:"Built on Angel Moraes's spoken intro answered by Jomanda's gospel-house vocal trio trading the title hook back and forth over a piano vamp. `callResp` writes that same trade between a lead phrase and a group answer, at a soulful, moderate syncopation."},{id:"nygarage_icantgetnosleep",name:"I Can't Get No Sleep",artist:"Masters at Work ft. India",year:1993,bpm:122,tonic:2,progId:"deepHouse",baseTemplate:"nygarage",narrative:"arch",vary:1,sync:1,tip:"India's vocal is the whole record \u2014 Kenny Dope and Louie Vega's production stays sparse so her phrase can rise from a held low note into a full-voice belt and settle again each pass. `arch` is exactly that rise-and-fall shape, with real pass-to-pass variation since her ad-libs never repeat identically."},{id:"nygarage_thebomb",name:"The Bomb! (These Sounds Fall Into My Mind)",artist:"The Bucketheads",year:1995,bpm:125,tonic:9,progId:"aeolian",baseTemplate:"nygarage",narrative:"ostinato",vary:.3,sync:1,tip:"Kenny Dope built the whole track from one looped horn/sax sample (from Barbara Tucker's own catalogue) with almost no other melodic material \u2014 a classic Strictly Rhythm sample-flip. `ostinato` at low vary keeps that one repeating cell nearly unchanged, the way the record actually plays."},{id:"nygarage_feelwhatyouwant",name:"Feel What You Want",artist:"Kristine W",year:1994,bpm:125,tonic:9,progId:"deepHouse",baseTemplate:"nygarage",narrative:"expand",vary:.8,sync:1,tip:"Kristine W's verse sits low and conversational before the chorus opens into a much wider, higher belted hook \u2014 a classic diva-house dynamic jump. `expand` writes that same register widening at the hook rather than a flat, same-range vocal throughout."},{id:"nygarage_beautifulpeople",name:"Beautiful People",artist:"Barbara Tucker",year:1994,bpm:124,tonic:11,progId:"deepHouse",baseTemplate:"nygarage",narrative:"callResp",vary:.7,sync:1,tip:"A Strictly Rhythm underground-house anthem built around Tucker's shouted 'everybody, everybody' hook answered by a chorus of voices, gospel-house call and response over a piano vamp. `callResp` captures that lead-and-crowd exchange directly."},{id:"nygarage_someday",name:"Someday",artist:"CeCe Rogers",year:1987,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"nygarage",narrative:"motif",vary:.6,sync:0,tip:"Marshall Jefferson's piano riff and Rogers's 'someday, we'll all be free' line are one recognisable cell that returns reworked each verse and breakdown rather than a fully composed melody. `motif` restates and transforms that same cell per section, matching how this proto-garage anthem is actually built."},{id:"nygarage_followme",name:"Follow Me",artist:"Aly-Us",year:1992,bpm:120,tonic:8,progId:"gospel",baseTemplate:"nygarage",narrative:"callResp",vary:.5,sync:0,tip:"'Follow Me (Every Creature)' is a chanted, gospel-tinged garage-house hook \u2014 'you gotta free your mind' called and answered over a piano loop, with no real verse-chorus melody outside that. `callResp` at low syncopation captures its straightforward, soulful chant-and-answer shape."},{id:"nygarage_respect",name:"Respect",artist:"Adeva",year:1989,bpm:119,tonic:11,progId:"gospel",baseTemplate:"nygarage",narrative:"chant",vary:.4,sync:0,tip:"Adeva's belted, church-trained delivery treats the title word almost like a reciting pitch punched out rhythmically over the piano vamp rather than a sung melody that moves much. `chant` is built for exactly that held, rhythm-driven vocal style."},{id:"nygarage_free",name:"Free",artist:"Ultra Nat\xE9",year:1997,bpm:125,tonic:8,progId:"axis",baseTemplate:"nygarage",narrative:"expand",vary:.7,sync:1,tip:"Mood II Swing's production keeps the verse tight and low so the 'you're free, free to do what you want' hook can open the register right up \u2014 a slow-build house record structured entirely around that one payoff. `expand` writes that widening directly."},{id:"garage_fillmein",name:"Fill Me In",artist:"Craig David",year:2e3,bpm:129,tonic:8,progId:"axis",baseTemplate:"garage",pat:"shuffle16",swing:.3,narrative:"converse",vary:.8,sync:2,tip:"David's storytelling verses (sneaking past a girl's parents) are delivered in short, speech-like phrases with real space between them, riding a swung 2-step shuffle rather than a straight four-on-the-floor. `converse` writes that narrow, conversational phrasing; the shuffle override carries the skip."},{id:"garage_flowers",name:"Flowers",artist:"Sweet Female Attitude",year:2e3,bpm:132,tonic:0,progId:"deepHouse",baseTemplate:"garage",narrative:"period",vary:.6,sync:1,tip:"The verse and pre-chorus trade short two-bar question-and-answer phrases before the 'we could be flowers' hook lands \u2014 a tightly sentence-structured vocal over the 2-step skip. `period` writes that same paired-phrase shape."},{id:"garage_sincere",name:"Sincere",artist:"MJ Cole",year:1998,bpm:132,tonic:8,progId:"mixo",baseTemplate:"garage",narrative:"arch",vary:.5,sync:1,tip:"An instrumental garage classic \u2014 Cole's own string and sax lines carry the whole melody in place of a vocal, each phrase rising to a peak and falling back over the skipping rhythm. `arch` gives the same rise-and-fall to that lead instrumental line rather than a sung top-line."},{id:"garage_battle",name:"Battle",artist:"Wookie ft. Lain",year:2e3,bpm:130,tonic:0,progId:"deepHouse",baseTemplate:"garage",narrative:"qanda",vary:.6,sync:2,tip:"Wookie's production famously answers Lain's vocal phrases with the sub-bass 'wobble' hits themselves, so the bass reads as a second voice in dialogue with the singer. `qanda` writes that same call-and-answer structure between vocal line and groove."},{id:"garage_movintoofast",name:"Movin' Too Fast",artist:"Artful Dodger ft. Romina Johnson",year:1999,bpm:127,tonic:2,progId:"axis",baseTemplate:"garage",narrative:"converse",vary:.7,sync:2,tip:"One of the tracks that broke 2-step into the UK charts \u2014 Johnson's vocal sits in short, breathy phrases over the skip rather than long sustained lines. `converse` keeps that narrow, speech-like delivery with space between phrases, at the harder syncopation the 2-step skip needs."},{id:"garage_sweetlikechocolate",name:"Sweet Like Chocolate",artist:"Shanks & Bigfoot",year:1999,bpm:131,tonic:5,progId:"axis",baseTemplate:"garage",narrative:"archSong",vary:.7,sync:1,tip:"A UK #1 built as one long build from a spoken-word verse into the 'ooh baby I like it' hook, which keeps climbing register through the later choruses rather than repeating flat. `archSong` gives the whole record that single, gradual rise-and-fall rather than a per-section arch."},{id:"garage_alittlebitofluck",name:"A Little Bit of Luck",artist:"DJ Luck & MC Neat",year:1999,bpm:135,tonic:8,progId:"axis",baseTemplate:"garage",narrative:"chant",vary:.5,sync:2,tip:"MC Neat's toasting verses sit as rhythmic, reciting-pitch patter under the sung 'just a little bit of luck' hook, more MC delivery than melody. `chant` captures that rhythm-first vocal style at the harder syncopation the garage skip calls for."},{id:"garage_stonecold",name:"Stone Cold",artist:"Groove Chronicles",year:1997,bpm:135,tonic:7,progId:"deepHouse",baseTemplate:"garage",narrative:"ostinato",vary:.3,sync:1,tip:"A foundational deep-garage instrumental built from one looped, pitched-down diva vocal chop over the skip, developed almost not at all across its length. `ostinato` at low vary matches that DJ-tool, one-cell construction exactly."},{id:"garage_21seconds",name:"21 Seconds",artist:"So Solid Crew",year:2001,bpm:137,tonic:7,progId:"aeolian",baseTemplate:"garage",narrative:"germ",vary:.9,sync:2,tip:"Structured as a relay \u2014 each of the crew's MCs gets exactly 21 seconds to develop the same rhythmic idea further before handing off to the next, over one skipping garage groove. `germ` is built for a cell developed further each section, matching that handoff structure."},{id:"speedgarage_nevergonnaletyougo",name:"Never Gonna Let You Go (Kelly G's Sure Is Pure Dub Mix)",artist:"Tina Moore",year:1997,bpm:131,tonic:7,progId:"deepHouse",baseTemplate:"speedgarage",bass:"subhold",narrative:"chant",vary:.4,sync:1,tip:"One of the records that defined speed garage \u2014 Moore's timestretched vocal hook is held almost like a reciting pitch over a sub-bass that Kelly G's mix keeps rock-still underneath. `chant` matches that held vocal; the subhold bass override is the track's actual signature move."},{id:"speedgarage_gunman",name:"Gunman",artist:"187 Lockdown",year:1996,bpm:130,tonic:2,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"ostinato",vary:.3,sync:1,tip:"A ragga-jungle-tinged speed garage classic built from one looped vocal sample and horn stab, barely developed beyond that loop while the sub-bass sits fixed underneath. `ostinato` at low vary is that one-cell construction."},{id:"speedgarage_ripgroove",name:"RIP Groove",artist:"Double 99",year:1997,bpm:130,tonic:9,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"ostinato",vary:.3,sync:1,tip:"Built on the 'get your groove on' vocal chop and a horn stab looped for the whole record, with the real hook being the booming, static sub underneath \u2014 a genre-defining speed garage 12\". `ostinato` keeps that loop nearly unchanging pass to pass."},{id:"speedgarage_witchdoktor",name:"The Witch Doktor",artist:"Armand Van Helden",year:1996,bpm:130,tonic:2,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"chant",vary:.3,sync:1,tip:"An instrumental speed garage/garage-house classic \u2014 a chanted vocal-chop hook punched out rhythmically over a fixed, held sub-bass with almost no chordal movement. `chant` fits that reciting-pitch, rhythm-first hook."},{id:"speedgarage_gabriel",name:"Gabriel",artist:"Roy Davis Jr. ft. Peven Everett",year:1997,bpm:128,tonic:5,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"arch",vary:.8,sync:1,tip:"One of the records that bridged Chicago house and UK garage \u2014 Peven Everett's falsetto genuinely rises and falls each phrase over a broken, 2-step-tinged groove, more melodically developed than most speed garage cuts. `arch` gives that real rise-and-fall shape."},{id:"speedgarage_youmightneedsomebody",name:"You Might Need Somebody (Todd Terry Remix)",artist:"Shola Ama",year:1997,bpm:130,tonic:7,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"expand",vary:.8,sync:1,tip:"Todd Terry's remix takes Ama's soul original and timestretches it over a rolling speed-garage sub, with her voice widening from a controlled verse into a full belt at the hook. `expand` captures that dynamic jump at the chorus."},{id:"speedgarage_anytimeanyplace",name:"Anytime, Anyplace",artist:"Nu Birth",year:1997,bpm:130,tonic:4,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"callResp",vary:.6,sync:1,tip:"A garage-soul vocal group trading lines back and forth over a held sub and skipping hats, in the more song-based end of the speed garage scene. `callResp` writes that same trading pattern between voices."},{id:"speedgarage_thetheme",name:"The Theme",artist:"Dreem Teem",year:1998,bpm:132,tonic:9,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"ostinato",vary:.2,sync:1,tip:"A DJ-tool underground anthem from one of the scene's most influential production/DJ crews \u2014 one looped riff and vocal stab carry the whole record with essentially no further development. `ostinato` at very low vary is that flat, tool-like repetition."},{id:"speedgarage_lovebug",name:"Love Bug",artist:"Ramsey & Fen",year:1997,bpm:131,tonic:0,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"chant",vary:.4,sync:1,tip:"A pirate-radio-era speed garage staple built around a chanted, repeated vocal hook over a fixed sub-bass groove rather than a sung melody. `chant` matches that reciting, rhythm-driven top line."},{id:"speedgarage_destiny",name:"Destiny",artist:"Dem 2",year:1997,bpm:130,tonic:2,progId:"deepHouse",baseTemplate:"speedgarage",narrative:"wave",vary:.6,sync:1,tip:"On the more atmospheric, deep end of the speed garage scene \u2014 a slow, undulating pad-and-vocal line laid over the skipping 16ths and a sub-bass that never really shifts. `wave` writes that long, slow undulation rather than a sharp hook."},{id:"grime_iluvu",name:"I Luv U",artist:"Dizzee Rascal",year:2003,bpm:140,tonic:2,progId:"axisMinor",baseTemplate:"grime",narrative:"chordLock",vary:.5,sync:2,tip:"Built from an 8-bar loop of a single stabbing synth riff that Dizzee and a female MC trade over, the riff itself only moving because the underlying chord does. `chordLock` writes exactly that riff-locked-to-chord behaviour instead of a freely moving lead line."},{id:"grime_fixuplooksharp",name:"Fix Up, Look Sharp",artist:"Dizzee Rascal",year:2003,bpm:141,tonic:9,progId:"axisMinor",baseTemplate:"grime",narrative:"chant",vary:.3,sync:2,tip:"Built on a chopped Billy Squier drum break with almost no other instrumentation, Dizzee's flow sits as a punched-out, rhythm-driven reciting pitch rather than a sung melody. `chant` is built for exactly that."},{id:"grime_eskimo",name:"Eskimo",artist:"Wiley",year:2002,bpm:140,tonic:2,progId:"axisMinor",baseTemplate:"grime",narrative:"ostinato",vary:.2,sync:1,tip:"The foundational 'eskibeat' instrumental \u2014 one icy, square synth motif looped across 8-bar sections with vast amounts of space and almost nothing sustaining. `ostinato` at very low vary matches that stark, barely-developed loop."},{id:"grime_wotdouncallit",name:"Wot Do U Call It?",artist:"Wiley",year:2004,bpm:140,tonic:4,progId:"axisMinor",baseTemplate:"grime",narrative:"motif",vary:.5,sync:1,tip:"Wiley's own genre-naming track restates one short synth cell, transformed a little each 8-bar section, over sparse square-bass stabs. `motif` is that exact one-cell-restated-and-transformed shape."},{id:"grime_powforward",name:"Pow! (Forward)",artist:"Lethal Bizzle",year:2004,bpm:141,tonic:5,progId:"axisMinor",baseTemplate:"grime",narrative:"chant",vary:.3,sync:2,tip:"The shouted 'pow!' hook functions as rhythmic punctuation rather than melody, famously used as a crowd-riot chant over a near-bare square-bass stab pattern. `chant` writes that held, rhythm-first hook rather than a tune."},{id:"grime_psandqs",name:"P's and Q's",artist:"Kano",year:2005,bpm:140,tonic:7,progId:"axisMinor",baseTemplate:"grime",narrative:"germ",vary:.6,sync:2,tip:"Kano's verses build the same rhythmic phrasing idea further each 8 bars over a sparse, space-heavy beat, rather than repeating a fixed hook. `germ` writes a cell developed further each section, matching that lyrical build."},{id:"grime_thatsnotme",name:"That's Not Me",artist:"Skepta ft. JME",year:2014,bpm:140,tonic:9,progId:"axisMinor",baseTemplate:"grime",narrative:"chordLock",vary:.4,sync:1,tip:"Deliberately stripped back to almost nothing \u2014 one stabbing riff that only moves because the sparse chord underneath shifts, carrying the whole beat between verses. `chordLock` is exactly that riff-follows-chord behaviour."},{id:"grime_shutup",name:"Shut Up",artist:"Stormzy",year:2015,bpm:140,tonic:0,progId:"axisMinor",baseTemplate:"grime",narrative:"chant",vary:.3,sync:2,tip:"A freestyle over Dyer's 'Functions on the Low' instrumental \u2014 Stormzy's delivery sits as a rhythm-driven reciting pitch over the square-bass stabs rather than a sung line. `chant` matches that freestyle-over-riddim shape."},{id:"grime_pulsex",name:"Pulse X",artist:"Musical Mob",year:2002,bpm:138,tonic:2,progId:"axisMinor",baseTemplate:"grime",narrative:"ostinato",vary:.1,sync:1,tip:"Widely cited as the first true grime instrumental \u2014 a single square-wave bass stab pattern with almost nothing else, huge amounts of space between hits. `ostinato` at the lowest vary matches its near-total lack of development."},{id:"grime_shutdown",name:"Shutdown",artist:"Skepta",year:2015,bpm:140,tonic:4,progId:"axisMinor",baseTemplate:"grime",narrative:"chordLock",vary:.4,sync:1,tip:"Another stab-led, near-instrumental grime beat where the riff's only real movement comes from the chord underneath shifting beneath Skepta's verses. `chordLock` writes that same riff-locked-to-harmony behaviour."},{id:"bassline_heartbroken",name:"Heartbroken",artist:"T2 ft. Jodie Aysha",year:2007,bpm:138,tonic:2,progId:"deepHouse",baseTemplate:"bassline",narrative:"expand",vary:.7,sync:1,tip:"The Sheffield scene's biggest chart crossover \u2014 Jodie Aysha's chorus opens up wide against the rolling, syncopated square-bass hook that IS the drop, after a much narrower verse. `expand` writes that register widening at the hook."},{id:"bassline_youwot",name:"You Wot!",artist:"DJ Q",year:2011,bpm:138,tonic:9,progId:"deepHouse",baseTemplate:"bassline",narrative:"ostinato",vary:.3,sync:2,tip:"Built entirely around one syncopated, rolling square-bass riddim and a shouted vocal stab, with the bass hook itself doing all the work rather than a sung top-line. `ostinato` at the harder syncopation matches that bass-led, barely-developed shape."},{id:"bassline_sambuca",name:"Sambuca",artist:"Wideboys",year:2008,bpm:138,tonic:7,progId:"deepHouse",baseTemplate:"bassline",narrative:"callResp",vary:.5,sync:2,tip:"A UK chart hit that crossed bassline into garage territory, trading a sung hook against the rolling square-bass line almost like two voices answering each other. `callResp` writes that vocal-and-bass trade directly."},{id:"bassline_readmylips",name:"Read My Lips",artist:"Platnum",year:2008,bpm:140,tonic:11,progId:"deepHouse",baseTemplate:"bassline",narrative:"period",vary:.6,sync:1,tip:"A bassline chart hit structured around short, paired vocal phrases \u2014 a line and its answer every two bars \u2014 riding the rolling square-bass hook. `period` is exactly that question-then-answer phrasing."},{id:"bassline_brandyandcoke",name:"Brandy & Coke",artist:"DJ Q",year:2011,bpm:138,tonic:4,progId:"deepHouse",baseTemplate:"bassline",narrative:"ostinato",vary:.3,sync:2,tip:"Another DJ Q bassline anthem where a single syncopated square-bass hook, not a vocal melody, is the entire drop, looped with only small variations. `ostinato` keeps that bass hook the fixed, repeating centre."},{id:"bassline_bodyrock",name:"Bodyrock",artist:"Burgaboy",year:2007,bpm:138,tonic:9,progId:"deepHouse",baseTemplate:"bassline",narrative:"chant",vary:.4,sync:1,tip:"A Niche-scene bassline anthem built on a chanted, rhythmically punched vocal hook riding the rolling square-bass line rather than a developed sung melody. `chant` matches that reciting-pitch delivery."},{id:"bassline_holdon",name:"Hold On",artist:"Flava D",year:2014,bpm:132,tonic:5,progId:"deepHouse",baseTemplate:"bassline",narrative:"ostinato",vary:.3,sync:2,tip:"A bassline-revival instrumental on Butterz built from one rolling, syncopated square-bass hook with minimal further development \u2014 the hook carries the whole track. `ostinato` at low vary matches that DJ-tool construction."},{id:"bassline_rewind",name:"Rewind",artist:"TS7 & Sigma",year:2014,bpm:137,tonic:0,progId:"deepHouse",baseTemplate:"bassline",narrative:"expand",vary:.6,sync:1,tip:"A UK top-5 bassline/garage-revival crossover where the vocal hook opens out at the chorus against the rolling square-bass line after a tighter verse. `expand` writes that widening at the hook."},{id:"bassline_neighbourhood",name:"Neighbourhood",artist:"Zed Bias",year:2e3,bpm:134,tonic:2,progId:"deepHouse",baseTemplate:"bassline",narrative:"wave",vary:.5,sync:1,tip:"One of the records that bridged speed garage into what became the Sheffield bassline sound \u2014 a slow, undulating vocal hook laid over the rolling bass rather than a sharp chorus. `wave` writes that long, slow undulation."},{id:"bassline_bodygroove",name:"Body Groove",artist:"Anti Up ft. Katie Pearl",year:2011,bpm:138,tonic:7,progId:"deepHouse",baseTemplate:"bassline",narrative:"callResp",vary:.5,sync:2,tip:"A UK top-20 bassline/house crossover where Katie Pearl's sung hook trades directly against the rolling square-bass line's own rhythmic accents. `callResp` writes that vocal-versus-bass exchange."},{id:"ukfunky_doyoumind",name:"Do You Mind",artist:"Crazy Cousinz ft. Kyla",year:2009,bpm:128,tonic:10,progId:"dorian",baseTemplate:"ukfunky",narrative:"pendulum",vary:.5,sync:2,tip:"Kyla's hook rocks between two close notes ('do you mind if I...') over tribal congas and an off-beat pluck \u2014 later sampled whole for Drake's 'One Dance'. `pendulum` is exactly that narrow two-note rock, widening slightly each pass."},{id:"ukfunky_devilinabluedress",name:"Devil In A Blue Dress",artist:"Donae'o",year:2008,bpm:128,tonic:7,progId:"dorian",baseTemplate:"ukfunky",narrative:"chant",vary:.4,sync:2,tip:"One of UK funky's genre-defining anthems \u2014 the title hook is chanted rhythmically over soca-style congas and an off-beat pluck rather than sung as a developed melody. `chant` matches that reciting, rhythm-first hook."},{id:"ukfunky_feelinirie",name:"Feelin Irie",artist:"Roska",year:2009,bpm:128,tonic:9,progId:"dorian",baseTemplate:"ukfunky",narrative:"ostinato",vary:.3,sync:2,tip:"An instrumental UK funky classic built from one soca-tinged pluck riff over congas and tribal percussion, with almost no melodic development across the track. `ostinato` at low vary is that fixed, repeating riff."},{id:"ukfunky_junction7",name:"Junction 7",artist:"Funkystepz",year:2009,bpm:128,tonic:2,progId:"dorian",baseTemplate:"ukfunky",narrative:"ostinato",vary:.3,sync:2,tip:"A well-known UK funky instrumental where the percussive, off-beat pluck hook barely changes while the congas and shakers drive the tribal syncopation underneath. `ostinato` matches that fixed, groove-led hook."},{id:"ukfunky_together",name:"Together",artist:"Apple",year:2009,bpm:128,tonic:4,progId:"dorian",baseTemplate:"ukfunky",narrative:"callResp",vary:.5,sync:2,tip:"A UK funky anthem trading a sung hook against a percussive off-beat pluck answer, congas driving the tribal syncopation between the two. `callResp` writes that lead-and-answer exchange directly."},{id:"ukfunky_seasons",name:"Seasons",artist:"Lil Silva",year:2009,bpm:128,tonic:5,progId:"dorian",baseTemplate:"ukfunky",narrative:"wave",vary:.6,sync:1,tip:"A more atmospheric UK funky production where the vocal-chop hook undulates slowly over the congas and pluck pattern rather than landing on a sharp, repeated chorus. `wave` writes that long, slow undulation."},{id:"ukfunky_wileout",name:"Wile Out",artist:"DJ Zinc",year:2009,bpm:128,tonic:0,progId:"dorian",baseTemplate:"ukfunky",narrative:"ostinato",vary:.3,sync:2,tip:"A percussive, funky-scene club tool built around one off-beat pluck-and-vocal-stab riff over tribal congas, with the groove doing all the work. `ostinato` keeps that riff the fixed, repeating centre."},{id:"ukfunky_katyonamission",name:"Katy on a Mission",artist:"Katy B",year:2010,bpm:130,tonic:7,progId:"dorian",baseTemplate:"ukfunky",narrative:"archSong",vary:.7,sync:1,tip:"Produced by Geeneus with UK funky's tribal, congas-driven syncopation underneath, the track builds from a tense, narrated verse into one released, chanted hook by the end. `archSong` gives the whole song that single rise-and-fall rather than repeating it per section."},{id:"ukfunky_narst",name:"Narst",artist:"Cooly G",year:2009,bpm:128,tonic:9,progId:"dorian",baseTemplate:"ukfunky",narrative:"ostinato",vary:.2,sync:2,tip:"A Hyperdub-released UK funky instrumental built from one sparse pluck-and-vocal-stab cell over congas and tribal percussion, developed almost not at all. `ostinato` at very low vary matches that stark, minimal-development construction."},{id:"ukfunky_bongojam",name:"Bongo Jam",artist:"Crazy Cousinz",year:2008,bpm:128,tonic:2,progId:"dorian",baseTemplate:"ukfunky",narrative:"ostinato",vary:.2,sync:2,tip:"One of the genre's founding instrumentals \u2014 built entirely from congas, bongos, and one off-beat pluck riff, with barely any other melodic material at all. `ostinato` at very low vary matches that percussion-first, one-cell construction."},{id:"dubstep_midnightrequestline",name:"Midnight Request Line",artist:"Skream",year:2005,bpm:140,tonic:0,progId:"deepHouse",baseTemplate:"dubstep",narrative:"ostinato",vary:.3,sync:1,tip:"One of the records that wrote dubstep's rulebook: a single wobbling sub-bass hook repeats almost unchanged for the whole track, moved only by filtering. `ostinato` writes that same barely-developed repeating cell instead of a tune."},{id:"dubstep_9samurai",name:"9 Samurai",artist:"Kode9 & The Spaceape",year:2006,bpm:140,tonic:8,progId:"mixo",baseTemplate:"dubstep",narrative:"chant",vary:.3,sync:1,tip:"A sampled Seven Samurai string loop sits under Spaceape's flat, half-spoken vocal that barely deviates from its own rhythmic cell. `chant` writes that held, reciting-pitch delivery rather than a sung line."},{id:"dubstep_night",name:"Night",artist:"Benga, Coki",year:2007,bpm:140,tonic:5,progId:"deepHouse",baseTemplate:"dubstep",narrative:"chordLock",vary:.4,sync:2,tip:"One of the tracks that popularized the 'wobble' bass outright \u2014 the mid-range answers itself in stabs that snap to the chord underneath rather than any sung hook. `chordLock` at the harder sync setting is exactly that riff-follows-harmony behavior."},{id:"dubstep_cockneythug",name:"Cockney Thug",artist:"Rusko ft. Amber Coffman",year:2007,bpm:139,tonic:6,progId:"axisMinor",baseTemplate:"dubstep",narrative:"callResp",vary:.5,sync:1,tip:"Amber Coffman's looped vocal hook trades with a squelchy mid-range bass line, one of the first dubstep records built around a genuine pop vocal rather than a spoken sample. `callResp` writes that vocal-to-bass exchange."},{id:"dubstep_cockneyviolin",name:"Cockney Violin",artist:"Caspa",year:2006,bpm:138,tonic:1,progId:"deepHouse",baseTemplate:"dubstep",narrative:"lament",vary:.3,sync:0,tip:"A sampled violin phrase descends over a bare sub bass \u2014 more melodic in shape than most early dubstep instrumentals, but still just one looped figure. `lament` traces that falling contour without touching the actual sample."},{id:"dubstep_poisondart",name:"Poison Dart",artist:"The Bug ft. Warrior Queen",year:2007,bpm:144,tonic:11,progId:"aeolian",baseTemplate:"dubstep",narrative:"chant",vary:.2,sync:2,tip:"Warrior Queen's dancehall-style toasting is one hard, repeating vocal cell over a bare, distorted sub \u2014 almost no melodic movement, all rhythm and grit. Low `vary` and high `sync` match how little that vocal actually develops."},{id:"dubstep_digidesign",name:"Digidesign",artist:"Joker",year:2009,bpm:140,tonic:11,progId:"deepHouse",baseTemplate:"dubstep",narrative:"terraced",vary:.6,sync:1,tip:"Joker's 'purple' style stacks bright synth riffs that step up in register section by section instead of developing an actual tune. `terraced` is that layering climb, restated a step higher each pass."},{id:"dubstep_innocence",name:"Innocence",artist:"Nero",year:2011,bpm:137,tonic:7,progId:"axisMinor",baseTemplate:"dubstep",narrative:"expand",vary:1,sync:1,tip:"A moody, narrow verse gives way to a drop where the register suddenly throws wide open on a huge mid-range synth lead. `expand` is built for exactly that build-to-drop widening, with full melodic development across sections."},{id:"dubstep_golddust",name:"Gold Dust (Flux Pavilion Remix)",artist:"DJ Fresh",year:2010,bpm:146,tonic:5,progId:"edm",baseTemplate:"dubstep",narrative:"peak",vary:.7,sync:2,tip:"The soulful drum & bass original gets a dubstep remix that keeps the vocal hook but saves its biggest mid-range synth stab for the second drop. `peak` withholds the top note until then instead of front-loading it."},{id:"brostep_bangarang",name:"Bangarang",artist:"Skrillex ft. Sirah",year:2011,bpm:110,tonic:9,progId:"axisMinor",baseTemplate:"brostep",narrative:"chordLock",vary:.4,sync:2,tip:"The drop's hook is a chugging square-wave bass line snapping to the chord changes under Sirah's shouted stabs \u2014 mid-range growl replacing harmony rather than sitting on it. `chordLock` at the hardest sync setting is that riff-follows-chord behavior."},{id:"brostep_firstoftheyear",name:"First of the Year (Equinox)",artist:"Skrillex",year:2010,bpm:141,tonic:5,progId:"deepHouse",baseTemplate:"brostep",narrative:"motif",vary:.5,sync:2,tip:"A single vocal-chop cell gets re-pitched and re-triggered through the drop instead of being replaced by new material. `motif` restates that one short cell, transformed a little each section."},{id:"brostep_basscannon",name:"Bass Cannon",artist:"Flux Pavilion",year:2011,bpm:140,tonic:2,progId:"deepHouse",baseTemplate:"brostep",narrative:"ostinato",vary:.3,sync:1,tip:"Essentially a one-bar growl-bass riff fired on repeat under a sampled announcer vocal, with almost no melodic development across the whole drop."},{id:"brostep_icantstop",name:"I Can't Stop",artist:"Flux Pavilion",year:2011,bpm:140,tonic:0,progId:"deepHouse",baseTemplate:"brostep",narrative:"qanda",vary:.6,sync:2,tip:"A rising mid-range square riff gets answered by a lower growled countermelody bar by bar. `qanda`'s question-and-answer shape is that bass-on-bass conversation, with the mid-range doing the work harmony would otherwise do."},{id:"brostep_sweetshop",name:"Sweet Shop",artist:"Doctor P",year:2010,bpm:140,tonic:3,progId:"axisMinor",baseTemplate:"brostep",narrative:"ostinato",vary:.2,sync:1,tip:"One of the tracks that defined the growl-bass 'brostep' sound outright \u2014 a single distorted square riff repeats with almost no variation, sound design doing the work a tune would elsewhere."},{id:"brostep_coffeebreak",name:"Coffee Break",artist:"Zeds Dead",year:2010,bpm:140,tonic:7,progId:"deepHouse",baseTemplate:"brostep",narrative:"terraced",vary:.6,sync:1,tip:"Layered mid-range bass riffs stack up in register through the build before the drop rather than any sung line developing. `terraced` is that step-up layering."},{id:"brostep_xrated",name:"X Rated",artist:"Excision",year:2011,bpm:145,tonic:1,progId:"axisMinor",baseTemplate:"brostep",narrative:"chordLock",vary:.3,sync:2,tip:"Heavily distorted mid-range bass stabs lock hard to the chord underneath in short aggressive bursts, a showcase for sound design over songwriting. `chordLock` at high sync writes exactly that stab-to-chord relationship."},{id:"brostep_decisions",name:"Decisions",artist:"Borgore ft. Miley Cyrus",year:2013,bpm:130,tonic:0,progId:"deepHouse",baseTemplate:"brostep",narrative:"archSong",vary:.7,sync:1,tip:"An actual sung pop verse and chorus from Miley Cyrus frames Borgore's growl-bass drops, giving the track a real rise-and-fall vocal arc rather than a chopped sample. `archSong` follows that whole-song shape."},{id:"brostep_rambo",name:"Rambo",artist:"Getter",year:2014,bpm:150,tonic:10,progId:"axisMinor",baseTemplate:"brostep",narrative:"ostinato",vary:.2,sync:2,tip:"A single ultra-aggressive growl riff repeats through the drop with almost no development, typical of Getter's harsher end of the brostep spectrum."},{id:"brostep_firepower",name:"Firepower",artist:"Datsik ft. Foreign Beggars",year:2012,bpm:140,tonic:2,progId:"deepHouse",baseTemplate:"brostep",narrative:"callResp",vary:.5,sync:2,tip:"Foreign Beggars' rapped verses trade with Datsik's growling mid-range bass stabs section by section. `callResp` writes that vocal-to-bass exchange rather than a continuous melody."},{id:"trap_harlemshake",name:"Harlem Shake",artist:"Baauer",year:2012,bpm:96,tonic:6,progId:"axisMinor",baseTemplate:"trap",narrative:"ostinato",vary:.1,sync:1,tip:"Built almost entirely from one repeated sub-bass hit and the same reused spoken-sample punchline \u2014 one of the most deliberately repetitive tracks to ever chart, with no melodic verse at all."},{id:"trap_higherground",name:"Higher Ground",artist:"TNGHT",year:2012,bpm:145,tonic:10,progId:"axisMinor",baseTemplate:"trap",narrative:"motif",vary:.3,sync:1,tip:"A single chopped horn-stab sample is restated as the entire hook \u2014 no sung melody anywhere in the track, just that one motif repositioned and layered."},{id:"trap_moshpit",name:"Mosh Pit",artist:"Flosstradamus ft. Waka Flocka Flame",year:2013,bpm:145,tonic:4,progId:"axisMinor",baseTemplate:"trap",narrative:"chant",vary:.2,sync:1,tip:"Waka Flocka's shouted ad-libs function as a rhythmic chant over a repeating trap snare pattern, with no sung verse anywhere in the arrangement."},{id:"trap_core",name:"Core",artist:"RL Grime",year:2014,bpm:150,tonic:0,progId:"axisMinor",baseTemplate:"trap",narrative:"ostinato",vary:.3,sync:1,tip:"An instrumental built on one dark, repeating synth riff for its whole runtime \u2014 there's no verse to carry a tune, only shifts in density around that same riff."},{id:"trap_turndownforwhat",name:"Turn Down for What",artist:"DJ Snake & Lil Jon",year:2013,bpm:100,tonic:5,progId:"axisMinor",baseTemplate:"trap",narrative:"chant",vary:.2,sync:1,tip:"Lil Jon's shouted title phrase is the entire vocal content, repeated verbatim over a pitch-bent lead riff \u2014 as hook-only and verse-free as EDM trap gets."},{id:"trap_djturnitup",name:"DJ Turn It Up",artist:"Yellow Claw",year:2013,bpm:150,tonic:7,progId:"axisMinor",baseTemplate:"trap",narrative:"ostinato",vary:.3,sync:1,tip:"The title phrase and a single brass-stab riff repeat through the drop with nothing resembling a sung verse in between."},{id:"trap_deepdownlow",name:"Deep Down Low",artist:"Valentino Khan",year:2014,bpm:150,tonic:9,progId:"axisMinor",baseTemplate:"trap",narrative:"gapfill",vary:.4,sync:2,tip:"The hook is a pitched-down vocal chop that leaps low and climbs back \u2014 the same leap-then-fill shape future bass chops use, just dropped into trap's lower register and harder syncopation."},{id:"trap_bricks",name:"Bricks",artist:"Carnage ft. Migos",year:2015,bpm:150,tonic:2,progId:"axisMinor",baseTemplate:"trap",narrative:"chant",vary:.3,sync:2,tip:"Migos' rapped ad-libs are the entire vocal hook over Carnage's trap-EDM drum programming, with no separate melodic verse to speak of."},{id:"trap_doctorpepper",name:"Doctor Pepper",artist:"Diplo, CL, RiFF RAFF & OG Maco",year:2014,bpm:145,tonic:11,progId:"axisMinor",baseTemplate:"trap",narrative:"callResp",vary:.4,sync:2,tip:"Three rapped guest verses trade lines over the same repeating trap-horn riff, which never develops into a melody of its own \u2014 hook-led and verse-thin by design."},{id:"riddim_throwinelbows",name:"Throwin' Elbows",artist:"Excision & Space Laces",year:2015,bpm:150,tonic:5,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.1,sync:1,tip:"One of the tracks credited with kickstarting the riddim scene \u2014 a single held sub-bass note repeats unchanged through the entire drop, varying in tone but never in pitch."},{id:"riddim_blueprint",name:"Blueprint",artist:"Space Laces",year:2016,bpm:145,tonic:9,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.1,sync:1,tip:"Riddim's core trick in miniature: the drop rides one unchanging sub riff for its full length, with all the interest coming from the drum pattern around it rather than the bass line itself."},{id:"riddim_landmines",name:"Landmines",artist:"Ganja White Night ft. ill.Gates",year:2015,bpm:140,tonic:2,progId:"deepHouse",baseTemplate:"riddim",narrative:"ostinato",vary:.2,sync:1,tip:"A single, barely-varying sub riff carries the entire drop, true to the 'one riff on loop' ethos Ganja White Night helped popularize across the riddim scene."},{id:"riddim_sexsax",name:"Sex Sax",artist:"Ganja White Night",year:2016,bpm:145,tonic:7,progId:"dorian",baseTemplate:"riddim",narrative:"ostinato",vary:.3,sync:1,tip:"A saxophone-toned sub riff loops unchanged through the drop, funkier and less mournful than most riddim, which is why the static minor-but-not-sad `dorian` vamp fits better than a straight minor progression."},{id:"riddim_protostar",name:"Protostar",artist:"Eliminate",year:2016,bpm:150,tonic:0,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.2,sync:1,tip:"A single aggressive sub-riff pattern loops essentially unaltered through the whole drop \u2014 the genre's hallmark of repetition over development, straighter than brostep's more varied growl riffs."},{id:"riddim_whipit",name:"Whip It",artist:"Kompany",year:2016,bpm:145,tonic:4,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.2,sync:1,tip:"The drop is built from one held sub-note riff that barely shifts across its whole length, variation coming from filtering rather than any melodic movement."},{id:"riddim_terrorsquad",name:"Terror Squad",artist:"Zomboy",year:2013,bpm:145,tonic:10,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.3,sync:1,tip:"An early bridge between brostep and riddim \u2014 a repeating mid/sub riff carries the whole drop with only small textural changes pass to pass."},{id:"riddim_griztronics",name:"Griztronics",artist:"Subtronics ft. GRiZ",year:2018,bpm:140,tonic:6,progId:"dorian",baseTemplate:"riddim",narrative:"ostinato",vary:.3,sync:1,tip:"GRiZ's funkier sensibility loosens the riff slightly compared to straighter riddim, but the drop still rides one repeating sub-bass idea rather than a developed tune."},{id:"riddim_rectangles",name:"Rectangles",artist:"Wooli",year:2018,bpm:150,tonic:1,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.2,sync:1,tip:"A tightly quantized, unchanging sub riff drives the whole drop \u2014 the kind of straight repetition that made the track a favorite to mix back-to-back with others in the riddim scene."},{id:"riddim_war",name:"War",artist:"PhaseOne",year:2017,bpm:150,tonic:9,progId:"axisMinor",baseTemplate:"riddim",narrative:"ostinato",vary:.2,sync:1,tip:"A single held sub riff repeats through the drop almost without variation, PhaseOne's heavier, distortion-forward end of the riddim sound."},{id:"futurebass_sayit",name:"Say It",artist:"Flume ft. Tove Lo",year:2016,bpm:150,tonic:7,progId:"futureBass",baseTemplate:"futurebass",narrative:"gapfill",vary:.8,sync:2,tip:"Tove Lo's vocal is chopped and pitch-shifted into a hook that leaps and steps back down through the gap, while short bright chord stabs \u2014 not the vocal \u2014 actually carry the drop."},{id:"futurebass_light",name:"Light",artist:"San Holo",year:2016,bpm:150,tonic:0,progId:"futureBass",baseTemplate:"futurebass",narrative:"arch",vary:.7,sync:1,tip:"A bright, guitar-tinged lead rises and falls within each phrase of the drop rather than developing across the whole song. `arch` matches that single-phrase rise-and-fall shape."},{id:"futurebass_beautifullife",name:"Beautiful Life",artist:"Illenium ft. Jon Bellion",year:2016,bpm:150,tonic:9,progId:"futureBass",baseTemplate:"futurebass",narrative:"expand",vary:.8,sync:1,tip:"Jon Bellion's verse stays narrow and conversational before the drop throws the register wide open on stacked chord stabs \u2014 a build-to-drop widening `expand` is built to capture."},{id:"futurebass_itsstrange",name:"It's Strange",artist:"Louis The Child ft. K.Flay",year:2015,bpm:150,tonic:5,progId:"futureBass",baseTemplate:"futurebass",narrative:"qanda",vary:.7,sync:1,tip:"K.Flay's half-sung verse phrases get answered by a bright synth-chord riff each time, a question-and-answer pattern that carries into the deliberately thin, chords-only drop."},{id:"futurebass_gemini",name:"Gemini",artist:"What So Not ft. George Maple",year:2015,bpm:150,tonic:2,progId:"edm",baseTemplate:"futurebass",narrative:"lament",vary:.6,sync:1,tip:"George Maple's vocal line descends over a minor-key chord bed, more melancholy than most future bass, before the drop strips everything back to just those chords."},{id:"futurebass_silverbullet",name:"Silver Bullet",artist:"Whethan ft. Flux Pavilion",year:2017,bpm:150,tonic:4,progId:"futureBass",baseTemplate:"futurebass",narrative:"gapfill",vary:.8,sync:2,tip:"A pitch-bent vocal chop hook leaps and resolves downward at the drop while short bright chords underneath do the real harmonic movement."},{id:"futurebass_alone",name:"Alone",artist:"Marshmello",year:2016,bpm:150,tonic:5,progId:"futureBass",baseTemplate:"futurebass",narrative:"peak",vary:.7,sync:1,tip:"A plaintive lead synth line holds back its highest note until the final drop pass after two lower-register build sections. `peak` is built for exactly that kind of withheld payoff."},{id:"futurebass_sunsetlover",name:"Sunset Lover",artist:"Petit Biscuit",year:2015,bpm:91,tonic:10,progId:"futureBass",baseTemplate:"futurebass",narrative:"wave",vary:.5,sync:0,tip:"A slow, entirely instrumental future bass cut with a long undulating lead line rather than a hard drop hook. `wave`'s unhurried rise and fall matches that mellower pacing."},{id:"futurebass_indiansummer",name:"Indian Summer",artist:"Jai Wolf",year:2015,bpm:100,tonic:8,progId:"futureBass",baseTemplate:"futurebass",narrative:"climb",vary:.6,sync:1,tip:"The instrumental lead line gradually creeps upward in register over the course of the whole track rather than resetting section to section. `climb` is that steady ascent."},{id:"futuregarage_archangel",name:"Archangel",artist:"Burial",year:2007,bpm:130,tonic:2,progId:"aeolian",baseTemplate:"futuregarage",narrative:"wave",vary:.4,sync:2,tip:"A pitched-up vocal sample drifts in and out over crackling 2-step drums and a held sub, mood settling rather than any hook landing an impact. `wave`'s slow undulation is that atmosphere-first approach."},{id:"futuregarage_maybes",name:"Maybes",artist:"Mount Kimbie",year:2009,bpm:100,tonic:5,progId:"dorian",baseTemplate:"futuregarage",narrative:"converse",vary:.5,sync:2,tip:"Fragments of guitar and vocal sample sit sparsely over a skipping beat with real space between phrases. `converse`'s narrow, speech-like phrasing captures that gapped, unhurried texture."},{id:"futuregarage_cmyk",name:"CMYK",artist:"James Blake",year:2010,bpm:130,tonic:10,progId:"aeolian",baseTemplate:"futuregarage",narrative:"gapfill",vary:.5,sync:2,tip:"Chopped R&B vocal samples leap and settle back over syncopated 2-step drums and a deep sub. `gapfill`'s leap-then-step-back shape suits that vocal-chop hook without the sub taking over the harmony."},{id:"futuregarage_hyphmngo",name:"Hyph Mngo",artist:"Joy Orbison",year:2009,bpm:130,tonic:7,progId:"dorian",baseTemplate:"futuregarage",narrative:"ostinato",vary:.3,sync:2,tip:"A single vocal-chop cell loops over shuffling 2-step drums for most of the track's length \u2014 a genre landmark built on groove and repetition rather than melodic development."},{id:"futuregarage_wildfire",name:"Wildfire",artist:"SBTRKT ft. Sampha",year:2011,bpm:130,tonic:4,progId:"aeolian",baseTemplate:"futuregarage",narrative:"archSong",vary:.7,sync:1,tip:"Sampha's sung verse and chorus give the track an actual song arc rather than a looped chop, sitting over a sparse 2-step pattern and a held sub true to the style."},{id:"futuregarage_sleepsound",name:"Sleep Sound",artist:"Jamie xx",year:2011,bpm:130,tonic:0,progId:"aeolian",baseTemplate:"futuregarage",narrative:"wave",vary:.4,sync:2,tip:"Pitched vocal samples float over skittering 2-step percussion while the harmony barely moves underneath. `wave`'s slow undulation over a mostly static bed fits that settled, sparse mood."},{id:"futuregarage_spliffdub",name:"Spliff Dub",artist:"Zomby",year:2011,bpm:138,tonic:9,progId:"aeolian",baseTemplate:"futuregarage",narrative:"ostinato",vary:.3,sync:1,tip:"A dubbed-out repeating synth figure sits over sparse drums and sub weight, closer to dub reggae's spaciousness than a developed melody."},{id:"futuregarage_stopwhatyouredoing",name:"Stop What You're Doing",artist:"Untold",year:2008,bpm:130,tonic:2,progId:"dorian",baseTemplate:"futuregarage",narrative:"chant",vary:.3,sync:2,tip:"A chopped spoken vocal sample repeats as a rhythmic cell over skipping, syncopated drums, with no sung melody anywhere in the track."},{id:"futuregarage_blimey",name:"Blimey",artist:"Ramadanman",year:2009,bpm:130,tonic:5,progId:"dorian",baseTemplate:"futuregarage",narrative:"ostinato",vary:.3,sync:2,tip:"A bare, dubby instrumental built from one repeating percussive riff and a held sub, with syncopated 2-step drums doing most of the actual movement."},{id:"futuregarage_callisto",name:"Callisto",artist:"Airhead",year:2011,bpm:120,tonic:3,progId:"dorian",baseTemplate:"futuregarage",narrative:"wave",vary:.5,sync:1,tip:"Hazy pads and a soft, undulating lead sit over a slow, sparse 2-step pulse. `wave`'s long slow drift matches the track's unhurried, atmosphere-over-impact pacing."}],Wl=m1;var{useState:D,useMem
