time it appears, re-clothed in new pads as Lane 8 layers the arrangement gradually rather than rewritten outright. `motif` keeps that cell recognisable pass to pass."},{id:"organichouse_noordinarymorning",name:"No Ordinary Morning",artist:"Lane 8 ft. Patrick Baker",year:2016,bpm:122,tonic:2,progId:"deepHouse",baseTemplate:"organichouse",narrative:"germ",vary:.7,sync:0,tip:"Lane 8 builds this by taking Patrick Baker's opening vocal cell and pushing it a little further melodically every time it returns, instead of swapping in a new part. `germ` is exactly that cell-develops-per-section shape."},{id:"organichouse_fingerprint",name:"Fingerprint",artist:"Tinlicker ft. Helsloot",year:2019,bpm:122,tonic:0,progId:"dorian",baseTemplate:"organichouse",narrative:"motif",vary:.6,sync:0,tip:"Tinlicker's lead line keeps tracing the same short shape through each new pad layer rather than introducing fresh material. `motif` restates that cell, transformed just enough each time it resurfaces, never entering abruptly."},{id:"organichouse_divingforroses",name:"Diving for Roses",artist:"Yotto",year:2019,bpm:122,tonic:5,progId:"dorian",baseTemplate:"organichouse",narrative:"climb",vary:.8,sync:0,tip:"Yotto's instrumental keeps its plucked lead pushing into a higher register as pads and percussion gradually stack underneath, never restating a chorus. `climb` is that steady register creep across the whole record."},{id:"organichouse_comewithme",name:"Come With Me",artist:"Nora En Pure",year:2018,bpm:122,tonic:7,progId:"deepHouse",baseTemplate:"organichouse",narrative:"ostinato",vary:.5,sync:0,tip:"Nora En Pure loops a warm, filtered vocal phrase and lets the pads underneath do the gradual building rather than varying the phrase itself. `ostinato` keeps that repeating cell steady while layers arrive slowly around it."},{id:"organichouse_waiting",name:"Waiting",artist:"CamelPhat & Ali Love",year:2018,bpm:123,tonic:9,progId:"deepHouse",baseTemplate:"organichouse",narrative:"suspend",vary:.7,sync:1,tip:"Ali Love's vocal keeps landing a step above where CamelPhat's chord resolves and settling down a beat later, a held-note tension suited to the warmer, housier palette underneath. `suspend` is exactly that landing-and-resolving shape."},{id:"proghouse_strobe",name:"Strobe",artist:"deadmau5",year:2009,bpm:128,tonic:10,progId:"festival",baseTemplate:"proghouse",narrative:"climb",vary:1,sync:0,tip:"Strobe spends roughly ten minutes adding one element at a time until a simple opening arpeggio becomes a wall of layered synths - nothing is rewritten, the same figures just climb in register and density. `climb` is that shape; sync 0 keeps it landing straight throughout."},{id:"proghouse_levels",name:"Levels",artist:"Avicii",year:2011,bpm:126,tonic:1,progId:"festival",baseTemplate:"proghouse",narrative:"terraced",vary:.6,sync:1,tip:"Levels is built on one piano riff that keeps getting a new layer stacked on top of it - drums, then bass, then a vocal chop - rather than being rewritten, so the track terraces upward one addition at a time. `terraced` is that exact build."},{id:"proghouse_oneyourname",name:"One (Your Name)",artist:"Swedish House Mafia ft. Pharrell Williams",year:2010,bpm:126,tonic:5,progId:"festival",baseTemplate:"proghouse",narrative:"archSong",vary:.8,sync:1,tip:"Pharrell's vocal moves through a real verse-into-chorus arc rather than a looped hook, riding a Swedish House Mafia arrangement that adds one new layer per section on the way there. `archSong` traces that single song-length rise and fall."},{id:"proghouse_moveforme",name:"Move For Me",artist:"deadmau5 & Kaskade",year:2008,bpm:127,tonic:7,progId:"festival",baseTemplate:"proghouse",narrative:"wave",vary:.7,sync:0,tip:"Move for Me unfolds as one long filtered swell rather than a string of drops, a single pad and arpeggio slowly rising and receding across the whole record. `wave` is that long undulation; sync 0 keeps it landing on the beat throughout."},{id:"proghouse_pjanoo",name:"Pjanoo",artist:"Eric Prydz",year:2008,bpm:126,tonic:3,progId:"festival",baseTemplate:"proghouse",narrative:"terraced",vary:.6,sync:0,tip:"Pjanoo's piano riff is introduced stark and dry, then reappears with a new layer of pad, bass or percussion added underneath each time rather than being replaced. `terraced` is that repeated-figure-plus-new-layer shape, classic progressive-house build-by-height."},{id:"proghouse_opus",name:"Opus",artist:"Eric Prydz",year:2015,bpm:126,tonic:0,progId:"festival",baseTemplate:"proghouse",narrative:"climb",vary:1,sync:0,tip:"Opus runs through several distinct sections across nine minutes, each sitting a register or intensity level above the last, rather than looping one riff under a filter. `climb` captures that continuous upward staging across the whole record."},{id:"proghouse_icouldbetheone",name:"I Could Be the One",artist:"Avicii vs. Nicky Romero",year:2013,bpm:128,tonic:7,progId:"edm",baseTemplate:"proghouse",narrative:"peak",vary:.7,sync:1,tip:"'I Could Be the One' saves its lead synth's highest note for the final drop after both Avicii's and Romero's halves have already been introduced separately, so the melodic ceiling only appears once. `peak` withholds that top note the same way."},{id:"proghouse_miamitoibiza",name:"Miami 2 Ibiza",artist:"Swedish House Mafia vs. Tinie Tempah",year:2010,bpm:128,tonic:9,progId:"festival",baseTemplate:"proghouse",narrative:"converse",vary:.6,sync:1,tip:"Tinie Tempah's verses sit narrow and speech-like with real space between phrases, riding an instrumental that keeps adding a layer every eight bars rather than dropping everything at once. `converse` is that narrow, spoken-word phrasing."},{id:"electrohouse_satisfaction",name:"Satisfaction",artist:"Benny Benassi",year:2002,bpm:128,tonic:9,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"chordLock",vary:.3,sync:2,tip:"Satisfaction's entire hook is one hard-synced saw riff that only changes pitch because the chord under it changes, never developing into a melody - a blueprint for electro house's blunt drop. `chordLock` is that riff-follows-chord behaviour; sync 2 for its aggression."},{id:"electrohouse_illmerica",name:"Illmerica",artist:"Wolfgang Gartner",year:2011,bpm:128,tonic:9,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"ostinato",vary:.3,sync:2,tip:"Illmerica's drop is a single stabbed saw riff repeated near-verbatim while the arrangement strips down to just kick and riff - a blunt, all-at-once drop rather than a filtered build. `ostinato` keeps that repeating cell fixed at a hard syncopation."},{id:"electrohouse_internetfriends",name:"Internet Friends",artist:"Knife Party",year:2011,bpm:128,tonic:0,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"chordLock",vary:.4,sync:2,tip:"Internet Friends' riff snaps to whatever the bassline's chord is doing underneath rather than carrying its own melodic line, landing the drop as one blunt stabbed hit. `chordLock` is that chord-led riff behaviour."},{id:"electrohouse_bonfire",name:"Bonfire",artist:"Knife Party",year:2012,bpm:128,tonic:2,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"ostinato",vary:.4,sync:2,tip:"Bonfire drops straight into a repeated stabbed riff with almost no melodic development bar to bar, all the track's motion coming from the arrangement stripping in and out around it. `ostinato` matches that fixed, barely-developed cell."},{id:"electrohouse_spaceman",name:"Spaceman",artist:"Hardwell",year:2012,bpm:128,tonic:0,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"chordLock",vary:.4,sync:1,tip:"Spaceman's stabbed lead riff is voiced to the chord underneath at every hit rather than running its own tune, which is what lets the drop land as one full-force block instead of a sweep. `chordLock` is that riff-tied-to-chord shape."},{id:"electrohouse_language",name:"Language",artist:"Porter Robinson",year:2012,bpm:128,tonic:9,progId:"edm",baseTemplate:"electrohouse",narrative:"peak",vary:.6,sync:0,tip:"Language holds its most euphoric lead phrase back until the final drop, spending the build introducing only fragments of it, so the highest, longest note only appears once. `peak` withholds that note the same way."},{id:"electrohouse_clarity",name:"Clarity",artist:"Zedd ft. Foxes",year:2012,bpm:128,tonic:9,progId:"edm",baseTemplate:"electrohouse",narrative:"archSong",vary:.8,sync:1,tip:"Foxes sings Clarity as a real pop verse-chorus over Zedd's electro-house production, rising once to the chorus hook before the drop restates it as a full-band stab. `archSong` traces that single song-wide rise and fall."},{id:"electrohouse_promises",name:"Promises",artist:"Nero",year:2011,bpm:140,tonic:5,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"peak",vary:.6,sync:2,tip:"Promises runs at a 140bpm dubstep tempo but its drop reads as a double-time electro-house stab, and the vocal's top note is held back until that drop lands. `peak` is that withheld high point; sync 2 for the chop's push before it."},{id:"electrohouse_kickouttheepic",name:"Kick Out the Epic Motherfucker",artist:"Dada Life",year:2011,bpm:128,tonic:7,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"ostinato",vary:.3,sync:2,tip:"True to Dada Life's catalogue, the title-phrase riff barely changes shape pass to pass - the impact is entirely in how hard and how suddenly it's stabbed back in after each breakdown. `ostinato` keeps that repeating cell fixed and blunt."},{id:"electrohouse_jeffer",name:"Jeffer",artist:"Boys Noize",year:2007,bpm:128,tonic:0,progId:"axisMinor",baseTemplate:"electrohouse",narrative:"chordLock",vary:.4,sync:2,tip:"Jeffer is one of electro house's founding blueprints - a filthy, distorted riff that only moves when the chord under it moves, dropped in full rather than filtered up to. `chordLock` writes that same chord-led riff."},{id:"bigroom_animals",name:"Animals",artist:"Martin Garrix",year:2013,bpm:128,tonic:5,progId:"festival",baseTemplate:"bigroom",narrative:"ostinato",vary:.3,sync:1,tip:"Animals' drop is just kick and one simple synth riff repeating almost unchanged - the main-stage impact comes from how little is actually there, not from melodic movement. `ostinato` keeps that riff fixed and deliberately sparse."},{id:"bigroom_tsunami",name:"Tsunami",artist:"DVBBS & Borgeous",year:2013,bpm:128,tonic:9,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.4,sync:2,tip:"Tsunami's drop riff snaps to the chord underneath at every hit rather than carrying its own tune, landing as one hard sparse block of kick and lead. `chordLock` is that riff-tied-to-chord behaviour; sync 2 for its aggressive push."},{id:"bigroom_turnupthespeakers",name:"Turn Up the Speakers",artist:"Afrojack",year:2012,bpm:128,tonic:0,progId:"festival",baseTemplate:"bigroom",narrative:"ostinato",vary:.3,sync:1,tip:"Turn Up the Speakers keeps its stabbed lead riff almost identical through every drop, relying on arrangement drop-outs rather than melodic variation to stay fresh. `ostinato` matches that fixed, barely-developed cell."},{id:"bigroom_bigfoot",name:"Bigfoot",artist:"W&W",year:2014,bpm:128,tonic:2,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.4,sync:1,tip:"Bigfoot's riff is voiced hard against the chord underneath at every stab, which is what lets its sparse kick-and-lead drop land as one deliberate block instead of a sweep-in. `chordLock` writes that same chord-led riff."},{id:"bigroom_tremor",name:"Tremor",artist:"Martin Garrix & Dimitri Vegas & Like Mike",year:2014,bpm:128,tonic:7,progId:"festival",baseTemplate:"bigroom",narrative:"ostinato",vary:.3,sync:1,tip:"Tremor strips its drop down to a repeated one-bar riff and a kick with almost no melodic development across the whole track - the only real motion is stripping elements in and out around that fixed cell. `ostinato` is exactly that."},{id:"bigroom_bringthemadness",name:"Bring the Madness",artist:"Hardwell & Blasterjaxx",year:2014,bpm:128,tonic:9,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.4,sync:1,tip:"Bring the Madness ties its stabbed lead to the chord underneath at every hit, so the drop reads as one sparse, deliberate block rather than a filtered sweep-in. `chordLock` writes that riff-follows-chord shape."},{id:"bigroom_louderandlouder",name:"Louder & Louder",artist:"Dimitri Vegas & Like Mike x Ummet Ozcan",year:2015,bpm:128,tonic:0,progId:"festival",baseTemplate:"bigroom",narrative:"ostinato",vary:.3,sync:1,tip:"Louder & Louder's drop riff barely moves from its first statement to its last - the escalation comes from arrangement (more layers stripped in), not melody. `ostinato` keeps that repeating cell fixed."},{id:"bigroom_projectt",name:"Project T",artist:"Ti\xEBsto & Dimitri Vegas & Like Mike",year:2015,bpm:128,tonic:5,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.4,sync:1,tip:"Project T's lead riff only changes pitch because the chord underneath moves, dropping in as one full block over a sparse kick rather than sweeping in gradually. `chordLock` is that same chord-led riff shape."},{id:"basshouse_adieu",name:"Adieu",artist:"Tchami",year:2013,bpm:126,tonic:5,progId:"deepHouse",baseTemplate:"basshouse",narrative:"chordLock",vary:.4,sync:2,tip:"Adieu is one of the tracks that founded future house - a filtered, bouncing bass stab doing the work a vocal hook usually would, tied to the chord underneath it rather than running its own tune. `chordLock` writes that bass-follows-chord riff."},{id:"basshouse_gecko",name:"Gecko (Overdrive)",artist:"Oliver Heldens",year:2014,bpm:126,tonic:7,progId:"deepHouse",baseTemplate:"basshouse",narrative:"ostinato",vary:.4,sync:2,tip:"Gecko's title hook is a single chopped vocal syllable bounced against a filtered bass stab, looping almost unchanged rather than developing into a phrase. `ostinato` keeps that fixed repeating cell; sync 2 for how hard it bounces off the beat."},{id:"basshouse_promesses",name:"Promesses",artist:"Tchami ft. Kaleem Taylor",year:2015,bpm:126,tonic:0,progId:"deepHouse",baseTemplate:"basshouse",narrative:"callResp",vary:.6,sync:1,tip:"Kaleem Taylor's vocal trades gospel-house lead lines against its own answering phrases, the same call-and-response future house borrowed from gospel house, riding a filtered bass stab instead of a chord pad. `callResp` writes that trade-off directly."},{id:"basshouse_shadesofgrey",name:"Shades of Grey",artist:"Oliver Heldens & Shaun Frank ft. Delaney Jane",year:2015,bpm:126,tonic:9,progId:"deepHouse",baseTemplate:"basshouse",narrative:"qanda",vary:.7,sync:1,tip:"Delaney Jane's lines are consistently answered by a filtered bass stab rather than another vocal phrase - a call thrown to the bass instead of a backing singer. `qanda` is that same question-then-answer structure."},{id:"basshouse_cuttingshapes",name:"Cutting Shapes",artist:"Don Diablo",year:2015,bpm:126,tonic:2,progId:"deepHouse",baseTemplate:"basshouse",narrative:"ostinato",vary:.3,sync:2,tip:"Cutting Shapes' whole identity is a bouncing, filtered bass stab under a shouted vocal sample, both repeating almost unchanged while the arrangement opens the filter around them. `ostinato` matches that fixed, barely-developed cell."},{id:"basshouse_feelthevolume",name:"Feel the Volume",artist:"Jauz",year:2015,bpm:126,tonic:7,progId:"deepHouse",baseTemplate:"basshouse",narrative:"chordLock",vary:.4,sync:2,tip:"Feel the Volume's bass hook is voiced to whatever chord sits under it at each stab, letting Jauz's filtered bass do the melodic work a vocal usually would. `chordLock` writes that riff-follows-chord shape at an aggressive syncopation."},{id:"basshouse_prophecy",name:"Prophecy",artist:"Tchami & Malaa",year:2016,bpm:126,tonic:9,progId:"deepHouse",baseTemplate:"basshouse",narrative:"ostinato",vary:.3,sync:2,tip:"Prophecy strips future house down to almost nothing but a dark, filtered bass stab repeating near-verbatim under a sparse chord, with no vocal or lead to speak of. `ostinato` keeps that one cell fixed through the whole track."},{id:"basshouse_sunwontset",name:"Sun (Won't Set)",artist:"Sander van Doorn, Chocolate Puma & Eneli",year:2018,bpm:126,tonic:0,progId:"mixo",baseTemplate:"basshouse",narrative:"arch",vary:.7,sync:1,tip:"Eneli's vocal rises and settles within each phrase over a filtered bass hook rather than pushing to one huge peak, keeping the mood light against the bouncing groove. `arch` is that phrase-level rise-and-fall."},{id:"basshouse_housearrest",name:"House Arrest",artist:"MK & Wax Motif",year:2018,bpm:125,tonic:2,progId:"deepHouse",baseTemplate:"basshouse",narrative:"ostinato",vary:.4,sync:2,tip:"House Arrest's title hook is a tightly chopped vocal sample bounced against a filtered bass stab, the two trading the same fixed cell back and forth rather than developing a tune. `ostinato` keeps that cell fixed at a hard syncopation."},{id:"basshouse_mushmush",name:"Mush, Mush",artist:"Bassjackers",year:2013,bpm:128,tonic:5,progId:"axisMinor",baseTemplate:"basshouse",narrative:"ostinato",vary:.3,sync:2,tip:"Mush, Mush's whole hook is a bouncing filtered synth stab repeated near-verbatim while the arrangement strips in and out around it, closer to bass house's filtered-stab hook than a melodic lead. `ostinato` matches that fixed cell."},{id:"dutchhouse_moombah",name:"Moombah",artist:"Silvio Ecomo & Chuckie",year:2008,bpm:128,tonic:7,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"chordLock",vary:.3,sync:2,tip:"Moombah's fidgety, syncopated bassline is the entire hook, with saw stabs only punctuating around it - this same track slowed to 108bpm is literally where moombahton got its name. `chordLock` ties the stabs to the chord under the bass."},{id:"dutchhouse_putyourhandsup",name:"Put Your Hands Up for Detroit",artist:"Fedde Le Grand",year:2006,bpm:128,tonic:9,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"ostinato",vary:.3,sync:2,tip:"One of Dutch house's founding records - a syncopated bassline hook that barely varies while saw stabs punctuate around it. `ostinato` keeps that bassline fixed; sync 2 for its fidgety push against the beat."},{id:"dutchhouse_riverside",name:"Riverside (Let's Go!)",artist:"Sidney Samson",year:2009,bpm:128,tonic:2,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"ostinato",vary:.3,sync:2,tip:"Riverside's bouncing, syncopated bassline riff is the hook start to finish, saw stabs only ever accenting around it rather than carrying their own line. `ostinato` matches that fixed repeating cell."},{id:"dutchhouse_takeovercontrol",name:"Take Over Control",artist:"Afrojack ft. Eva Simons",year:2010,bpm:128,tonic:0,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"archSong",vary:.7,sync:1,tip:"Eva Simons sings a real verse-into-chorus arc here, riding over Afrojack's syncopated bassline hook which stays constant underneath her the whole way. `archSong` traces that single song-length rise and fall."},{id:"dutchhouse_cryjustalittle",name:"Cry (Just a Little)",artist:"Bingo Players",year:2011,bpm:128,tonic:9,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"ostinato",vary:.3,sync:2,tip:"Cry (Just a Little) loops a chopped vocal sample against a fidgety, syncopated bassline that barely changes shape through the whole record - the bassline itself is the hook. `ostinato` keeps that cell fixed."},{id:"dutchhouse_nobeef",name:"No Beef",artist:"Afrojack & Steve Aoki",year:2011,bpm:128,tonic:7,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"chordLock",vary:.4,sync:2,tip:"No Beef's saw stabs snap to the chord under the bassline at every hit rather than carrying their own tune, keeping the fidgety bass pattern as the actual hook. `chordLock` is that riff-follows-chord shape."},{id:"dutchhouse_turbulence",name:"Turbulence",artist:"Laidback Luke & Steve Aoki ft. Lil Jon",year:2011,bpm:128,tonic:0,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"chant",vary:.4,sync:2,tip:"Lil Jon's shouted vocal sits on a reciting pitch driven entirely by rhythm rather than melody, punched in against the same syncopated bassline hook running through the whole track. `chant` is that reciting, rhythm-first delivery."},{id:"dutchhouse_sparks",name:"Sparks",artist:"Fedde Le Grand & Nicky Romero ft. Matthew Koma",year:2013,bpm:128,tonic:2,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"archSong",vary:.7,sync:1,tip:"Matthew Koma's vocal builds through one real verse-to-chorus arc over a fidgety bassline hook that itself never changes shape. `archSong` traces that single rise and fall against the constant syncopated groove."},{id:"dutchhouse_rattle",name:"Rattle",artist:"Bingo Players",year:2013,bpm:128,tonic:5,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"ostinato",vary:.3,sync:2,tip:"Rattle is built on a rattling, syncopated bassline riff that barely develops while a chopped vocal sample punches in around it - the bassline is the hook, not a melodic lead. `ostinato` matches that fixed repeating cell."},{id:"dutchhouse_atom",name:"Atom",artist:"Nari & Milani",year:2013,bpm:128,tonic:9,progId:"axisMinor",baseTemplate:"dutchhouse",narrative:"chordLock",vary:.4,sync:2,tip:"Atom's saw stabs are voiced to the chord under its syncopated bassline at every hit, keeping the fidgety bass pattern itself as the track's actual hook rather than a separate lead line. `chordLock` writes that riff-follows-chord shape."},{id:"moombahton_moombah",name:"Moombah",artist:"Dave Nada",year:2009,bpm:108,tonic:7,progId:"aeolian",baseTemplate:"moombahton",narrative:"ostinato",vary:.2,sync:2,tip:"Dave Nada's 'Moombah' is the genre's origin story - he slowed Silvio Ecomo & Chuckie's 128bpm Dutch house track of the same name down to 108bpm at a house party, and the reggaeton-adjacent skip that fell out of it became moombahton's whole rhythmic identity. `ostinato` keeps the same barely-developed cell the edit itself never changes; sync 2 for the tresillo push through drums, chords and bass alike."},{id:"moombahton_mastablasta",name:"Masta Blasta",artist:"Dillon Francis",year:2010,bpm:108,tonic:9,progId:"aeolian",baseTemplate:"moombahton",narrative:"ostinato",vary:.3,sync:2,tip:"Masta Blasta was one of the first tracks built as moombahton from scratch rather than a slowed-down edit, and it keeps the same simple synth riff and tresillo-patterned bass looping with almost no melodic development. `ostinato` matches that fixed cell."},{id:"moombahton_bricks",name:"Bricks",artist:"Dillon Francis",year:2011,bpm:108,tonic:2,progId:"aeolian",baseTemplate:"moombahton",narrative:"ostinato",vary:.3,sync:2,tip:"Bricks rides one tresillo-patterned bass-and-chord cell through the whole track, the half-time reggaeton skip doing all the rhythmic work while the synth riff on top barely changes. `ostinato` is that same fixed, barely-developed cell."},{id:"moombahton_queque",name:"Que Que",artist:"Dillon Francis",year:2011,bpm:108,tonic:0,progId:"aeolian",baseTemplate:"moombahton",narrative:"chordLock",vary:.4,sync:2,tip:"Que Que's lead riff only moves because the chord under the tresillo-patterned bass moves, keeping the syncopated skip as the track's actual hook rather than a melody riding on top of it. `chordLock` writes that riff-follows-chord shape."},{id:"moombahton_expressyourself",name:"Express Yourself",artist:"Diplo ft. Nicky Da B",year:2012,bpm:108,tonic:9,progId:"aeolian",baseTemplate:"moombahton",narrative:"chant",vary:.4,sync:2,tip:"Nicky Da B's vocal sits on a shouted, reciting pitch straight out of New Orleans bounce, punched into the same 3-3-2 tresillo pattern running through the whole track's drums and bass. `chant` is that rhythm-first, reciting delivery."},{id:"moombahton_watchoutforthisbumaye",name:"Watch Out for This (Bumaye)",artist:"Major Lazer ft. Busy Signal, The Flexican & FS Green",year:2013,bpm:100,tonic:5,progId:"aeolian",baseTemplate:"moombahton",narrative:"chant",vary:.4,sync:2,tip:"Busy Signal's dancehall-style toast sits as a reciting, rhythm-driven chant over the tresillo skip rather than a sung melody, which is why the track reads as moombahton crossed with dancehall. `chant` matches that reciting delivery."},{id:"moombahton_jahnopartial",name:"Jah No Partial",artist:"Major Lazer ft. Flux Pavilion",year:2013,bpm:100,tonic:0,progId:"aeolian",baseTemplate:"moombahton",narrative:"chordLock",vary:.4,sync:2,tip:"Jah No Partial's stabbed synth riff is tied to the chord under its tresillo-patterned bass rather than running an independent tune, letting the half-time skip carry the track through drums, chords and bass together. `chordLock` writes that same shape."},{id:"moombahton_redlips",name:"Red Lips",artist:"GTA ft. Sam Bruno",year:2013,bpm:108,tonic:2,progId:"aeolian",baseTemplate:"moombahton",narrative:"ostinato",vary:.3,sync:2,tip:"Red Lips loops a chopped Sam Bruno vocal sample over a 3-3-2 tresillo-patterned bass, both repeating almost unchanged through each section - the half-time trap-adjacent drop does the surprise, not new melody. `ostinato` keeps that cell fixed."},{id:"moombahton_bounce",name:"Bounce",artist:"Nadastrom",year:2011,bpm:108,tonic:7,progId:"aeolian",baseTemplate:"moombahton",narrative:"ostinato",vary:.3,sync:2,tip:"Nadastrom - the Dave Nada/Sabo duo who helped define the genre alongside Dillon Francis - built Bounce on the same fixed, barely-developing tresillo cell running through bass and chords that defines early moombahton production. `ostinato` is that repeating, undeveloped cell."},{id:"moombahton_bunupthedance",name:"Bun Up the Dance",artist:"Diplo & Dillon Francis",year:2014,bpm:100,tonic:9,progId:"aeolian",baseTemplate:"moombahton",narrative:"chordLock",vary:.4,sync:2,tip:"Bun Up the Dance's stabbed riff follows the chord under its half-time tresillo bass rather than carrying an independent melody, leaning the track toward moombahton's later, trap-adjacent tempo. `chordLock` writes that chord-led riff shape."},{id:"techno_noufos",name:"No UFO's",artist:"Model 500",year:1985,bpm:125,tonic:1,progId:"axis",baseTemplate:"techno",narrative:"ostinato",vary:.3,sync:1,tip:"Juan Atkins' foundational Metroplex single is barely more than a stark vocoded refrain over a sequenced bassline that never really develops - the blueprint for Detroit's machine-funk minimalism. Low-`vary` `ostinato` keeps that same short cell looping instead of growing a tune out of it."},{id:"techno_bigfun",name:"Big Fun",artist:"Inner City",year:1988,bpm:120,tonic:10,progId:"deepHouse",baseTemplate:"techno",narrative:"callResp",vary:.8,sync:1,tip:"Kevin Saunderson built the track around Paris Grey's call-and-response vocal trading with the hook line over an insistent bassline - the pop hinge that pulled Detroit techno onto the charts. `callResp` writes that same trade-off pattern instead of a single sung melody."},{id:"techno_goodlife",name:"Good Life",artist:"Inner City",year:1988,bpm:125,tonic:11,progId:"deepHouse",baseTemplate:"techno",narrative:"archSong",vary:.7,sync:1,tip:"Paris Grey's vocal builds from a spoken verse into the surging title hook once per pass rather than repeating a fixed chorus shape - one long lift carrying the whole record. `archSong` traces exactly that single rise-and-fall across the song's length."},{id:"techno_thebells",name:"The Bells",artist:"Jeff Mills",year:1997,bpm:138,tonic:9,progId:"aeolian",baseTemplate:"techno",narrative:"chordLock",vary:.3,sync:2,tip:"Mills built the entire Purpose Maker record from one hard-panned bell-stab riff that only shifts because the arrangement around it changes, never because the riff itself develops. `chordLock` locks that same riff to the harmony exactly as the real track does, at the harder syncopation the off-grid bell hits actually sit at."},{id:"techno_sonicdestroyer",name:"Sonic Destroyer",artist:"X-101",year:1991,bpm:155,tonic:8,progId:"aeolian",baseTemplate:"techno",narrative:"ostinato",vary:.2,sync:1,tip:"Underground Resistance's breakthrough is a single screaming acid-adjacent lead looped over a punishing four-four kick, barely varied bar to bar - militant Detroit techno at its most direct. Very-low-`vary` `ostinato` keeps that one alarm figure locked in place rather than letting it evolve."},{id:"techno_clear",name:"Clear",artist:"Cybotron",year:1983,bpm:130,tonic:3,progId:"dorian",baseTemplate:"techno",narrative:"chant",vary:.4,sync:1,tip:"Juan Atkins and Rik Davis built 'Clear' around a vocoded, chanted title word over a stark, static sequencer vamp - the direct bridge between electro and what would become Detroit techno. `chant` writes that same held, rhythm-driven reciting-tone shape instead of a sung line."},{id:"techno_itiswhatitis",name:"It Is What It Is",artist:"Rhythim Is Rhythim",year:1988,bpm:127,tonic:2,progId:"dorian",baseTemplate:"techno",narrative:"terraced",vary:.6,sync:1,tip:"A Derrick May production built exactly the way this style's arrangement works: one melodic fragment restated a register higher each time a new layer enters, rather than a verse/chorus structure. `terraced` writes that same stepped, layer-by-layer lift."},{id:"techno_knightsofthejaguar",name:"Knights of the Jaguar",artist:"DJ Rolando",year:1999,bpm:138,tonic:2,progId:"aeolian",baseTemplate:"techno",narrative:"motif",vary:.5,sync:1,tip:"DJ Rolando's Underground Resistance-affiliated anthem rides one insistent string-stab motif that the filter and arrangement recontextualize section to section without ever fully rewriting it - a direct descendant of the Belleville strings lineage. `motif` restates that cell with light variation each return."},{id:"minimaltechno_minus",name:"Minus",artist:"Robert Hood",year:1994,bpm:139,tonic:5,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"ostinato",vary:.2,sync:1,tip:"Robert Hood strips the title track of his 'Minimal Nation' era down to a hi-hat pattern and a single bass throb that barely mutates for the whole record's length - the founding text of skeleton-level Detroit minimalism. Very-low-`vary` `ostinato` writes that same one-cell, near-static loop."},{id:"minimaltechno_losingcontrol",name:"Losing Control",artist:"DBX",year:1996,bpm:126,tonic:5,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"ostinato",vary:.3,sync:1,tip:"Daniel Bell's DBX alias built this Peacefrog classic from one looped analog-bass figure that only really changes through filtering, not composition - long sections defined by what's missing rather than what's added. `ostinato` at low `vary` keeps that same cell circling."},{id:"minimaltechno_dexter",name:"Dexter",artist:"Ricardo Villalobos",year:2003,bpm:129,tonic:0,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"germ",vary:.5,sync:1,tip:"From Villalobos's 'Alcachofa' album, the track spins one small percussive-melodic fragment out gradually over its long runtime, each section pushing the idea slightly further rather than introducing a new one. `germ` develops that single cell incrementally, matching the record's patient unfolding."},{id:"minimaltechno_easylee",name:"Easy Lee",artist:"Ricardo Villalobos",year:2006,bpm:127,tonic:0,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"converse",vary:.5,sync:2,tip:"Built around Danny Daze's spoken vocal fragment repeated with wide gaps of drum-only space between phrases, 'Easy Lee' treats the voice as another minimal percussive element. `converse` writes that same narrow, speech-like phrasing with air around it rather than a continuous sung line."},{id:"minimaltechno_mouthtomouth",name:"Mouth to Mouth",artist:"Audion",year:2003,bpm:125,tonic:8,progId:"mixo",baseTemplate:"minimaltechno",narrative:"chordLock",vary:.3,sync:1,tip:"Matthew Dear's Audion alias built the Spectral Sound classic from a single squelchy chord stab that only moves because the filter sweeps under it, not because it develops a melody. `chordLock` ties that riff to the harmony exactly as the record does, kept static at low `vary`."},{id:"minimaltechno_bodylanguage",name:"Body Language",artist:"M.A.N.D.Y. vs Booka Shade",year:2005,bpm:130,tonic:4,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"motif",vary:.4,sync:1,tip:"The record's title-phrase vocal snippet returns as a two-note motif threaded through the same minimal bassline for most of its runtime, recontextualized only by what's filtered in around it. `motif` restates that cell with light variation each pass."},{id:"minimaltechno_loverboy",name:"Loverboy",artist:"Steve Bug",year:2001,bpm:124,tonic:11,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"ostinato",vary:.3,sync:1,tip:"Steve Bug's Poker Flat-era classic loops a single spoken-vocal fragment and a stripped groove for its whole seven-minute length, letting arrangement rather than melody carry the track. `ostinato` keeps that same short cell in place, varying only lightly."},{id:"minimaltechno_happiness",name:"Happiness",artist:"Superpitcher",year:2002,bpm:126,tonic:0,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"wave",vary:.5,sync:0,tip:"Aksel Schaufler's Kompakt classic drapes a long, half-sung vocal line over a slow-breathing minimal pulse - melancholic microhouse that never resolves into a hook. `wave` writes that same long, undulating shape rather than a repeated phrase."},{id:"minimaltechno_levo",name:"Levo",artist:"Recondite",year:2013,bpm:123,tonic:7,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"climb",vary:.4,sync:1,tip:"Lorenz Brunner's Ghostly International track lets a simple synth figure creep gradually higher in register across its length as textures accumulate around it, never resolving into a peak. `climb` writes that same slow upward creep across the whole record."},{id:"minimaltechno_subzero",name:"Subzero",artist:"Ben Klock",year:2009,bpm:125,tonic:5,progId:"aeolian",baseTemplate:"minimaltechno",narrative:"ostinato",vary:.2,sync:1,tip:"Ben Klock's Ostgut Ton anthem is built on one dry, clipped percussive stab looped for most of the track, Berghain-style minimalism where the groove itself is the hook. Low-`vary` `ostinato` keeps that stab locked rather than developing a tune from it."},{id:"dubtechno_phylypstrak",name:"Phylyps Trak II",artist:"Basic Channel",year:1994,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.2,sync:0,tip:"Moritz von Oswald and Mark Ernestus built the Basic Channel sound on one warm, reverb-soaked chord stab that breathes in and out of the mix rather than repeating a fixed phrase. `wave` writes that same slow undulation instead of a hook."},{id:"dubtechno_ploy",name:"Ploy",artist:"Maurizio",year:1992,bpm:133,tonic:9,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.3,sync:0,tip:"Under the Maurizio alias, von Oswald and Ernestus let a single dubbed-out chord hit dissolve into delay and reform each bar - the chord itself barely changes, only its decay does. `wave` captures that same breathing, echo-driven motion."},{id:"dubtechno_portgentil",name:"Port Gentil",artist:"Porter Ricks",year:1996,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.2,sync:0,tip:"Thomas K\xF6ner and Andy Mellwig's Chain Reaction classic layers submerged, echoing tones that swell and recede rather than stating a melody - dub techno as underwater sonar. `wave` writes that same long, slow swell instead of a repeated cell."},{id:"dubtechno_nauticaldub",name:"Nautical Dub",artist:"Porter Ricks",year:1996,bpm:118,tonic:7,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.2,sync:0,tip:"From the same 'Biokinetics' sessions, this track keeps its dub chord stabs even sparser, letting delay tails do most of the harmonic work between hits. Very-low-`vary` `wave` keeps that same sparse, echo-carried motion rather than developing a line."},{id:"dubtechno_elevations",name:"Elevations",artist:"Vainqueur",year:1994,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.2,sync:0,tip:"Rene L\xF6we's Vainqueur project - a key Chain Reaction act alongside Basic Channel - built this record on a single dubbed chord stab whose reverb tail is the real melodic content. `wave` writes that same slow rise-and-decay in place of a stated hook."},{id:"dubtechno_vibrantforms",name:"Vibrant Forms II",artist:"Fluxion",year:2002,bpm:120,tonic:0,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.3,sync:0,tip:"Alexander Kowalski's Fluxion project is regarded as a Chain Reaction-school touchstone precisely for how little its chord stabs move - each section dissolves into echo and reforms rather than progressing. `wave` matches that patient, breathing structure."},{id:"dubtechno_liumeeting",name:"Liumeeting",artist:"Deepchord presents Echospace",year:2007,bpm:120,tonic:4,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.3,sync:0,tip:"Rod Modell and Stephen Hitchell's 'The Coldest Season' project drenches sparse chord hits in tape hiss and long reverb, favoring atmosphere over movement. `wave` writes that same slow, textural undulation rather than a repeating figure."},{id:"dubtechno_cyan",name:"Cyan",artist:"Monolake",year:1997,bpm:140,tonic:11,progId:"aeolian",baseTemplate:"dubtechno",narrative:"ostinato",vary:.3,sync:1,tip:"Robert Henke's Monolake pushes dub techno's chord-stab-and-delay language into a faster, more rhythmically insistent hybrid - the chord still barely develops, but the groove around it is busier than the Basic Channel school. `ostinato` keeps that one stab looping under the faster pulse."},{id:"dubtechno_poorpeoplemustfight",name:"Poor People Must Fight",artist:"Rhythm & Sound",year:2001,bpm:115,tonic:9,progId:"aeolian",baseTemplate:"dubtechno",narrative:"chant",vary:.3,sync:1,tip:"Von Oswald and Ernestus's Rhythm & Sound project pairs a reggae-trained vocalist's held, reciting-tone delivery with their signature dub-stab chords drenched in delay. `chant` writes that same rhythm-driven, sustained-pitch vocal shape instead of a sung melody."},{id:"dubtechno_sleepygirl",name:"Sleepygirl",artist:"Yagya",year:2005,bpm:120,tonic:7,progId:"aeolian",baseTemplate:"dubtechno",narrative:"wave",vary:.3,sync:0,tip:"Icelandic producer Yagya's 'Rhythm of Snow' track buries a soft chord pad in cavernous reverb that swells and fades rather than repeating a fixed phrase - dub techno at its most hushed. `wave` writes that same long, slow undulation."},{id:"hardtechno_doppler",name:"Doppler",artist:"Charlotte de Witte",year:2018,bpm:135,tonic:1,progId:"axis",baseTemplate:"hardtechno",narrative:"climb",vary:.5,sync:1,tip:"De Witte's breakout KNTXT release builds almost entirely through a filter and layering climb over a relentless kick, with the melodic content staying a simple two-note figure throughout. `climb` writes that same steady upward pressure across the whole record."},{id:"hardtechno_br3ath3",name:"BR3ATH3",artist:"Kobosil",year:2022,bpm:155,tonic:1,progId:"axis",baseTemplate:"hardtechno",narrative:"chordLock",vary:.3,sync:2,tip:"Kobosil's Ostgut Ton-adjacent hard-techno anthem locks a hard, distorted stab to the kick itself - the build is entirely textural, and the drop is the same figure louder and more distorted. `chordLock` snaps that riff to the harmony exactly as the real track does, at the harder syncopation."},{id:"hardtechno_inmymind",name:"In My Mind",artist:"Amelie Lens",year:2018,bpm:123,tonic:5,progId:"aeolian",baseTemplate:"hardtechno",narrative:"chant",vary:.3,sync:1,tip:"Amelie Lens's Lenske anthem rides a chanted, one-note vocal stab over a pounding, barely-varying groove - the vocal functions as a rhythmic tool rather than a melody. `chant` writes that same held, reciting-pitch shape instead of a sung hook."},{id:"hardtechno_harddimension",name:"Hard Dimension",artist:"Farrago",year:2022,bpm:142,tonic:0,progId:"aeolian",baseTemplate:"hardtechno",narrative:"ostinato",vary:.3,sync:1,tip:"Farrago's Exhale-label track is built on one distorted acid-adjacent stab looped through the whole record's length, with the pounding kick doing the real arrangement work. `ostinato` at moderate `vary` keeps that one cell circling rather than developing a tune."},{id:"hardtechno_hardcore",name:"Hardcore",artist:"T78 & Dino Maggiorana",year:2019,bpm:130,tonic:4,progId:"axis",baseTemplate:"hardtechno",narrative:"chant",vary:.3,sync:1,tip:"This Filth on Acid peak-time record repeats a single shouted vocal stab as its main hook over a hammering four-four groove, never developing it into a phrase. `chant` writes that same rhythm-driven, held vocal shape rather than a melodic line."},{id:"hardtechno_hypnotized",name:"Hypnotized",artist:"Amelie Lens",year:2019,bpm:132,tonic:10,progId:"aeolian",baseTemplate:"hardtechno",narrative:"wave",vary:.4,sync:1,tip:"The Second State Audio original lets a hypnotic, filtered synth line swell and recede across long sections rather than stating a hook - the title says it plainly. `wave` writes that same slow undulating shape instead of a repeated cell."},{id:"hardtechno_kagoriii",name:"Kagoriii",artist:"Sara Landry",year:2023,bpm:160,tonic:9,progId:"aeolian",baseTemplate:"hardtechno",narrative:"ostinato",vary:.2,sync:2,tip:"Sara Landry's schranz-indebted hard techno track pushes a single hard-edged stab through a relentless, barely-varying 160bpm groove - the build is duration and volume, not development. Low-`vary` `ostinato` at the hardest syncopation matches that pounding directness."},{id:"hardtechno_fulloffire",name:"Full of Fire",artist:"Kobosil",year:2021,bpm:150,tonic:9,progId:"aeolian",baseTemplate:"hardtechno",narrative:"chordLock",vary:.3,sync:2,tip:"Another Kobosil peak-time weapon built on a single riff that only shifts because the harmony under it moves, never through melodic invention - the drop is the same figure with more weight behind it. `chordLock` writes that exact riff-follows-chord relationship."},{id:"hardtechno_binjuice",name:"Bin Juice",artist:"Perc",year:2016,bpm:140,tonic:0,progId:"aeolian",baseTemplate:"hardtechno",narrative:"ostinato",vary:.3,sync:1,tip:"Perc Trax's own label boss built this track from a single abrasive, distorted stab looped hard against the kick, letting texture rather than melody carry the tension. `ostinato` keeps that same cell locked in place across sections."},{id:"hardtechno_renegademastah",name:"Renegade Mastah",artist:"HI-LO",year:2019,bpm:126,tonic:1,progId:"axis",baseTemplate:"hardtechno",narrative:"chant",vary:.4,sync:1,tip:"Oliver Heldens's HI-LO alias built this hard-techno crossover hit on a chanted, percussive vocal stab riding a hypnotic, slowly building groove rather than a sung hook. `chant` writes that same held, rhythm-driven vocal shape."},{id:"industrialtechno_rulebylaw",name:"Rule By Law",artist:"British Murder Boys",year:2003,bpm:134,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"ostinato",vary:.2,sync:1,tip:"Surgeon and Regis's British Murder Boys project built this record from a single scraping, noise-caked riff looped with almost no melodic development - texture and distortion do the work harmony would elsewhere. Very-low-`vary` `ostinato` matches that punishing directness."},{id:"industrialtechno_learnyourlesson",name:"Learn Your Lesson",artist:"British Murder Boys",year:2003,bpm:130,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"chordLock",vary:.3,sync:2,tip:"From the same Counterbalance session as 'Rule By Law', this track locks a hard mechanical riff to a stripped, dub-inflected chord change rather than composing a melody over it. `chordLock` writes that same riff-follows-chord relationship at a hard syncopation."},{id:"industrialtechno_takeyourbodyoff",name:"Take Your Body Off",artist:"Perc",year:2014,bpm:146,tonic:0,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"ostinato",vary:.3,sync:1,tip:"Ali Wells's Perc Trax track buries a distorted, near-spoken vocal stab under layers of noise and metallic percussion, the vocal itself barely varying pass to pass. `ostinato` keeps that same short cell in place while the noise layers around it do the work."},{id:"industrialtechno_immolare",name:"Immolare",artist:"Sandwell District",year:2010,bpm:124,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"wave",vary:.3,sync:0,tip:"Regis, Function and Silent Servant's Sandwell District collective built 'Feed-Forward' on dread-heavy, slowly swelling textures rather than hooks - the title track breathes rather than repeats. `wave` writes that same long, oppressive undulation."},{id:"industrialtechno_thefirstsiren",name:"The First Siren",artist:"Ancient Methods",year:2013,bpm:135,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"ostinato",vary:.2,sync:1,tip:"Michael Wollenhaupt's Ancient Methods project bridges industrial noise and techno with a single siren-like distorted lead looped over a mechanical, unyielding groove. Low-`vary` `ostinato` keeps that one alarm figure static rather than letting it develop."},{id:"industrialtechno_whytheyhide",name:"Why They Hide Their Bodies Under My Garage?",artist:"Blawan",year:2012,bpm:127,tonic:0,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"chant",vary:.3,sync:2,tip:"Blawan built this Hinge Finger underground hit around a pitched-down, chopped vocal sample from a 1996 Fugees track chanted over a heavy, minimal industrial groove. `chant` writes that same held, rhythm-driven vocal shape at a hard syncopation without touching the actual sample."},{id:"industrialtechno_pruittigoe",name:"Pruitt Igoe",artist:"Kangding Ray",year:2008,bpm:124,tonic:7,progId:"mixo",baseTemplate:"industrialtechno",narrative:"wave",vary:.4,sync:0,tip:"David Letellier's Raster-Noton release layers grainy, granular textures that swell and dissolve around a stark techno pulse rather than developing a melody - named for the demolished housing project. `wave` writes that same slow textural rise and fall."},{id:"industrialtechno_basic",name:"Basic",artist:"Truncate",year:2021,bpm:135,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"ostinato",vary:.3,sync:1,tip:"Truncate's Bpitch Control track builds raw, hypnotic techno from one dry, mechanical percussion riff repeated with almost no melodic content added on top. `ostinato` keeps that same cell circling rather than growing a tune out of it."},{id:"industrialtechno_spirittrain",name:"Spirit Train",artist:"Oscar Mulero",year:2021,bpm:136,tonic:5,progId:"mixo",baseTemplate:"industrialtechno",narrative:"ostinato",vary:.3,sync:1,tip:"The Spanish industrial-techno figurehead builds this Token release from a single driving, metallic riff that barely shifts across the record's length, texture doing what melody would elsewhere. `ostinato` matches that same static, mechanical repetition."},{id:"industrialtechno_code",name:"Code",artist:"Answer Code Request",year:2015,bpm:132,tonic:9,progId:"aeolian",baseTemplate:"industrialtechno",narrative:"chordLock",vary:.3,sync:1,tip:"Answer Code Request's Ostgut Ton-adjacent track ties a single hard, distorted synth stab directly to the underlying chord's movement rather than composing a separate melody. `chordLock` writes that exact riff-follows-chord relationship."},{id:"melotech_horizon",name:"Horizon",artist:"Artbat",year:2019,bpm:124,tonic:5,progId:"aeolian",baseTemplate:"melotech",narrative:"climb",vary:.5,sync:1,tip:"Artbat's Upperground breakout track is one long filtered synth line that opens and rises for the entire seven minutes without ever landing on a full melodic payoff - the build is the point. `climb` writes that same slow, unresolved creep across the whole record."},{id:"melotech_returntooz",name:"Return to Oz",artist:"Monolink",year:2018,bpm:120,tonic:8,progId:"axis",baseTemplate:"melotech",narrative:"arch",vary:.5,sync:1,tip:"Steffen Linck's Monolink track pairs a live-sung, guitar-inflected vocal with a slow-building melodic techno pulse, the vocal rising and falling once per verse rather than looping. `arch` writes that same single rise-and-fall shape within each phrase."},{id:"melotech_breathing",name:"Breathing",artist:"Ben B\xF6hmer, Nils Hoffmann & Malou",year:2019,bpm:122,tonic:11,progId:"aeolian",baseTemplate:"melotech",narrative:"wave",vary:.5,sync:0,tip:"This Anjunadeep collaboration lets Malou's vocal and the piano-and-pad backdrop swell and recede over long, slow phrases rather than settling into a repeated hook - melodic house at its most patient. `wave` writes that same long undulating shape."},{id:"melotech_singularity",name:"Singularity",artist:"Stephan Bodzin",year:2016,bpm:121,tonic:10,progId:"aeolian",baseTemplate:"melotech",narrative:"climb",vary:.6,sync:1,tip:"Bodzin's Life and Death signature track keeps piling filtered layers on top of a single arpeggiated line for its whole length, the register and intensity climbing without a clear drop. `climb` writes that same unresolved upward creep across the record."},{id:"melotech_glue",name:"Glue",artist:"Bicep",year:2017,bpm:130,tonic:4,progId:"aeolian",baseTemplate:"melotech",narrative:"terraced",vary:.6,sync:1,tip:"Bicep's breakout track layers one rave-piano-adjacent figure a step higher with each new section that enters - the arrangement itself is the melody's real development. `terraced` writes that same stepped, layer-by-layer lift the style tip describes."},{id:"melotech_rej",name:"Rej",artist:"\xC2me",year:2005,bpm:125,tonic:1,progId:"axis",baseTemplate:"melotech",narrative:"wave",vary:.4,sync:0,tip:"Frank Wiedemann and Kristian Beyer's Innervisions-defining single lets one plucked melodic figure swell in and out of the mix over its full length, foundational to melodic techno's harmonic language. `wave` writes that same slow, breathing undulation."},{id:"melotech_miracle",name:"Miracle",artist:"Adriatique & WhoMadeWho",year:2023,bpm:123,tonic:5,progId:"axis",baseTemplate:"melotech",narrative:"archSong",vary:.5,sync:1,tip:"This Rose Avenue collaboration builds Jeppe Kjellberg's live vocal from a restrained verse into one euphoric, unrepeated peak near the end rather than a recurring chorus. `archSong` traces that single long rise-and-fall across the whole track."},{id:"melotech_monument",name:"Monument",artist:"Tale Of Us & Vaal",year:2017,bpm:125,tonic:3,progId:"aeolian",baseTemplate:"melotech",narrative:"climb",vary:.5,sync:1,tip:"This Afterlife Records staple keeps a single melancholic string figure rising in intensity and register across its length without a conventional drop resolving it. `climb` writes that same long, unresolved upward creep the style is built on."},{id:"melotech_cola",name:"Cola",artist:"CamelPhat & Elderbrook",year:2017,bpm:122,tonic:10,progId:"mixo",baseTemplate:"melotech",narrative:"period",vary:.5,sync:1,tip:"Elderbrook's vocal on this Defected breakout trades short question-then-answer two-bar phrases across the verse before the instrumental hook takes over. `period` writes that same call-and-answer phrasing rather than a continuous melodic line."},{id:"electrofunk_planetrock",name:"Planet Rock",artist:"Afrika Bambaataa & the Soulsonic Force",year:1982,bpm:127,tonic:6,progId:"axisMinor",baseTemplate:"electrofunk",narrative:"chant",vary:.3,sync:2,tip:"Built on Kraftwerk-derived melodic fragments and an 808 groove, Bambaataa's foundational electro record rides a chanted, syncopated vocal hook rather than a sung melody. `chant` writes that same held, rhythm-driven reciting shape at the syncopated pocket the record actually sits in."},{id:"electrofunk_egyptegypt",name:"Egypt, Egypt",artist:"The Egyptian Lover",year:1984,bpm:127,tonic:9,progId:"axis",baseTemplate:"electrofunk",narrative:"ostinato",vary:.3,sync:2,tip:"Egyptian Lover's electro classic loops one syncopated 808 bass figure and a vocoded chant for nearly its entire length, letting the groove itself carry the record. `ostinato` keeps that same short cell circling at a hard syncopation."},{id:"electrofunk_jamonit",name:"Jam On It",artist:"Newcleus",year:1984,bpm:116,tonic:1,progId:"axisMinor",baseTemplate:"electrofunk",narrative:"qanda",vary:.5,sync:2,tip:"Newcleus trade the pitched-up 'Jam On It' chant back and forth against the human vocal like a question-and-answer routine over a stiff, syncopated 808 groove. `qanda` writes that same call-and-response cell rather than a continuous line."},{id:"electrofunk_electrickingdom",name:"Electric Kingdom",artist:"Twilight 22",year:1983,bpm:127,tonic:6,progId:"axis",baseTemplate:"electrofunk",narrative:"ostinato",vary:.4,sync:2,tip:"This early electro-funk single loops a robotic, syncopated synth-bass figure under sparse vocoded phrases, barely varying section to section. `ostinato` keeps that same cell locked in place while the syncopated groove does the real work."},{id:"electrofunk_nunk",name:"Nunk (New Wave Funk)",artist:"Warp 9",year:1982,bpm:115,tonic:5,progId:"axis",baseTemplate:"electrofunk",narrative:"chant",vary:.4,sync:2,tip:"Lotti Golden and Richard Scher's Warp 9 built this Prelude Records single around a chanted title phrase riding a stiff, syncopated Roland groove - new-wave electro-funk's crossover blueprint. `chant` writes that same rhythm-driven reciting shape."},{id:"electrofunk_packjam",name:"Pack Jam (Look Out for the OVC)",artist:"Jonzun Crew",year:1982,bpm:130,tonic:10,progId:"axisMinor",baseTemplate:"electrofunk",narrative:"ostinato",vary:.4,sync:2,tip:"Michael Jonzun's Boston electro classic loops a robotic vocoded bassline and chant with almost no melodic development, riding pure syncopated groove instead. `ostinato` keeps that same short cell circling at the style's characteristic push against the beat."},{id:"electrofunk_alnaafiysh",name:"Al-Naafiysh (The Soul)",artist:"Hashim",year:1983,bpm:126,tonic:6,progId:"axisMinor",baseTemplate:"electrofunk",narrative:"ostinato",vary:.4,sync:2,tip:"Jerry Calliste Jr.'s Cutting Records classic is built on one hypnotic, syncopated 808 bass riff repeated with almost no variation - among the most sampled electro basslines ever cut. `ostinato` keeps that riff locked in place rather than developing it."},{id:"electrofunk_magicswand",name:"Magic's Wand",artist:"Whodini",year:1982,bpm:113,tonic:9,progId:"axis",baseTemplate:"electrofunk",narrative:"chant",vary:.4,sync:1,tip:"Produced by Thomas Dolby, this early Whodini single rides a chanted, robotic vocal hook over a stiff syncopated 808 groove rather than a sung melody. `chant` writes that same held, rhythm-driven reciting shape."},{id:"electrofunk_numbers",name:"Numbers",artist:"Kraftwerk",year:1981,bpm:129,tonic:7,progId:"axis",baseTemplate:"electrofunk",narrative:"chant",vary:.2,sync:1,tip:"From 'Computer World', Kraftwerk build the track from robotically counted numbers over a stark, syncopated drum-machine pattern - a direct blueprint for the electro-funk sound that followed. Low-`vary` `chant` writes that same recited, barely-developing vocal shape."},{id:"electrofunk_hiphopbebop",name:"Hip Hop, Be Bop (Don't Stop)",artist:"Man Parrish",year:1982,bpm:116,tonic:1,progId:"axis",baseTemplate:"electrofunk",narrative:"ostinato",vary:.4,sync:2,tip:"Man Parrish's early electro-funk hit loops scratched vocal fragments and a robotic bass figure over a stiff 808 groove, barely varying its core cell for the whole record. `ostinato` keeps that same short figure circling at a syncopated pocket."},{id:"electro2000s_dance",name:"D.A.N.C.E.",artist:"Justice",year:2007,bpm:120,tonic:6,progId:"axisMinor",baseTemplate:"electro2000s",narrative:"chant",vary:.3,sync:1,tip:"Justice built this Ed Banger anthem on a children's-choir chant spelling out the title over a distorted, filtered disco-funk bassline - blog-house's most melodically direct hook. `chant` writes that same recited, rhythm-driven vocal shape."},{id:"electro2000s_genesis",name:"Genesis",artist:"Justice",year:2007,bpm:117,tonic:2,progId:"axisMinor",baseTemplate:"electro2000s",narrative:"ostinato",vary:.3,sync:1,tip:"This instrumental Justice track loops one grinding, heavily distorted synth-bass riff for almost its entire length, letting saturation and filtering stand in for melodic movement. `ostinato` keeps that same riff circling with minimal change."},{id:"electro2000s_popTheglock",name:"Pop the Glock",artist:"Uffie",year:2006,bpm:112,tonic:0,progId:"axisMinor",baseTemplate:"electro2000s",narrative:"converse",vary:.5,sync:2,tip:"Uffie's Ed Banger breakout is built on a narrow, half-spoken rap delivery with plenty of dead space over a dirty, distorted electro-funk bassline. `converse` writes that same speech-like, gapped phrasing rather than a sung melody."},{id:"electro2000s_pogo",name:"Pogo",artist:"Digitalism",year:2007,bpm:135,tonic:10,progId:"mixo",baseTemplate:"electro2000s",narrative:"terraced",vary:.5,sync:1,tip:"Digitalism's Kitsun\xE9-era track stacks distorted synth layers a step higher with each new section, building through layering rather than through a rewritten melody. `terraced` writes that same stepped lift the record's arrangement is built on."},{id:"electro2000s_warp19",name:"Warp 1.9",artist:"The Bloody Beetroots ft. Steve Aoki",year:2009,bpm:130,tonic:1,progId:"axis",baseTemplate:"electro2000s",narrative:"ostinato",vary:.4,sync:2,tip:"This Romborama anthem loops one aggressively distorted saw-bass riff under sparse shouted vocal stabs, the whole track built from that single dirty figure. `ostinato` keeps that riff locked in place at a hard syncopated push."},{id:"electro2000s_shineshine",name:"Shine Shine",artist:"Boys Noize",year:2007,bpm:126,tonic:4,progId:"aeolian",baseTemplate:"electro2000s",narrative:"ostinato",vary:.4,sync:1,tip:"Boys Noize's own-label track rides one gritty, filtered synth-bass loop for nearly its whole length, texture and distortion doing the work a chorus would elsewhere. `ostinato` writes that same repeating, barely-developing cell."},{id:"electro2000s_franksinatra",name:"Frank Sinatra",artist:"Miss Kittin & The Hacker",year:2001,bpm:125,tonic:7,progId:"axis",baseTemplate:"electro2000s",narrative:"converse",vary:.5,sync:1,tip:"Miss Kittin's deadpan, spoken-word delivery over The Hacker's cold electroclash groove is narrow in range and full of space between lines rather than sung. `converse` writes that same speech-like, narrow phrasing the track's monotone vocal actually has."},{id:"electro2000s_emerge",name:"Emerge",artist:"Fischerspooner",year:2002,bpm:148,tonic:10,progId:"axis",baseTemplate:"electro2000s",narrative:"chant",vary:.3,sync:1,tip:"Fischerspooner's electroclash breakout is built on a repeated, near-spoken chant of the title word over a pulsing, arpeggiated synth bed rather than a developed vocal melody. `chant` writes that same held, recited shape."},{id:"electro2000s_rossross",name:"Ross Ross Ross",artist:"SebastiAn",year:2007,bpm:126,tonic:5,progId:"aeolian",baseTemplate:"electro2000s",narrative:"ostinato",vary:.3,sync:1,tip:"SebastiAn's Ed Banger track loops one dirty, distorted synth-bass riff with almost no melodic variation across its length - blog-house's harshest, most riff-driven side. `ostinato` keeps that same figure circling in place."},{id:"electro2000s_needygirl",name:"Needy Girl",artist:"Chromeo",year:2004,bpm:122,tonic:7,progId:"aeolian",baseTemplate:"electro2000s",narrative:"qanda",vary:.5,sync:1,tip:"Dave 1 and P-Thugg trade a talkbox call-and-response over filtered synth-funk stabs, the vocal hook built entirely from that back-and-forth exchange. `qanda` writes that same question-and-answer cell rather than a continuous melody."},{id:"ebm_joininthechant",name:"Join in the Chant",artist:"Nitzer Ebb",year:1987,bpm:121,tonic:10,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.2,sync:1,tip:"Nitzer Ebb's genre-naming single is built almost entirely on a shouted, repeated title phrase over a militant, pulsing sequencer line - the vocal doesn't develop, it drills. Low-`vary` `chant` writes that same held, barely-varying reciting shape."},{id:"ebm_warsawghetto",name:"Warsaw Ghetto",artist:"Nitzer Ebb",year:1985,bpm:124,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.2,sync:1,tip:"This early Nitzer Ebb single locks a barked vocal chant to a stark, hard-sequenced bassline, the whole track built on repetition rather than melodic movement. `chant` keeps that same static, rhythm-driven vocal shape at low `vary`."},{id:"ebm_headhunter",name:"Headhunter",artist:"Front 242",year:1988,bpm:123,tonic:6,progId:"mixo",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"Front 242's biggest single rides a barked, martial vocal delivery over a pulsing sequencer bassline that barely changes for the whole track - EBM's most recognizable groove. `chant` writes that same held, drilled vocal shape instead of a sung hook."},{id:"ebm_welcometoparadise",name:"Welcome to Paradise",artist:"Front 242",year:1988,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"From the same 'Front by Front' album as 'Headhunter', this track keeps the same militant sequencer-bass template with a colder, more clipped vocal delivery. `chant` again writes that recited, rhythm-driven shape rather than a developed melody."},{id:"ebm_dermussolini",name:"Der Mussolini",artist:"DAF",year:1981,bpm:157,tonic:11,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.2,sync:2,tip:"DAF's confrontational single is built from a barked, sloganistic vocal over a stripped, breakneck synth-and-drum-machine pulse - among the fastest and most minimal records that shaped EBM's template. `chant` at hard syncopation matches that drilled, provocative delivery."},{id:"ebm_bostich",name:"Bostich",artist:"Yello",year:1980,bpm:122,tonic:10,progId:"dorian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"Yello's Swiss electronic classic loops a percussive, chanted vocal fragment over a mechanical, modal groove that predates and directly influenced the EBM sound proper. `chant` writes that same held, rhythm-driven reciting shape."},{id:"ebm_movinghands",name:"Moving Hands",artist:"The Klinik",year:2014,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"Dirk Ivens and Marc Verhaeghen's long-running Belgian EBM act built this later single on their classic template - a pulsing sequencer bassline under a low, barked vocal that barely varies. `chant` keeps that same recited, static vocal shape."},{id:"ebm_digitaltensiondementia",name:"Digital Tension Dementia",artist:"Front Line Assembly",year:1988,bpm:128,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"Front Line Assembly's first single and first Billboard-charting record pairs a distorted, barked vocal with a hard, mechanical sequencer pulse in the classic EBM mold. `chant` writes that same drilled, rhythm-driven vocal delivery."},{id:"ebm_raisethepulse",name:"Raise the Pulse",artist:"Portion Control",year:1983,bpm:122,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"This early UK EBM/industrial-dance single locks a repeated, shouted title phrase to a stark, pulsing sequencer bassline - among the genre's earliest non-Belgian, non-German entries. `chant` matches that static, barked vocal delivery."},{id:"ebm_wahrearbeit",name:"Wahre Arbeit, Wahrer Lohn",artist:"Die Krupps",year:1981,bpm:124,tonic:9,progId:"aeolian",baseTemplate:"ebm",narrative:"chant",vary:.3,sync:1,tip:"Recorded in 1981, Die Krupps' seminal early single locks a barked, sloganistic German vocal to a metallic, pulsing sequencer line - one of the tracks that gave electronic body music its name and template. `chant` writes that same held, drilled vocal shape."},{id:"newbeat_flesh",name:"Flesh",artist:"A Split-Second",year:1986,bpm:108,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.2,sync:1,tip:"New Beat's entire founding myth is this record: a DJ played the 45rpm EBM single at 33+8, and the resulting slow, weighty pulse became the genre. `chant` at low `vary` writes the same static, barked vocal shape heard at that fateful slowed-down speed."},{id:"newbeat_soundofc",name:"The Sound of C",artist:"Confetti's",year:1989,bpm:108,tonic:0,progId:"axis",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"Confetti's were New Beat's most commercially successful act, and this single rides a repeated, chanted vocal hook over the genre's signature slowed, swung pulse. `chant` writes that same recited, rhythm-driven vocal shape rather than a sung melody."},{id:"newbeat_cinchina",name:"C in China",artist:"Confetti's",year:1989,bpm:106,tonic:0,progId:"axis",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"Confetti's' other major hit keeps the same chanted-hook, swung-pulse formula as 'The Sound of C', slowed and weighted the way the New Beat scene demanded. `chant` again writes that held, recited vocal shape."},{id:"newbeat_hiroshima",name:"Hiroshima",artist:"Nux Nemo",year:1988,bpm:106,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.2,sync:1,tip:"Joey Bogaert's Nux Nemo project scored New Beat's first Belgian number one with this record, built on a hypnotic, barely-varying chanted hook over the genre's trademark slow, swung groove. Low-`vary` `chant` matches that hypnotic repetition."},{id:"newbeat_moveyourass",name:"Move Your Ass and Feel the Beat",artist:"Erotic Dissidents",year:1988,bpm:106,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"One of the Antler-Subway label's central New Beat productions, this track loops a shouted title-phrase hook over a slowed, weighty EBM-derived pulse. `chant` writes that same recited, rhythm-driven vocal shape."},{id:"newbeat_poison",name:"Poison!",artist:"The Weathermen",year:1987,bpm:108,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"This semi-satirical Belgian act's biggest single rides a deadpan, repeated vocal hook over the same hypnotic, slowed EBM pulse that defines the New Beat sound. `chant` matches that static, spoken-toned delivery."},{id:"newbeat_anasthasia",name:"Anasthasia",artist:"T99",year:1991,bpm:128,tonic:2,progId:"axis",baseTemplate:"newbeat",narrative:"peak",vary:.6,sync:1,tip:"T99 emerged from the same Belgian scene as it sped New Beat's hypnotic pulse up into early hardcore, this UK top-20 hit withholding its big synth-stab hook until well into the track. `peak` writes that same held-back top note arriving late."},{id:"newbeat_euroshima",name:"Euroshima (Wardance)",artist:"Snowy Red",year:1981,bpm:120,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"Snowy Red's dark, martial single predates New Beat proper but is a direct precursor the scene drew heavily on - the same barked-chant-over-mechanical-pulse DNA slowed down a few years later. `chant` writes that same recited, rhythm-driven vocal."},{id:"newbeat_hmmhmm",name:"Hmm Hmm",artist:"Taste of Sugar",year:1988,bpm:106,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.2,sync:1,tip:"From the same Belgian production team behind Erotic Dissidents, this track loops a wordless, chanted vocal fragment over New Beat's trademark slow, swung groove. Low-`vary` `chant` keeps that hypnotic, barely-changing cell in place."},{id:"newbeat_rockittothebone",name:"Rock It to the Bone",artist:"Jade 4U",year:1989,bpm:108,tonic:9,progId:"aeolian",baseTemplate:"newbeat",narrative:"chant",vary:.3,sync:1,tip:"Nikkie Van Lierop's Jade 4U side-project - she'd go on to front Lords of Acid - rides a chanted title hook over the same slowed, weighty pulse that carries the whole New Beat scene. `chant` writes that same held, recited vocal shape."},{id:"trance_forangel",name:"For An Angel",artist:"Paul van Dyk",year:1998,bpm:136,tonic:5,progId:"edm",baseTemplate:"trance",narrative:"archSong",vary:.6,sync:1,tip:"PvD's breakdown-to-drop arc is built around one soaring lead line that only plays in full at the climax, not a repeated chorus. `archSong` writes that single long rise-and-fall instead of restating a hook."},{id:"trance_cafedelmar",name:"Cafe Del Mar",artist:"Energy 52",year:1993,bpm:136,tonic:5,progId:"aeolian",baseTemplate:"trance",narrative:"wave",vary:.3,sync:0,tip:"Almost no drums for its first minutes \u2014 the record is carried by a slowly undulating chord/arp wash that never resolves into a strong downbeat until deep in. `wave` writes that same long, breath-like undulation rather than a rhythmic hook."},{id:"trance_children",name:"Children",artist:"Robert Miles",year:1995,bpm:137,tonic:0,progId:"pachelbel",baseTemplate:"trance",narrative:"ostinato",vary:.3,sync:0,tip:"The whole track is one repeating piano figure over a slow four-on-the-floor pulse \u2014 'dream trance' stripped down to almost no drums under a classical-leaning ostinato. Low `vary` matches how little the real piano part actually changes."},{id:"trance_communication",name:"Communication",artist:"Armin van Buuren",year:1999,bpm:138,tonic:6,progId:"aeolian",baseTemplate:"trance",narrative:"climb",vary:.7,sync:1,tip:"An early Armin epic built from one plucked arpeggio figure that keeps registering higher and gaining layers across eight-plus minutes instead of introducing a new hook. `climb` mirrors that steadily rising register."},{id:"trance_ageoflove",name:"The Age Of Love (Jam & Spoon Watch Out For Stella Mix)",artist:"Age Of Love",year:1997,bpm:130,tonic:5,progId:"aeolian",baseTemplate:"trance",narrative:"germ",vary:.8,sync:1,tip:"One of the records that invented the breakdown-and-buildup formula \u2014 a single stabbing synth cell gets rebuilt with more layers each time it drops back in. `germ` develops that one cell further pass to pass rather than swapping in new material."},{id:"trance_1998",name:"1998",artist:"Binary Finary",year:1998,bpm:150,tonic:7,progId:"aeolian",baseTemplate:"trance",narrative:"terraced",vary:.5,sync:1,tip:"Built from one arpeggiated sequencer line that keeps having new layers stacked above it rather than a sung hook. `terraced` is that repeat-a-step-higher layering, at the unusually fast, driving tempo the real record actually runs at."},{id:"trance_orangetheme",name:"The Orange Theme",artist:"Cygnus X",year:1994,bpm:148,tonic:0,progId:"aeolian",baseTemplate:"trance",narrative:"motif",vary:.6,sync:1,tip:"A trance rework of Purcell's funeral music for Queen Mary (the 'A Clockwork Orange' theme) \u2014 the classical motif is quoted, then re-harmonized section to section rather than looped unchanged. `motif` restates and transforms that short cell the same way."},{id:"trance_simulated",name:"Simulated",artist:"Marco V",year:2002,bpm:135,tonic:10,progId:"mixo",baseTemplate:"trance",narrative:"chordLock",vary:.4,sync:2,tip:"A tech-trance record built on the filtered 'off'-beat stab sound Marco V pioneered \u2014 the riff's notes only change because the chord under it moves, not because it develops its own melody. `chordLock` writes exactly that, pushed to the more aggressive sync."},{id:"progtrance_insomnia",name:"Insomnia",artist:"Faithless",year:1995,bpm:127,tonic:11,progId:"aeolian",baseTemplate:"progtrance",narrative:"chant",vary:.3,sync:1,tip:"The hook is a flat, half-spoken 'I can't get no sleep' reciting pitch over a slow-building groove, not a sung melody \u2014 the arrangement does the work while the vocal barely changes. `chant` writes that same reciting, rhythm-led line."},{id:"progtrance_gouryella",name:"Gouryella",artist:"Gouryella",year:1999,bpm:138,tonic:7,progId:"festival",baseTemplate:"progtrance",narrative:"expand",vary:.6,sync:1,tip:"Ferry Corsten and Ti\xEBsto's alias track runs a slow-motion filter build into a lead that only reaches its full register at the drop, after minutes of narrow plucked arps. `expand` is that dramatic register-widening moment exactly."},{id:"progtrance_airwave",name:"Airwave",artist:"Rank 1",year:2e3,bpm:136,tonic:2,progId:"aeolian",baseTemplate:"progtrance",narrative:"motif",vary:.5,sync:1,tip:"The track's identity is one plucked four-note arp figure that returns re-orchestrated as the arrangement fills in around it, rather than a sung or evolving lead. `motif` restates that short cell with new dressing each section."},{id:"progtrance_flight643",name:"Flight 643",artist:"Ti\xEBsto",year:2001,bpm:137,tonic:9,progId:"aeolian",baseTemplate:"progtrance",narrative:"climb",vary:.6,sync:1,tip:"A groove-first record \u2014 the bassline and filtered percussion drive the long build, with the lead only creeping upward in register rather than delivering an early hook. `climb` matches that steady rise instead of a repeated chorus."},{id:"progtrance_xpander",name:"Xpander",artist:"Sasha",year:1999,bpm:128,tonic:8,progId:"mixo",baseTemplate:"progtrance",narrative:"terraced",vary:.7,sync:1,tip:"An 11-minute prog-house/trance crossover built almost entirely from arrangement \u2014 filtered stabs and a rolling bassline get added and stripped away in blocks rather than a written melody carrying it. `terraced` is that block-by-block layering."},{id:"progtrance_thegift",name:"The Gift",artist:"Way Out West ft. Joanna Law",year:1996,bpm:133,tonic:0,progId:"axis",baseTemplate:"progtrance",narrative:"archSong",vary:.8,sync:1,tip:"A vocal progressive-trance/breakbeat crossover where Joanna Law's line builds once, across the whole record, into a single soaring peak rather than repeating a chorus. `archSong` is that one-arc shape."},{id:"progtrance_whatyagot",name:"What Ya Got 4 Me",artist:"Signum",year:2006,bpm:129,tonic:6,progId:"deepHouse",baseTemplate:"progtrance",narrative:"chant",vary:.3,sync:2,tip:"The hook is a chopped, rhythmically stuttered vocal phrase looped over a rolling bassline rather than a sung line that develops \u2014 the groove carries the record, not the words. `chant` writes that reciting, rhythm-first vocal shape."},{id:"progtrance_flamingjune",name:"Flaming June",artist:"BT",year:1997,bpm:138,tonic:6,progId:"aeolian",baseTemplate:"progtrance",narrative:"wave",vary:.4,sync:0,tip:"One of BT's defining early progressive trance records \u2014 long, slowly swelling pad and arp layers rather than a sharp hook, with melody emerging gradually out of the wash. `wave` writes that same long undulation."},{id:"progtrance_saltwater",name:"Saltwater",artist:"Chicane ft. M\xE1ire Brennan",year:1999,bpm:131,tonic:5,progId:"aeolian",baseTemplate:"progtrance",narrative:"archSong",vary:.7,sync:0,tip:"Built from a sampled Clannad-style vocal phrase stretched into one long, gentle melodic arc over a groove-driven build, rather than a repeated pop chorus. `archSong` captures that single unhurried rise and fall."},{id:"progtrance_somnambulist",name:"Somnambulist (Simply Being Loved)",artist:"BT",year:2003,bpm:135,tonic:3,progId:"aeolian",baseTemplate:"progtrance",narrative:"germ",vary:.9,sync:2,tip:"A Guinness-record vocal-science experiment \u2014 thousands of micro-edits of one vocal cell reassembled into a constantly mutating line rather than a fixed melody. `germ` develops that one small cell further each section, at high variation."},{id:"upliftingtrance_adagio",name:"Adagio for Strings",artist:"Ti\xEBsto",year:2005,bpm:140,tonic:10,progId:"festival",baseTemplate:"upliftingtrance",narrative:"peak",vary:.5,sync:0,tip:"Ti\xEBsto's version keeps Barber's classical climax in reserve, building an enormous breakdown before the string line finally reaches its top note at the drop. `peak` withholds that note the same way the real arrangement does."},{id:"upliftingtrance_traffic",name:"Traffic",artist:"Ti\xEBsto",year:2003,bpm:138,tonic:10,progId:"festival",baseTemplate:"upliftingtrance",narrative:"arch",vary:.5,sync:1,tip:"A riff-led instrumental anthem \u2014 one melodic phrase rises and resolves within itself each time it plays, rather than building across the whole song. `arch` is that self-contained rise-and-fall, repeated over the festival-lift chords."},{id:"upliftingtrance_outoftheblue",name:"Out of the Blue",artist:"System F",year:1999,bpm:140,tonic:7,progId:"edm",baseTemplate:"upliftingtrance",narrative:"expand",vary:.6,sync:1,tip:"A genre-defining early uplifting anthem \u2014 a narrow plucked arp motif in the breakdown suddenly widens into a huge layered string-and-lead register at the drop. `expand` is that exact dramatic widening."},{id:"upliftingtrance_sunmoon",name:"Sun & Moon",artist:"Above & Beyond ft. Richard Bedford",year:2011,bpm:134,tonic:6,progId:"festival",baseTemplate:"upliftingtrance",narrative:"archSong",vary:.7,sync:1,tip:"The vocal builds one long arc toward its release at the drop's high note rather than repeating a chorus, over Above & Beyond's signature enormous breakdown. `archSong` is that single song-length rise and fall."},{id:"upliftingtrance_concreteangel",name:"Concrete Angel",artist:"Gareth Emery ft. Christina Novelli",year:2012,bpm:130,tonic:7,progId:"edm",baseTemplate:"upliftingtrance",narrative:"period",vary:.5,sync:1,tip:"Voted ASOT's Tune of the Year, its verse is built from tidy two-bar call-and-answer vocal phrases that resolve into the anthem's widest drop. `period` writes those paired question-then-answer sentences."},{id:"upliftingtrance_exploration",name:"Exploration of Space",artist:"Cosmic Gate",year:2001,bpm:138,tonic:9,progId:"festival",baseTemplate:"upliftingtrance",narrative:"climb",vary:.6,sync:1,tip:"An instrumental anthem where the main lead's register keeps creeping higher across the arrangement rather than repeating, arriving at its widest register only at the final drop. `climb` matches that steady rise."},{id:"upliftingtrance_bigsky",name:"Big Sky",artist:"John O'Callaghan ft. Audrey Gallagher",year:2007,bpm:140,tonic:6,progId:"festival",baseTemplate:"upliftingtrance",narrative:"peak",vary:.6,sync:1,tip:"ASOT's 2007 Tune of the Year \u2014 Audrey Gallagher's vocal withholds its top note until the very last drop, after a long, escalating breakdown. `peak` writes that same withheld high note."},{id:"upliftingtrance_sevencities",name:"Seven Cities",artist:"Solarstone",year:1999,bpm:135,tonic:0,progId:"edm",baseTemplate:"upliftingtrance",narrative:"wave",vary:.4,sync:0,tip:"Solarstone's 'Balearic trance' anthem is carried by long, slow pad and arp swells rather than a stabbing riff \u2014 the breakdown is most of the record's identity. `wave` writes that same long undulation."},{id:"upliftingtrance_universalnation",name:"Universal Nation",artist:"Push",year:1998,bpm:138,tonic:3,progId:"edm",baseTemplate:"upliftingtrance",narrative:"arch",vary:.5,sync:1,tip:"One of the tracks that codified the Bonzai uplifting sound \u2014 a plucked, arpeggiated riff rises and resolves within each phrase, restated through a long escalating build rather than developed further. `arch` is that self-contained shape."},{id:"upliftingtrance_bluefear",name:"Blue Fear",artist:"Armin van Buuren",year:1997,bpm:136,tonic:10,progId:"festival",baseTemplate:"upliftingtrance",narrative:"germ",vary:.6,sync:1,tip:"An early Armin classic where one short melodic cell is rebuilt with more layers and countermelody each time it returns rather than replaced with a new hook. `germ` develops that one cell further section to section."},{id:"goatrance_mahadeva",name:"Mahadeva",artist:"Astral Projection",year:1994,bpm:145,tonic:5,progId:"mixo",baseTemplate:"goatrance",narrative:"ostinato",vary:.3,sync:1,tip:"Astral Projection's breakthrough is carried almost entirely by one hypnotic, acid-tinged rolling bassline that barely changes for minutes, everything else just filtering in and out around it. `ostinato` keeps that cell as the actual hook."},{id:"goatrance_peoplecanfly",name:"People Can Fly",artist:"Astral Projection",year:1996,bpm:143,tonic:6,progId:"mixo",baseTemplate:"goatrance",narrative:"climb",vary:.5,sync:1,tip:"A long-form Goa journey that keeps adding texture and raising register gradually rather than delivering a chorus, so the 'hook' is really the arc of the whole track. `climb` writes that same steady rise instead of a repeated figure."},{id:"goatrance_lsd",name:"LSD",artist:"Hallucinogen",year:1995,bpm:148,tonic:2,progId:"phrygian",baseTemplate:"goatrance",narrative:"chant",vary:.2,sync:1,tip:"Built around a spoken sample from a BBC documentary about LSD, looped as a rhythm-
