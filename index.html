d:"stringsoflife",name:"Strings of Life",artist:"Derrick May",year:1987,bpm:130,tonic:9,progId:"aeolian",baseTemplate:"techno",narrative:"terraced",vary:1,sync:0,tip:"The Detroit techno string riff every later 'stab that builds' descends from \u2014 it doesn't develop so much as arrive in layers, one string figure stacking on the last. `terraced` states a short figure and restates it a step higher, section by section, which is the same layering trick in miniature."},{id:"spastik",name:"Spastik",artist:"Plastikman",year:1993,bpm:135,tonic:0,progId:"aeolian",baseTemplate:"techno",narrative:"ostinato",vary:.2,sync:0,tip:"Minimal techno reduced to its studs: one hypnotic pattern, barely pitched at all, that runs unchanged for most of the record \u2014 the point is the groove's own repetition, not melodic incident. Low variation keeps every pass close to identical, the way the real pattern never really departs from itself."},{id:"strobe",name:"Strobe",artist:"deadmau5",year:2009,bpm:128,tonic:8,progId:"festival",baseTemplate:"melotech",narrative:"archSong",vary:1,sync:0,tip:"Ten minutes as one continuous climb rather than a string of sections \u2014 the famous two-minute intro is the first quarter of a single arc that only resolves at the drop. `archSong` shapes register the same way across the whole running order instead of per section, which is the one narrative built for a song that is itself one long phrase."},{id:"sandstorm",name:"Sandstorm",artist:"Darude",year:2e3,bpm:136,tonic:11,progId:"festival",baseTemplate:"trance",narrative:"motif",vary:1,sync:1,tip:"Built from one small, instantly-hummable synth figure restated through every section rather than developed into a longer tune \u2014 arguably the most recognisable four-bar idea in dance music precisely because it never becomes anything more complicated. `motif` restates and transforms one short cell the same way, section to section."},{id:"silence",name:"Silence",artist:"Delerium ft. Sarah McLachlan",year:2e3,bpm:136,tonic:9,progId:"festival",baseTemplate:"trance",narrative:"wave",vary:1,sync:0,tip:"A vocal trance breakdown built on long, slow-breathing phrases that rise and fall without ever quite settling \u2014 the emotional centre the trance template's own 32-bar, drum-free breakdown exists to hold. `wave`'s long undulation, wider under the hook, is that same unresolved swell."},{id:"greyhound",name:"Greyhound",artist:"Swedish House Mafia",year:2012,bpm:128,tonic:0,progId:"festival",baseTemplate:"bigroom",narrative:"chordLock",vary:.5,sync:1,tip:"An instrumental main-stage lead: a short stabbing riff that only moves because the chord under it does, rather than a tune with its own contour. `chordLock` snaps every note to the bar's chord tone, so the line spells the changes exactly the way a big-room lead riff does."},{id:"dontyouworrychild",name:"Don't You Worry Child",artist:"Swedish House Mafia ft. John Martin",year:2012,bpm:129,tonic:11,progId:"festival",baseTemplate:"bigroom",narrative:"expand",vary:1,sync:1,tip:"Verses kept deliberately narrow and low so the chorus can leap to the top of the octave and stay there \u2014 the single most common trick in festival pop, and the reason the hook feels enormous relative to everything around it. `expand` is built for exactly that contrast."},{id:"reload",name:"Reload",artist:"Sebastian Ingrosso & Tommy Trash",year:2013,bpm:128,tonic:2,progId:"festival",baseTemplate:"proghouse",narrative:"terraced",vary:1,sync:0,tip:"Progressive house's layer-at-a-time build taken almost to an extreme \u2014 each pass adds one element and nothing is removed until the long breakdown. `terraced` restates its figure a step higher each time, which is the same one-thing-at-a-time logic read as a melodic shape instead of an arrangement one."},{id:"concreteangel",name:"Concrete Angel",artist:"Gareth Emery ft. Christina Novelli",year:2014,bpm:136,tonic:4,progId:"festival",baseTemplate:"proghouse",narrative:"climb",vary:1,sync:0,tip:"A vocal trance-house record where the emotional lift comes from the register climbing across the whole song rather than from a key change \u2014 a cheaper trick than modulating, and one that never announces itself. `climb` sits each section a little higher than the last for exactly that reason."},{id:"innercitylife",name:"Inner City Life",artist:"Goldie",year:1994,bpm:172,tonic:7,progId:"aeolian",baseTemplate:"dnb",narrative:"suspend",vary:1,sync:0,tip:"The record that proved drum & bass could carry a soul vocal \u2014 atmosphere and ache stated over the breaks before either drop properly lands, matching the dnb template's own 'mood before drop' shape. `suspend` writes a line that keeps landing a step above the chord and resolving down, the ache that keeps a slow melody moving over a fast rhythm section."},{id:"scarymonsters",name:"Scary Monsters and Nice Sprites",artist:"Skrillex",year:2010,bpm:140,tonic:7,progId:"axisMinor",baseTemplate:"dubstep",narrative:"chordLock",vary:.5,sync:2,tip:"The mid-range wobble bass *is* the hook here \u2014 the dubstep template's own tip notes that harmony comes out at the drop because the mid-range synth has replaced it, and `chordLock` writes a hard, chord-snapped stutter in that same register instead of a sung line, at the more aggressive syncopation level."},{id:"neverbelikeyou",name:"Never Be Like You",artist:"Flume ft. Kai",year:2016,bpm:150,tonic:0,progId:"futureBass",baseTemplate:"futurebass",pad:"voice",narrative:"gapfill",vary:1,sync:2,tip:"Future bass built from a chopped, pitch-bent vocal \u2014 leaping to a high note and stepping back down through the gap it just left, the shape that makes a vocal chop read as a hook rather than a glitch. `gapfill` is that leap-then-fill pattern exactly; the voice pad stands in for the sung timbre without repeating its words."},{id:"maskoff",name:"Mask Off",artist:"Future",year:2017,bpm:152,tonic:7,progId:"axisMinor",baseTemplate:"trap",bass:"subhold",bassVoice:"sub",narrative:"ostinato",vary:.2,sync:1,tip:"A trap beat built almost entirely around one short woodwind figure looped for the whole record \u2014 the hook barely varies because it doesn't need to; the 808 sub the trap template leaves silent by default is filled in here since the low end carries as much of the track as the riff does."},{id:"rerewind",name:"Re-Rewind (The Crowd Say Bo Selecta)",artist:"Artful Dodger ft. Craig David",year:1999,bpm:132,tonic:9,progId:"deepHouse",baseTemplate:"garage",pat:"shuffle16",swing:.35,narrative:"converse",vary:1,sync:2,tip:"UK garage's 2-step skip lives in the shuffle, not the chords \u2014 swung sixteenths pulling against a four-on-the-floor sound that isn't actually there. The pattern and swing overrides are what carry that; `converse` writes a narrow, speech-like vocal line with air between phrases, which is how the genre's sung top-lines tend to sit over the skip."},{id:"disco_stayinalive",name:"Stayin' Alive",artist:"Bee Gees",year:1977,bpm:104,tonic:10,progId:"aeolian",baseTemplate:"disco",narrative:"motif",vary:.6,sync:1,tip:"Barry Gibb's falsetto verse is one narrow, syncopated cell restated over the Fender Rhodes and that famous half-time, oddly-swung hi-hat groove rather than developing into anything wider. `motif` keeps the vocal a small repeated cell instead of a rising hook, matching how little the actual top line moves."},{id:"disco_lefreak",name:"Le Freak",artist:"Chic",year:1978,bpm:117,tonic:7,progId:"mixo",baseTemplate:"disco",narrative:"chant",vary:.3,sync:1,tip:"Nile Rodgers' guitar chops a I-bVII-IV vamp under Bernard Edwards' bass, and the title itself is the whole vocal hook, chanted rather than sung through. `chant` writes that same held, rhythm-first reciting pitch instead of a melodic phrase."},{id:"disco_iwillsurvive",name:"I Will Survive",artist:"Gloria Gaynor",year:1978,bpm:117,tonic:9,progId:"aeolian",baseTemplate:"disco",narrative:"expand",vary:.7,sync:1,tip:"The verse is a tight, almost spoken descending line over a chromatically walking minor-key bassline, then the title hook throws the register wide open. `expand` captures that specific verse-to-chorus widening rather than a gradual climb."},{id:"disco_goodtimes",name:"Good Times",artist:"Chic",year:1979,bpm:111,tonic:2,progId:"mixo",baseTemplate:"disco",narrative:"ostinato",vary:.3,sync:1,tip:"Bernard Edwards' bassline is famous precisely because it barely resolves the one-chord vamp it rides on for most of the record's length, later looped whole into Rapper's Delight. `ostinato` writes that same short cell repeating with only light variation rather than developing it."},{id:"disco_boogiewonderland",name:"Boogie Wonderland",artist:"Earth, Wind & Fire ft. The Emotions",year:1979,bpm:132,tonic:2,progId:"dorian",baseTemplate:"disco",narrative:"callResp",vary:.8,sync:1,tip:"Maurice White's lead trades lines directly with The Emotions across the chorus, a genuine call-and-response duet rather than a solo hook, over horn stabs landing on the transitions. `callResp` writes that trade; `dorian` keeps the minor-key verse driving rather than mournful."},{id:"disco_carwash",name:"Car Wash",artist:"Rose Royce",year:1976,bpm:118,tonic:9,progId:"mixo",baseTemplate:"disco",narrative:"chant",vary:.4,sync:2,tip:"Norman Whitfield built the whole record around a shouted, heavily syncopated group chant of the title over a one-vamp funk-disco groove, with almost no sung melody at all. `chant` and the higher sync level are exactly that group-shout-against-the-beat feel."},{id:"disco_discoinferno",name:"Disco Inferno",artist:"The Trammps",year:1976,bpm:128,tonic:10,progId:"axis",baseTemplate:"disco",narrative:"terraced",vary:.5,sync:1,tip:"The 12\" version famously keeps stacking horn and string layers over roughly eleven minutes on top of the same 'burn baby burn' vamp rather than changing the chords. `terraced` writes that same short figure re-entering a step higher/thicker each pass as the arrangement builds."},{id:"disco_ymca",name:"Y.M.C.A.",artist:"Village People",year:1978,bpm:127,tonic:5,progId:"axis",baseTemplate:"disco",narrative:"callResp",vary:.3,sync:1,tip:"The whole hook is the spelled-out title shouted back by the group over Victor Willis's lead, a literal audience call-and-response built for the dancefloor arm gestures. `callResp` is that exact shout-back structure, kept simple with low variation since the phrase barely changes all song."},{id:"disco_ringmybell",name:"Ring My Bell",artist:"Anita Ward",year:1979,bpm:126,tonic:5,progId:"axis",baseTemplate:"disco",narrative:"ostinato",vary:.3,sync:1,tip:"Frederick Knight's production is built on a bare, bell-like synth-percussion hook that loops almost unchanged under Ward's high, light vocal for the whole track. `ostinato` matches that fixed, minimally-varied instrumental cell."},{id:"disco_turnthebeataround",name:"Turn the Beat Around",artist:"Vicki Sue Robinson",year:1976,bpm:128,tonic:9,progId:"aeolian",baseTemplate:"disco",narrative:"expand",vary:.8,sync:1,tip:"Built on a driving Latin-percussion break rather than a synth groove, Robinson's voice stays contained through the verses and then leaps wide open on the title hook. `expand` is that specific register jump at the hook, not a slow climb."},{id:"balearic_papuanewguinea",name:"Papua New Guinea",artist:"The Future Sound of London",year:1991,bpm:109,tonic:8,progId:"lydian",baseTemplate:"balearic",narrative:"ostinato",vary:.2,sync:0,tip:"Built around a looped, pitched-up soprano sample over a slow, filtered ambient-house pad bed that essentially never resolves anywhere new. `ostinato` and the low vary write that same fixed sampled cell rather than a developing tune; `lydian`'s open, unresolved major color matches its floating, dreamlike chords."},{id:"balearic_e2e4",name:"E2-E4",artist:"Manuel G\xF6ttsching",year:1984,bpm:123,tonic:4,progId:"dorian",baseTemplate:"balearic",narrative:"wave",vary:.4,sync:0,tip:"DJ Alfredo's Amnesia sets built the whole Balearic sound around this one continuous hour-long piece: a static minor sequencer pattern that guitar solos drift in and out of, never snapping to a downbeat. `wave`'s long slow undulation captures that gradual, non-percussive unfolding better than any hook-based shape."},{id:"balearic_sueolatino",name:"Sue\xF1o Latino",artist:"Sue\xF1o Latino",year:1989,bpm:126,tonic:4,progId:"dorian",baseTemplate:"balearic",narrative:"ostinato",vary:.3,sync:1,tip:"Built directly on G\xF6ttsching's E2-E4 sequencer pattern with congas and a chanted title vocal laid over it, so the harmonic content barely moves from the same static minor cell. `ostinato` reflects that borrowed, repeating bed rather than any real melodic development."},{id:"balearic_ageoflove",name:"The Age of Love (Jam & Spoon Watch Out for Stella Mix)",artist:"Age of Love",year:1992,bpm:130,tonic:5,progId:"festival",baseTemplate:"balearic",narrative:"climb",vary:.6,sync:0,tip:"Jam & Spoon's remix stretches its intro out for minutes, letting a simple arpeggiated stab climb and thicken in register long before any drop, essentially inventing the proto-trance build. `climb` is that slow register creep; `festival`'s minor lift matches its big, wordless anthemic feel."},{id:"balearic_barefootinthehead",name:"Barefoot in the Head",artist:"A Man Called Adam",year:1990,bpm:121,tonic:7,progId:"dorian",baseTemplate:"balearic",narrative:"wave",vary:.5,sync:1,tip:"A Man Called Adam's early Balearic sound layers Latin percussion and jazzy flute-like lines over a static minor vamp that never resolves into a hard drop. `wave`'s long undulation matches that mellow, non-percussive drift; `dorian` keeps the minor mode groovy rather than sad."},{id:"balearic_smokebelch",name:"Smokebelch II",artist:"The Sabres of Paradise",year:1993,bpm:128,tonic:7,progId:"mixo",baseTemplate:"balearic",narrative:"ostinato",vary:.2,sync:0,tip:"Andrew Weatherall's dub-house production loops one hazy chord/bass figure for the whole nine minutes, opening and closing filters rather than introducing new material. `ostinato` writes that same fixed repeating cell instead of anything that develops."},{id:"balearic_nrg",name:"N-R-G",artist:"Adamski",year:1990,bpm:120,tonic:9,progId:"dorian",baseTemplate:"balearic",narrative:"ostinato",vary:.3,sync:1,tip:"Adamski built this acid-house-adjacent Balearic staple around a single looping minor riff that mutates only through filter sweeps rather than melodic change. `ostinato` keeps that riff a fixed repeating cell across sections."},{id:"balearic_belfast",name:"Belfast",artist:"Orbital",year:1991,bpm:120,tonic:0,progId:"axis",baseTemplate:"balearic",narrative:"expand",vary:.7,sync:0,tip:"Orbital's breakbeat-era Balearic classic holds a restrained string-pad figure through its verses and then opens the register dramatically wide for its emotional peak rather than adding new instrumentation. `expand` is that specific widening moment."},{id:"balearic_pacificstate",name:"Pacific State",artist:"808 State",year:1989,bpm:128,tonic:2,progId:"axis",baseTemplate:"balearic",narrative:"motif",vary:.4,sync:1,tip:"Built on a saxophone-like synth hook and bird-call samples looped over a house groove, the melodic cell is restated with only small variations across the track rather than developed into new phrases. `motif` matches that same short figure returning, lightly transformed each time."},{id:"balearic_littlefluffyclouds",name:"Little Fluffy Clouds",artist:"The Orb",year:1990,bpm:105,tonic:6,progId:"lydian",baseTemplate:"balearic",narrative:"ostinato",vary:.2,sync:0,tip:"The entire track is built from a looped Rickie Lee Jones interview sample answering the same question over a shifting ambient-house pad bed, with almost no independent melodic writing. `ostinato` and the very low vary reflect that fixed, barely-altered sampled cell."},{id:"postdisco_dontmakemewait",name:"Don't Make Me Wait",artist:"Peech Boys",year:1982,bpm:115,tonic:8,progId:"mixo",baseTemplate:"postdisco",narrative:"chordLock",vary:.5,sync:1,tip:"Larry Levan's dub-heavy mix famously drops everything but the bass and drums for long stretches, letting the bassline carry entire bars alone while the chords barely surface. `chordLock` writes that bass-led riff, moving only when the underlying chord actually changes."},{id:"postdisco_aintnobody",name:"Ain't Nobody",artist:"Rufus & Chaka Khan",year:1983,bpm:104,tonic:3,progId:"aeolian",baseTemplate:"postdisco",narrative:"chordLock",vary:.4,sync:1,tip:"David Wolinski's synth bassline is the record's real hook, a tight minor-key riff that anchors the groove while Chaka Khan's vocal floats loosely above it. `chordLock` keeps that bass riff snapped to the chord changes as the driving element."},{id:"postdisco_geniusoflove",name:"Genius of Love",artist:"Tom Tom Club",year:1981,bpm:103,tonic:2,progId:"axis",baseTemplate:"postdisco",narrative:"ostinato",vary:.2,sync:1,tip:"Tina Weymouth's bassline is so completely the song's identity that it's been sampled and looped whole across dozens of later hip-hop and R&B records with almost no alteration. `ostinato` writes that same fixed, barely-developing bass cell."},{id:"postdisco_setitoff",name:"Set It Off",artist:"Strafe",year:1984,bpm:111,tonic:9,progId:"dorian",baseTemplate:"postdisco",narrative:"chordLock",vary:.3,sync:1,tip:"A stark NYC electro-boogie record built almost entirely from drum machine and a repeating minor-key bass riff, with chords barely more than an occasional stab underneath. `chordLock` keeps that bass figure the lead, moving only with the harmony."},{id:"postdisco_situation",name:"Situation",artist:"Yazoo",year:1982,bpm:119,tonic:6,progId:"axis",baseTemplate:"postdisco",narrative:"motif",vary:.5,sync:1,tip:"Alison Moyet's vocal is a short repeated phrase restated over Vince Clarke's rolling synth-bass pattern, which does most of the actual melodic work. `motif` keeps that vocal a returning cell rather than a developing line."},{id:"postdisco_icantgoforthat",name:"I Can't Go for That (No Can Do)",artist:"Daryl Hall & John Oates",year:1981,bpm:112,tonic:5,progId:"aeolian",baseTemplate:"postdisco",narrative:"chordLock",vary:.4,sync:1,tip:"The song's identity is its descending synth-bass riff, famously sampled by De La Soul and others, riding under sparse, mostly-muted chord hits. `chordLock` writes that riff as the true lead, moving only when the chord underneath shifts."},{id:"postdisco_glowoflove",name:"The Glow of Love",artist:"Change ft. Luther Vandross",year:1980,bpm:118,tonic:4,progId:"dorian",baseTemplate:"postdisco",narrative:"arch",vary:.6,sync:1,tip:"Luther Vandross's guide vocal (before he was even credited) rises and settles in smooth, complete phrases over a busy, rolling Italo-disco bassline that never really stops moving. `arch` matches that rise-and-fall vocal shape sitting on top of the bass's constant motion."},{id:"postdisco_alnaafiysh",name:"Al-Naafiysh (The Soul)",artist:"Hashim",year:1983,bpm:130,tonic:7,progId:"mixo",baseTemplate:"postdisco",bassVoice:"square",narrative:"ostinato",vary:.2,sync:2,tip:"An almost entirely instrumental electro-boogie record \u2014 the vocoded riff and hard-edged synth bass are the whole arrangement, repeating with barely any development. `ostinato` at low vary and the square bass voice capture that bare, mechanical, near-melody-free groove."},{id:"postdisco_dontstopthemusic",name:"Don't Stop the Music",artist:"Yarbrough & Peoples",year:1980,bpm:99,tonic:2,progId:"dorian",baseTemplate:"postdisco",narrative:"callResp",vary:.5,sync:1,tip:"The duo trade lines back and forth over a rolling synth-bass vamp that carries most of the groove while the chords stay minimal underneath. `callResp` writes that literal back-and-forth vocal exchange."},{id:"postdisco_heartbeat",name:"Heartbeat",artist:"Taana Gardner",year:1981,bpm:99,tonic:6,progId:"dorian",baseTemplate:"postdisco",narrative:"ostinato",vary:.2,sync:1,tip:"Kenton Nix's Paradise Garage classic is famous for how little is actually in it \u2014 bass and drums carry entire minutes with the vocal barely present and the chords all but absent. `ostinato` at very low vary captures that stripped, almost bassline-only arrangement."},{id:"italodisco_selfcontrol",name:"Self Control",artist:"Raf",year:1984,bpm:124,tonic:9,progId:"axisMinor",baseTemplate:"italodisco",narrative:"archSong",vary:.7,sync:1,tip:"Giancarlo Bigazzi's production rides an octave-bouncing bassline while Raf's vocal builds from a contained verse to one big melodramatic swell at the chorus and back down. `archSong` is that single rise-and-fall shape across the whole record; `axisMinor` gives the dramatic minor lift the chorus needs."},{id:"italodisco_tarzanboy",name:"Tarzan Boy",artist:"Baltimora",year:1985,bpm:117,tonic:10,progId:"aeolian",baseTemplate:"italodisco",narrative:"motif",vary:.5,sync:1,tip:"The 'ooh eee ooh ah ah' hook is a short cell restated again and again over a bouncing octave bassline that drives the whole arrangement. `motif` keeps that vocal cell returning rather than developing into a longer melody."},{id:"italodisco_ilikechopin",name:"I Like Chopin",artist:"Gazebo",year:1983,bpm:112,tonic:2,progId:"aeolian",baseTemplate:"italodisco",narrative:"wave",vary:.6,sync:0,tip:"Pierluigi Giombini's production is slower and more melancholic than most Italo disco, built on a long, softly undulating synth-flute melody over the octave bass rather than a punchy hook. `wave` matches that gentle, drifting phrase shape."},{id:"italodisco_dolcevita",name:"Dolce Vita",artist:"Ryan Paris",year:1983,bpm:126,tonic:9,progId:"axisMinor",baseTemplate:"italodisco",narrative:"arch",vary:.6,sync:1,tip:"One of the genre's most recognizable octave-bounce basslines sits under a chorus melody that rises to a peak on the title phrase and falls right back within the same four bars. `arch` is that rise-and-fall shape held inside a single phrase rather than across the whole song."},{id:"italodisco_dirtytalk",name:"Dirty Talk",artist:"Klein & M.B.O.",year:1982,bpm:122,tonic:9,progId:"dorian",baseTemplate:"italodisco",narrative:"chordLock",vary:.3,sync:1,tip:"Widely cited as a direct influence on early Chicago house, this is an almost entirely instrumental record built around a driving octave bassline with a vocoded phrase locked to it rather than a sung melody. `chordLock` writes that vocoder riff as an instrumental stab tied to the harmony."},{id:"italodisco_spacerwoman",name:"Spacer Woman",artist:"Charlie",year:1983,bpm:126,tonic:7,progId:"aeolian",baseTemplate:"italodisco",narrative:"qanda",vary:.5,sync:1,tip:"The title line is posed by the lead vocal and answered by a synth figure over the relentless octave-bounce bass, a genuine call-and-response between voice and machine. `qanda` writes that same question-then-answer motion."},{id:"italodisco_dontcrytonight",name:"Don't Cry Tonight",artist:"Savage",year:1984,bpm:120,tonic:4,progId:"axisMinor",baseTemplate:"italodisco",narrative:"archSong",vary:.7,sync:1,tip:"Roberto Zanetti's production builds Savage's vocal from a restrained, moody verse up to one big melodramatic peak at the title hook and back down over the course of the whole record. `archSong` captures that single large-scale rise and fall."},{id:"italodisco_happychildren",name:"Happy Children",artist:"P. Lion",year:1983,bpm:124,tonic:0,progId:"dorian",baseTemplate:"italodisco",narrative:"chant",vary:.3,sync:1,tip:"One of the most sampled Italo disco records, built on a bouncing bassline under a title phrase that's chanted rather than developed into a real melody. `chant` writes that fixed, rhythm-driven reciting pitch."},{id:"italodisco_thenight",name:"The Night",artist:"Valerie Dore",year:1984,bpm:113,tonic:9,progId:"axisMinor",baseTemplate:"italodisco",narrative:"lament",vary:.6,sync:0,tip:"Slower and darker than most of the genre, the vocal traces a genuinely descending, melancholic line over the octave bass rather than a bright hook. `lament`'s falling shape matches that mood directly."},{id:"italodisco_happystation",name:"Happy Station",artist:"Fun Fun",year:1983,bpm:122,tonic:2,progId:"aeolian",baseTemplate:"italodisco",narrative:"motif",vary:.4,sync:1,tip:"Built on the genre's signature bouncing bass, the vocal hook is a short repeated cell traded between the group's voices rather than a single developing melody. `motif` keeps that figure a returning short cell."},{id:"hinrg_ifeellove",name:"I Feel Love",artist:"Donna Summer",year:1977,bpm:128,tonic:0,progId:"mixo",baseTemplate:"hinrg",narrative:"ostinato",vary:.2,sync:0,tip:"Giorgio Moroder's Moog sequencer runs one unbroken pulsing pattern for the entire eight-minute record while Summer's vocal holds long, mostly static tones over it \u2014 the record that essentially invented this whole style's engine. `ostinato` writes that same fixed, barely-varying pulse."},{id:"hinrg_youspinmeround",name:"You Spin Me Round (Like a Record)",artist:"Dead or Alive",year:1984,bpm:128,tonic:6,progId:"aeolian",baseTemplate:"hinrg",narrative:"chant",vary:.3,sync:2,tip:"Pete Burns' title hook is a tight, stuttering phrase pulled hard against the beat rather than a flowing melody, tracking the octave bass pulse almost note for note. `chant` at the more aggressive sync level captures that clipped, rhythm-first delivery."},{id:"hinrg_itsrainingmen",name:"It's Raining Men",artist:"The Weather Girls",year:1982,bpm:124,tonic:4,progId:"aeolian",baseTemplate:"hinrg",narrative:"callResp",vary:.6,sync:1,tip:"Martha Wash and Izora Armstead trade lines with a gospel-choir energy across the verses before landing together on the title hook, a genuine call-and-response over the pulsing bass. `callResp` writes that same trade."},{id:"hinrg_somanymen",name:"So Many Men, So Little Time",artist:"Miquel Brown",year:1983,bpm:129,tonic:6,progId:"aeolian",baseTemplate:"hinrg",narrative:"chant",vary:.3,sync:1,tip:"Ian Levine's production keeps the title phrase chanted over the unbroken octave bass pulse rather than letting the vocal develop into a wider melody. `chant` matches that held, rhythm-driven delivery."},{id:"hinrg_highenergy",name:"High Energy",artist:"Evelyn Thomas",year:1984,bpm:124,tonic:10,progId:"aeolian",baseTemplate:"hinrg",narrative:"ostinato",vary:.3,sync:1,tip:"The genre-naming record itself: a hard, unbroken four-on-the-floor pulse under a vocal hook that repeats with only small variation rather than expanding. `ostinato` reflects that fixed, minimally-developing top line."},{id:"hinrg_searchin",name:"Searchin' (I Gotta Find a Man)",artist:"Hazell Dean",year:1983,bpm:132,tonic:0,progId:"axis",baseTemplate:"hinrg",narrative:"expand",vary:.6,sync:1,tip:"Stock Aitken Waterman's breakthrough production keeps Dean's verse fairly contained before opening the register right up on the title hook. `expand` is that specific widening at the hook rather than a slow build."},{id:"hinrg_lovereaction",name:"Love Reaction",artist:"Divine",year:1983,bpm:127,tonic:0,progId:"axis",baseTemplate:"hinrg",narrative:"chordLock",vary:.3,sync:1,tip:"Bobby Orlando's stomping production is built on a hard synth stab pattern that Divine's chanted vocal barely deviates from, moving only when the stab pattern itself changes. `chordLock` writes that same chord-tied riff behavior."},{id:"hinrg_dowannafunk",name:"Do Ya Wanna Funk",artist:"Sylvester ft. Patrick Cowley",year:1982,bpm:125,tonic:9,progId:"dorian",baseTemplate:"hinrg",narrative:"peak",vary:.8,sync:1,tip:"Patrick Cowley's relentless octave-bounce synth bass drives the whole track while Sylvester's falsetto stays relatively contained until he lets loose on a held high note late in the record. `peak` withholds that top note the way the actual vocal performance does."},{id:"hinrg_venus",name:"Venus",artist:"Bananarama",year:1986,bpm:126,tonic:9,progId:"axis",baseTemplate:"hinrg",narrative:"motif",vary:.4,sync:1,tip:"Stock Aitken Waterman's cover keeps the riff a short repeated figure restated from verse to chorus with only minor variation, matching the original Shocking Blue hook's own shape. `motif` is that returning short cell."},{id:"hinrg_youthinkyoureaman",name:"You Think You're a Man",artist:"Divine",year:1984,bpm:128,tonic:9,progId:"aeolian",baseTemplate:"hinrg",narrative:"chordLock",vary:.3,sync:1,tip:"Another Bobby Orlando stomper built around a nagging, repeated synth riff that Divine's deep spoken-sung delivery rides on top of rather than developing independently. `chordLock` keeps that riff tied to the chord changes as the real lead."},{id:"house_yourlove",name:"Your Love",artist:"Frankie Knuckles ft. Jamie Principle",year:1987,bpm:120,tonic:5,progId:"deepHouse",baseTemplate:"house",narrative:"terraced",vary:.5,sync:1,tip:"Jamie Principle's breathy vocal hook is a short repeated figure that gets layered progressively thicker as the track's minimal minor vamp continues, without new melodic material being introduced. `terraced` is that step-by-step layering build."},{id:"house_moveyourbody",name:"Move Your Body (The House Music Anthem)",artist:"Marshall Jefferson",year:1986,bpm:123,tonic:7,progId:"gospel",baseTemplate:"house",narrative:"callResp",vary:.4,sync:1,tip:"Jefferson's rolling gospel-piano chords answer the chanted 'move your body' vocal directly, a call-and-response structure borrowed straight from church music. `callResp` writes that same exchange; `gospel` gives the piano its churchy major-key lift."},{id:"house_jackyourbody",name:"Jack Your Body",artist:'Steve "Silk" Hurley',year:1986,bpm:122,tonic:9,progId:"deepHouse",baseTemplate:"house",narrative:"ostinato",vary:.2,sync:1,tip:"A near-instrumental record \u2014 the chanted title phrase loops over a static minor vamp with almost no melodic development for its entire length, and it still went to UK No. 1. `ostinato` at very low vary matches that fixed, unchanging loop."},{id:"house_nowayback",name:"No Way Back",artist:"Adonis",year:1986,bpm:122,tonic:9,progId:"deepHouse",baseTemplate:"house",narrative:"ostinato",vary:.2,sync:1,tip:"A stark, minimal Chicago classic built on one grinding minor-key riff repeated with almost no variation across the whole record. `ostinato` writes that same fixed cell rather than any melodic growth."},{id:"house_frenchkiss",name:"French Kiss",artist:"Lil Louis",year:1989,bpm:121,tonic:0,progId:"deepHouse",baseTemplate:"house",narrative:"ostinato",vary:.2,sync:0,tip:"The record's real structural trick is a tempo that drags down to around 80bpm mid-track before speeding back up, all riding the same moaning vocal-sample loop rather than a developing tune. `ostinato` keeps that one sampled cell the whole 'melody' throughout."},{id:"house_promisedland",name:"Promised Land",artist:"Joe Smooth",year:1987,bpm:123,tonic:0,progId:"gospel",baseTemplate:"house",narrative:"callResp",vary:.6,sync:1,tip:"Smooth's preacher-like lead vocal is answered by piano stabs and backing voices in a structure lifted straight from gospel music, building toward its utopian message rather than a club drop. `callResp` writes that same exchange; `gospel` fits its major-key, church-rooted chords."},{id:"house_someday",name:"Someday",artist:"CeCe Rogers",year:1987,bpm:122,tonic:9,progId:"deepHouse",baseTemplate:"house",narrative:"expand",vary:.7,sync:1,tip:"Rogers' vocal starts contained and builds in genuine gospel-influenced intensity toward the record's emotional peak rather than looping a fixed hook. `expand` is that widening arc toward the climax."},{id:"house_timetojack",name:"Time to Jack",artist:"Chip E.",year:1985,bpm:120,tonic:0,progId:"deepHouse",baseTemplate:"house",narrative:"ostinato",vary:.2,sync:1,tip:"One of house music's earliest records, built almost entirely from a looped 'jack your body' vocal chant over a bare minor groove with no real melodic development. `ostinato` matches that fixed, repeating cell."},{id:"acidhouse_acidtracks",name:"Acid Tracks",artist:"Phuture",year:1987,bpm:123,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chordLock",vary:.2,sync:1,tip:"The record that put the 303 squelch on the map: DJ Pierre's Roland TB-303 line, mutated live via resonance and cutoff, is the entire arrangement, locked to one static chord the whole way through. `chordLock` writes that riff moving only with the harmony beneath it."},{id:"acidhouse_voodooray",name:"Voodoo Ray",artist:"A Guy Called Gerald",year:1988,bpm:123,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"ostinato",vary:.3,sync:1,tip:"A chopped vocal sample loops over the squelching acid line with almost no melodic development across the whole Manchester classic. `ostinato` keeps that sampled phrase a fixed repeating cell."},{id:"acidhouse_acidrock",name:"Acid Rock",artist:"Bam Bam",year:1988,bpm:124,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chordLock",vary:.2,sync:1,tip:"One of the rawest early acid records \u2014 the 303 line is the whole track, locked to a single static chord that the drums lock into at bar one and never leave. `chordLock` writes that same harmonically-tied riff."},{id:"acidhouse_testone",name:"Testone",artist:"Tyree",year:1988,bpm:125,tonic:0,progId:"dorian",baseTemplate:"acidhouse",narrative:"ostinato",vary:.2,sync:1,tip:"Named for the near-test-tone repetitiveness of its own squelching riff, which barely develops across the whole record. `ostinato` at low vary captures that intentionally minimal, near-mechanical loop."},{id:"acidhouse_weallitacieed",name:"We Call It Acieed",artist:"D-Mob ft. Gary Haisman",year:1988,bpm:126,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chant",vary:.3,sync:1,tip:"Gary Haisman's title phrase is chanted on a held pitch over the squelching 303 line rather than sung as a melody, an on-the-nose vocal tribute to the sound itself. `chant` writes that rhythm-driven reciting pitch."},{id:"acidhouse_stakkerhumanoid",name:"Stakker Humanoid",artist:"Humanoid",year:1988,bpm:127,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chordLock",vary:.2,sync:1,tip:"Brian Dougans' pre-LFO record is entirely instrumental and mechanical, one 303 riff locked to a single chord and mutated only through filter movement. `chordLock` writes that riff moving only with the underlying harmony."},{id:"acidhouse_acidthunder",name:"Acid Thunder",artist:"Fast Eddie",year:1988,bpm:124,tonic:0,progId:"dorian",baseTemplate:"acidhouse",narrative:"ostinato",vary:.2,sync:1,tip:"A stripped Chicago acid cut where the squelching line simply repeats over an unmoving four-on-the-floor groove for the record's length. `ostinato` matches that fixed, barely-varying cell."},{id:"acidhouse_ivelostcontrol",name:"I've Lost Control",artist:"Sleezy D",year:1986,bpm:120,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chant",vary:.2,sync:1,tip:"One of the true proto-acid records \u2014 a spoken/chanted vocal repeats on a held pitch over a hypnotic, minimally-varying groove that predates the 303 craze proper. `chant` writes that fixed reciting delivery."},{id:"acidhouse_cobrabora",name:"Cobra Bora",artist:"808 State",year:1989,bpm:128,tonic:9,progId:"dorian",baseTemplate:"acidhouse",narrative:"chordLock",vary:.3,sync:1,tip:"A Manchester acid-house instrumental built from one looping riff mutated via filter sweeps, locked to a single static chord throughout. `chordLock` writes that riff tied to the harmony rather than developing independently."},{id:"acidhouse_yourfriend",name:"Your Only Friend",artist:"Phuture",year:1987,bpm:123,tonic:0,progId:"dorian",baseTemplate:"acidhouse",narrative:"chant",vary:.2,sync:1,tip:"A deadpan spoken cocaine-warning sample ('this is cocaine speaking...') loops on a fixed reciting pitch over the squelching 303 line. `chant` writes that same held, rhythm-driven spoken delivery."},{id:"deephouse_canyoufeelit",name:"Can You Feel It",artist:"Mr. Fingers",year:1986,bpm:122,tonic:5,progId:"deepHouse",baseTemplate:"deephouse",narrative:"wave",vary:.5,sync:0,tip:"Larry Heard's wordless choir-pad hook swells slowly across whole sections rather than stabbing in on the beat, exactly the filter-opens-not-snaps arrangement this style is built on. `wave`'s long undulation matches that gradual swell."},{id:"deephouse_deepinside",name:"Deep Inside",artist:"Hardrive",year:1993,bpm:124,tonic:9,progId:"deepHouse",baseTemplate:"deephouse",narrative:"ostinato",vary:.3,sync:1,tip:"Louie Vega's track is built around a looped Barbara Tucker vocal sample ('deep inside... I want you') over sustained keys rather than a developing sung line. `ostinato` keeps that sampled phrase a fixed repeating cell."},{id:"deephouse_followme",name:"Follow Me",artist:"Aly-Us",year:1992,bpm:124,tonic:0,progId:"deepHouse",baseTemplate:"deephouse",narrative:"callResp",vary:.6,sync:1,tip:"A gospel-house anthem built on layered choir vocals trading phrases over sustained chords that swell in rather than stab. `callResp` writes that vocal trade; the sustained-chord default suits its unhurried builds."},{id:"deephouse_thewhistlesong",name:"The Whistle Song",artist:"Frankie Knuckles",year:1991,bpm:123,tonic:7,progId:"deepHouse",baseTemplate:"deephouse",pad:"glass",narrative:"germ",vary:.5,sync:0,tip:"An entirely instrumental record \u2014 the flute-like whistled synth lead is developed a little further each section as the filter opens across whole sixteen-bar stretches rather than snapping to new material. `germ` is exactly that same-cell-elaborated-further shape; `glass` gives the lead its bell-like tone."},{id:"deephouse_alteredstates",name:"Altered States",artist:"Ron Trent",year:1990,bpm:122,tonic:2,progId:"deepHouse",baseTemplate:"deephouse",narrative:"ostinato",vary:.3,sync:0,tip:"Made by Trent as a teenager, this Chicago deep house landmark rides sustained keyboard chords over a hypnotic bassline that barely varies from its opening cell. `ostinato` matches that fixed, slowly-breathing loop."},{id:"deephouse_break4love",name:"Break 4 Love",artist:"Raze",year:1988,bpm:120,tonic:9,progId:"deepHouse",baseTemplate:"deephouse",narrative:"wave",vary:.5,sync:1,tip:"An early filter-house landmark where the vocal and horn hook are opened up gradually across whole sections via filter sweep rather than snapping in on a drop. `wave` matches that slow, undulating filter-open shape the style is defined by."},{id:"deephouse_percolator",name:"The Percolator (Rock the House)",artist:"Cajmere",year:1992,bpm:124,tonic:0,progId:"deepHouse",baseTemplate:"deephouse",bass:"offbeat",narrative:"ostinato",vary:.2,sync:1,tip:"Curtis Jones' Chicago classic is built almost entirely around one stuttering, offbeat percussive bass-and-vocal hook that repeats with minimal change for most of the record. `ostinato` and the offbeat bass pattern capture that fixed, stuttering cell."},{id:"deephouse_gabriel",name:"Gabriel",artist:"Roy Davis Jr. ft. Peven Everett",year:1997,bpm:122,tonic:9,progId:"deepHouse",baseTemplate:"deephouse",narrative:"arch",vary:.6,sync:1,tip:"Peven Everett's falsetto rises and settles in smooth, complete phrases over sustained garage-tinged deep house chords, a defining crossover between US deep house and UK garage. `arch` matches that contained rise-and-fall vocal shape."},{id:"deephouse_musicsoundsbetter",name:"Music Sounds Better With You",artist:"Stardust",year:1998,bpm:123,tonic:8,progId:"mixo",baseTemplate:"deephouse",narrative:"ostinato",vary:.2,sync:1,tip:"The entire record is one four-bar filter-disco loop, chopped from a soul sample, that only changes because the filter opens and closes across whole sections rather than any melody developing. `ostinato` at low vary keeps that single looped cell exactly that fixed."},{id:"deephouse_myhouse",name:"My House",artist:"Rhythm Controll",year:1987,bpm:120,tonic:0,progId:"deepHouse",baseTemplate:"deephouse",pad:"organ",narrative:"chant",vary:.2,sync:0,tip:"Built around Chuck Roberts' spoken-word 'house music is a feeling' sermon looped over sustained organ-like chords, the vocal is reciting rather than singing a melody. `chant` writes that same held, rhythm-driven delivery; `organ` gives the chords their churchy sustain."},{id:"brokenbeat_groovenow",name:"Groove Now",artist:"New Sector Movements",year:1997,bpm:108,tonic:9,progId:"dorian",baseTemplate:"brokenbeat",narrative:"ostinato",vary:.3,sync:2,tip:"Widely cited as one of the first records actually tagged 'broken beat' \u2014 IG Culture's New Sector Movements alias built the whole track from one stumbling drum-and-keys cell rather than a song form. `ostinato` writes that same barely-developed loop; the heavier sync level is the off-the-grid kick placement that gives the genre its name."},{id:"brokenbeat_bootylala",name:"Booty La La",artist:"Bugz In The Attic",year:2004,bpm:122,tonic:11,progId:"aeolian",baseTemplate:"brokenbeat",narrative:"motif",vary:.6,sync:2,tip:"Voted Gilles Peterson's Worldwide track of the year \u2014 the Bugz collective's calling-card tune runs a short keys-and-vocal-chop cell that keeps getting re-cut against a drum pattern that never lands where it 'should'. `motif` restates that cell per section rather than developing a full melody, at the harder syncopation the stumbling kick needs."},{id:"brokenbeat_lookingforlove",name:"Looking for Love (Bugz In The Attic Remix)",artist:"Vikter Duplaix",year:2002,bpm:114,tonic:2,progId:"deepHouse",baseTemplate:"brokenbeat",narrative:"arch",vary:.8,sync:1,tip:"Duplaix's smooth Philly-soul vocal is kept largely intact while Bugz In The Attic rebuild the rhythm bed underneath into a lurching, off-house groove \u2014 the chords doing real melodic work rather than just padding. `arch` gives the vocal a real rise-and-fall phrase shape true to the original soul writing."},{id:"brokenbeat_holditdown",name:"Hold It Down (Bugz In The Attic's Co-Operative Mix)",artist:"4hero",year:2002,bpm:129,tonic:9,progId:"axis",baseTemplate:"brokenbeat",narrative:"expand",vary:1,sync:1,tip:"4hero's Lady Alma vocal is rebuilt by Bugz In The Attic into one of the scene's most-played remixes, the register widening hard at the hook the way a lot of the CoOp-club-era reworks did to justify a full club system. `expand` is exactly that dramatic register opening at the hook."},{id:"brokenbeat_yellow",name:"Yellow",artist:"K15",year:2014,bpm:112,tonic:5,progId:"dorian",baseTemplate:"brokenbeat",narrative:"germ",vary:.7,sync:1,tip:"A newer-generation broken-beat/future-beat crossover cut on the 2000Black-adjacent scene, built from a small keys figure that keeps picking up new countermelodies as it goes rather than repeating unchanged. `germ` is that cell-developed-further-each-section shape."},{id:"brokenbeat_organicjuggernaut",name:"Organic Juggernaut",artist:"Kaidi Tatham",year:2011,bpm:108,tonic:7,progId:"jazz",baseTemplate:"brokenbeat",narrative:"climb",vary:1,sync:2,tip:"Tatham's own keyboard playing is the lead instrument here \u2014 long, real jazz-fusion voicings climbing steadily up the register over a stuttering broken-beat kit rather than a vocal hook. `climb` tracks that register creep across the whole track; the jazz progression matches his chord vocabulary."},{id:"brokenbeat_saveit",name:"Save It (Some Groove)",artist:"Domu ft. Face",year:2001,bpm:110,tonic:0,progId:"deepHouse",baseTemplate:"brokenbeat",narrative:"qanda",vary:.6,sync:1,tip:"An early Domu 2000 Black-era cut with Face's vocal trading short phrases against the chord stabs rather than singing straight through \u2014 very characteristic of the scene's call-and-answer vocal editing. `qanda` writes that phrase-and-response shape directly."},{id:"brokenbeat_rokstone",name:"Rokstone (Soon Come)",artist:"Daz-I-Kue ft. Colonel Red",year:2005,bpm:113,tonic:10,progId:"neoSoul",baseTemplate:"brokenbeat",narrative:"callResp",vary:.8,sync:1,tip:"Bugz In The Attic member Daz-I-Kue frames Colonel Red's reggae-soul-inflected vocal as a genuine call over the chords, with the drums answering in the gaps rather than just keeping time. `callResp` is that trade; the neo-soul progression fits Colonel Red's warm, songful delivery."},{id:"brokenbeat_afrospace",name:"Afrospace",artist:"Mark Force & Kaidi Tatham present Blakai ft. Bembe Segue",year:2005,bpm:118,tonic:4,progId:"dorian",baseTemplate:"brokenbeat",narrative:"wave",vary:.5,sync:1,tip:"Bembe Segue's vocal rides a long, slow-undulating melodic line over Tatham and Mark Force's static minor-but-not-sad vamp rather than a tight pop hook \u2014 a favourite move of the scene's more spaced-out productions. `wave` is that long undulation; `dorian` gives the static, unresolved harmonic bed."},{id:"brokenbeat_looselips",name:"Loose Lips",artist:"Seiji ft. Lyric L",year:2002,bpm:123,tonic:9,progId:"deepHouse",baseTemplate:"brokenbeat",narrative:"converse",vary:1,sync:2,tip:"Built at Seiji's own studio and often called the biggest broken-beat anthem of its era, the track's rapid-fire vocal flow sits in tight, speech-like bursts against a heavily syncopated drum programme. `converse` writes that narrow, phrase-and-space vocal delivery at the harder push-every-beat syncopation."},{id:"afrohouse_superman",name:"Superman",artist:"Black Coffee ft. Bucie",year:2009,bpm:123,tonic:9,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"terraced",vary:.6,sync:1,tip:"Black Coffee's signature South African hit famously holds off any full drum kit for a long percussion-only intro before Bucie's vocal and the bassline both arrive \u2014 the patient, hand-drum-first build the whole afro house style is named for. `terraced` writes that step-by-step layering."},{id:"afrohouse_wedanceagain",name:"We Dance Again",artist:"Black Coffee ft. Nakhane Tour\xE9",year:2015,bpm:122,tonic:7,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"climb",vary:.8,sync:1,tip:"Nakhane Tour\xE9's vocal keeps pushing higher in register as the percussion layers pile up underneath, mirroring the track's own build rather than staying in one register throughout. `climb` tracks that steady register rise across the whole song."},{id:"afrohouse_webandiba",name:"Webandiba",artist:"Culoe De Song",year:2009,bpm:123,tonic:2,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"ostinato",vary:.4,sync:1,tip:"An Innervisions-released, largely instrumental afro house classic \u2014 one repeating keys-and-vocal-chant cell carries the whole track rather than a developed lead line, with the arrangement's interest coming entirely from the percussion entering piece by piece. `ostinato` is that loop."},{id:"afrohouse_rainbow",name:"Rainbow",artist:"Black Motion ft. Nokwazi",year:2015,bpm:120,tonic:5,progId:"aeolian",baseTemplate:"afrohouse",narrative:"wave",vary:.6,sync:1,tip:"Black Motion's live-drum-kit-plus-house production lets Nokwazi's vocal move in long, slow swells over the plain minor vamp rather than short pop phrases. `wave` is that long undulation; `aeolian` keeps the harmony as unresolved as the real track's held minor chords."},{id:"afrohouse_anthem",name:"Anthem",artist:"Da Capo ft. Karyendasoul & Sio",year:2016,bpm:121,tonic:0,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"terraced",vary:.7,sync:1,tip:"Da Capo's tracks are known for very long, patient percussion intros before the vocal and harmony properly arrive \u2014 'Anthem' stacks congas, shakers and claps in visible layers before Karyendasoul and Sio's vocal enters. `terraced` writes each new layer a step up from the last."},{id:"afrohouse_theskyfellpluto",name:"The Sky Fell (Pluto)",artist:"Caiiro",year:2018,bpm:122,tonic:4,progId:"phrygian",baseTemplate:"afrohouse",narrative:"motif",vary:.5,sync:1,tip:"Caiiro's crossover afro/melodic-house hit is built on a short, modal Egyptian-flavoured instrumental figure that's restated and re-orchestrated section to section rather than sung through. `motif` is that repeated-and-transformed cell; `phrygian` captures the track's Middle-Eastern-tinged half-step colour."},{id:"afrohouse_sondela",name:"Sondela",artist:"Themba ft. Kaz Money",year:2020,bpm:121,tonic:9,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"qanda",vary:.7,sync:1,tip:"Themba's VIVa Music hit trades short vocal phrases from Kaz Money against the percussion hits rather than running a continuous vocal line, very much the call-and-answer phrasing common to the SA afro house scene's vocal edits. `qanda` writes that motif-as-question-and-answer directly."},{id:"afrohouse_drive",name:"Drive",artist:"Black Coffee & David Guetta ft. Delilah Montagu",year:2022,bpm:123,tonic:2,progId:"deepHouse",baseTemplate:"afrohouse",narrative:"archSong",vary:.8,sync:1,tip:"The most pop-structured entry here \u2014 a Guetta co-production built around a genuine verse-hook Delilah Montagu vocal rather than a chant, layered onto Black Coffee's percussion-first afro house bed. `archSong` gives it one clear rise-and-fall arc across the whole record rather than a looped cell."},{id:"afrohouse_fetchyourlife",name:"Fetch Your Life",artist:"Prince Kaybee ft. Msaki",year:2018,bpm:119,tonic:7,progId:"aeolian",baseTemplate:"afrohouse",narrative:"callResp",vary:.6,sync:1,tip:"Prince Kaybee's biggest crossover hit sets Msaki's vocal in a call over a plain minor vamp, with the percussion and backing chants answering each line \u2014 a very South African radio-house-meets-afro-house hybrid. `callResp` writes that trade directly."},{id:"afrohouse_mommasgroove",name:"Momma's Groove",artist:"Osunlade",year:2004,bpm:118,tonic:10,progId:"jazz",baseTemplate:"afrohouse",narrative:"chant",vary:.3,sync:0,tip:"A Yoruba Records deep/afro house staple \u2014 a held, rhythm-driven vocal chant sits over jazzy chord movement rather than a written melody, one of the clearest examples of the label's spiritual-house sound. `chant` is exactly that reciting-pitch vocal; the low vary keeps it as static as the real hook."},{id:"amapiano_kestar",name:"Ke Star",artist:"Focalistic ft. Vigro Deep",year:2020,bpm:112,tonic:0,progId:"aeolian",baseTemplate:"amapiano",narrative:"chant",vary:.3,sync:1,tip:"Focalistic's breakout anthem rides a shouted, barely-melodic 'ke star' hook over Vigro Deep's log-drum bassline left to ring and slide under it \u2014 the vocal is rhythm and repetition, not melody. `chant` matches that held, spoken-sung reciting-tone hook exactly."},{id:"amapiano_emcimbini",name:"Emcimbini",artist:"Kabza De Small ft. Ami Faku",year:2020,bpm:113,tonic:5,progId:"deepHouse",baseTemplate:"amapiano",narrative:"archSong",vary:.9,sync:1,tip:"Ami Faku's soulful, genuinely song-structured vocal is the exception among amapiano's chants \u2014 a real verse-and-hook arc laid over Kabza's jazzy chords and soft shaker groove. `archSong` gives it one clear rise-and-fall across the whole record rather than a looped cell."},{id:"amapiano_sponono",name:"Sponono",artist:"DJ Maphorisa & Kabza De Small ft. Wizkid, Burna Boy & Cassper Nyovest",year:2020,bpm:112,tonic:9,progId:"dorian",baseTemplate:"amapiano",narrative:"callResp",vary:.7,sync:1,tip:"Three guest verses trade over the same held log-drum bass and static minor-but-not-sad vamp rather than each getting their own section \u2014 the Scorpion Kings' groove barely moves under them. `callResp` writes that hand-off between voices; `dorian` is the unresolved vamp underneath."},{id:"amapiano_umsebenziwethu",name:"Umsebenzi Wethu",artist:"DJ Maphorisa & Kabza De Small ft. Young Stunna",year:2021,bpm:113,tonic:2,progId:"aeolian",baseTemplate:"amapiano",narrative:"period",vary:.8,sync:1,tip:"Young Stunna's breakout vocal is built from clear two-bar question-then-answer phrases over the piano-and-log-drum bed, a big part of why the hook is so easy to sing back. `period` is that exact two-bar call-and-answer sentence structure."},{id:"amapiano_uber",name:"Uber",artist:"Kabza De Small & Mas Musiq ft. Aymos",year:2020,bpm:112,tonic:7,progId:"deepHouse",baseTemplate:"amapiano",narrative:"motif",vary:.6,sync:1,tip:"Aymos's short vocal cell keeps returning with small variations as the jazzy chords and soft kick/shaker groove shift under it, rather than developing into a full new melody each time. `motif` is that restated-and-lightly-varied cell."},{id:"amapiano_iplan",name:"iPlan",artist:"Vigro Deep ft. Focalistic, Mpura, Ntosh Gazi, Duncan Mighty & Xduppy",year:2020,bpm:113,tonic:4,progId:"dorian",baseTemplate:"amapiano",narrative:"qanda",vary:.7,sync:2,tip:"Five rappers trade bars over Vigro Deep's log-drum groove in short question-and-answer bursts rather than full verses, keeping the track's energy in the flow rather than the harmony. `qanda` writes that trade; the higher sync matches the rap phrasing pushing hard against the beat."},{id:"amapiano_tanzania",name:"Tanzania",artist:"Uncle Waffles",year:2022,bpm:112,tonic:10,progId:"aeolian",baseTemplate:"amapiano",narrative:"ostinato",vary:.3,sync:1,tip:"Uncle Waffles' viral instrumental has no lead vocal at all \u2014 one keys-and-log-drum cell loops almost unchanged while the shaker groove and bass slide underneath, exactly the DJ-tool repetition that made it a Boiler Room favourite. `ostinato` is that barely-developed loop."},{id:"amapiano_iphone",name:"iPhone",artist:"DBN Gogo, Mellow & Sleazy ft. Sir Trill, Da Muziqal Chef, Yumbs, Naqua SA & TmanXpress",year:2021,bpm:113,tonic:0,progId:"deepHouse",baseTemplate:"amapiano",narrative:"chant",vary:.4,sync:1,tip:"One of amapiano's biggest TikTok-driven crossovers \u2014 a short, chanted phrase repeats over the struck-bell bassline rather than any of the six credited artists carrying a full sung melody. `chant` matches that reciting-pitch, rhythm-first hook."},{id:"amapiano_mnike",name:"Mnike",artist:"Tyler ICU & DJ Maphorisa ft. Tumelo_za, Nkosazana Daughter, Ceeka RSA & Sino Msolo",year:2023,bpm:112,tonic:5,progId:"dorian",baseTemplate:"amapiano",narrative:"pendulum",vary:.5,sync:1,tip:"The global amapiano breakout hit rocks its 'mnike' vocal hook between two close notes over the held log-drum bass, widening slightly each pass rather than developing a new line. `pendulum` is exactly that two-note rock-and-widen shape."},{id:"amapiano_selema",name:"Selema",artist:"Musa Keys",year:2023,bpm:113,tonic:9,progId:"deepHouse",baseTemplate:"amapiano",narrative:"wave",vary:.6,sync:1,tip:"Musa Keys' hit lets the vocal hook swell and fall in long phrases over jazzy chords and a bassline that just holds and slides rather than driving the groove itself. `wave` is that slow undulation."},{id:"gqom_icedrop",name:"Ice Drop",artist:"DJ Lag",year:2016,bpm:113,tonic:0,progId:"aeolian",baseTemplate:"gqom",narrative:"ostinato",vary:.2,sync:2,tip:"One of the first gqom tracks to reach international dancefloors via Goon Club Allstars \u2014 almost entirely percussion and sub-bass, with a single off-kilter kick pattern doing nearly all the work and barely any harmonic content. `ostinato` at low vary matches how little the track actually develops."},{id:"gqom_omunye",name:"Omunye",artist:"Distruction Boyz ft. Dominowe",year:2016,bpm:112,tonic:5,progId:"dorian",baseTemplate:"gqom",narrative:"chant",vary:.3,sync:2,tip:"The Durban duo's breakout, multi-platinum-in-South-Africa hit keeps Dominowe's vocal to a short, repeated chant sitting starkly over the stripped, mostly-alone kick pattern rather than a sung melody. `chant` is that held reciting pitch; the hard sync is the kick's off-house placement."},{id:"gqom_wololo",name:"Wololo",artist:"Babes Wodumo ft. Mampintsha",year:2016,bpm:112,tonic:9,progId:"aeolian",baseTemplate:"gqom",narrative:"callResp",vary:.6,sync:2,tip:"Gqom's biggest pop crossover \u2014 Babes Wodumo and Mampintsha trade short lines back and forth over drums that otherwise leave huge gaps of near-silence. `callResp` is that vocal trade; the chords stay minimal, true to how little harmonic content the original actually carries."},{id:"gqom_slende",name:"Slende",artist:"Rudeboyz",year:2016,bpm:113,tonic:2,progId:"dorian",baseTemplate:"gqom",narrative:"ostinato",vary:.2,sync:2,tip:"A Durban gqom duo staple built almost entirely from percussion and an off-kilter, mostly-solo kick pattern, with only the faintest keys stab for harmony. `ostinato` at low vary is that barely-changing loop."},{id:"gqom_igintsa",name:"iGintsa",artist:"Citizen Boy",year:2016,bpm:112,tonic:7,progId:"aeolian",baseTemplate:"gqom",narrative:"chant",vary:.3,sync:2,tip:"Citizen Boy's well-known Durban club hit leans on a short chanted vocal hook sitting over long stretches of near-empty percussion, letting the tension come from what's missing rather than added. `chant` captures that reciting, rhythm-driven vocal."},{id:"gqom_phandangedwa",name:"Phanda Ngedwa",artist:"DJ Tira ft. Dladla Mshunqisi",year:2016,bpm:113,tonic:4,progId:"dorian",baseTemplate:"gqom",narrative:"converse",vary:.4,sync:2,tip:"Durban kwaito veteran DJ Tira's crossover hit sets Dladla Mshunqisi's speech-like, gap-filled vocal delivery over a sparse, off-the-grid gqom kick rather than a sung line. `converse` writes that narrow, space-filled phrasing."},{id:"gqom_wehmameh",name:"Weh Mameh",artist:"Griffit Vigo",year:2016,bpm:112,tonic:10,progId:"aeolian",baseTemplate:"gqom",narrative:"germ",vary:.3,sync:2,tip:"Included on the Gqom Oh! compilation that first carried the Durban sound to international labels, Griffit Vigo's track develops one small percussion-and-vocal cell slightly further section by section rather than adding new material. `germ` is that gradually-developed cell."},{id:"gqom_tripjoburg",name:"Trip to Joburg",artist:"DJ Lag",year:2016,bpm:113,tonic:0,progId:"dorian",baseTemplate:"gqom",narrative:"ostinato",vary:.2,sync:2,tip:"An early DJ Lag instrumental among the first gqom tracks distributed to European labels and press \u2014 one repeating rhythm cell with almost no chordal material, letting the off-kilter, mostly-alone kick carry everything. `ostinato` at low vary matches that."},{id:"gqom_ghostmode",name:"Ghost Mode",artist:"DJ Lag ft. Mr Thela",year:2017,bpm:112,tonic:5,progId:"aeolian",baseTemplate:"gqom",narrative:"chant",vary:.3,sync:2,tip:"DJ Lag's Ghost Mode EP standout keeps Mr Thela's vocal to a short chanted phrase sitting over long stretches of stripped-back drums, true to gqom's tension-from-absence structure. `chant` matches that reciting-tone hook."},{id:"gqom_idando",name:"Idando",artist:"Babes Wodumo",year:2017,bpm:113,tonic:9,progId:"dorian",baseTemplate:"gqom",narrative:"callResp",vary:.5,sync:2,tip:"From Babes Wodumo's debut album Gqom Queen Vol. 1, the vocal trades short phrases against sparse drum hits rather than singing continuously, keeping the arrangement's weight on what drops out between hits. `callResp` writes that trade."},{id:"tribalhouse_firedup",name:"Fired Up!",artist:"Funky Green Dogs",year:1996,bpm:126,tonic:9,progId:"deepHouse",baseTemplate:"tribalhouse",narrative:"arch",vary:.7,sync:1,tip:"A Murk-crew circuit-house classic that lets a long tribal percussion loop drive most of the track before the vocal properly arrives, the vocal itself rising and falling in one clear arc once it does. `arch` is that phrase shape; the deep-house vamp underneath matches its driving minor groove."},{id:"tribalhouse_luvdancin",name:"Luv Dancin'",artist:"Roger Sanchez",year:2001,bpm:127,tonic:2,progId:"aeolian",baseTemplate:"tribalhouse",narrative:"ostinato",vary:.4,sync:1,tip:"Sanchez's garage-tribal crossover hit is carried almost entirely by its percussion loop and a sampled vocal phrase repeated rather than developed, arrangement interest coming from filtering and drops rather than new melody. `ostinato` is that repeating cell."},{id:"tribalhouse_musicistheanswer",name:"Music Is the Answer (Everything's Gonna Be Alright)",artist:"Danny Tenaglia ft. Celeda",year:1998,bpm:126,tonic:7,progId:"deepHouse",baseTemplate:"tribalhouse",narrative:"callResp",vary:.8,sync:1,tip:"A tribal house landmark from Tenaglia's Tourism album \u2014 Celeda's gospel-house-styled vocal calls and the track's own backing chants answer over a very long, percussion-driven groove. `callResp` writes that trade directly."},{id:"tribalhouse_beautifulpeople",name:"Beautiful People",artist:"Barbara Tucker",year:1994,bpm:125,tonic:0,progId:"gospel",baseTemplate:"tribalhouse",narrative:"archSong",vary:.8,sync:1,tip:"A Strictly Rhythm tribal-house classic with a genuine gospel-house vocal arc from Tucker rather than a chant, riding over congas and toms that otherwise carry the arrangement almost alone. `archSong` gives it one clear rise-and-fall across the whole record; `gospel` fits her testifying delivery."},{id:"tribalhouse_elevation",name:"Elevation",artist:"Jose Nunez's Latin Soul Brothers",year:1996,bpm:126,tonic:4,progId:"andalusian",baseTemplate:"tribalhouse",narrative:"chant",vary:.4,sync:1,tip:"A Nite Grooves tribal-house staple built on Latin percussion and a held, rhythm-driven chant rather than a written melody \u2014 the groove itself is the hook. `chant` matches that reciting pitch; the andalusian-flavoured minor progression reflects its Latin-percussion roots."},{id:"tribalhouse_elementsoflife",name:"Elements of Life",artist:"Louie Vega",year:2004,bpm:124,tonic:9,progId:"flamenco",baseTemplate:"tribalhouse",narrative:"wave",vary:.6,sync:1,tip:"Vega's epic, multi-vocalist Latin-tribal house suite unfolds in long, slow melodic swells over an extended percussion arrangement rather than a tight pop structure. `wave` is that long undulation; the flamenco-tinged minor colour matches its Latin-soul palette."},{id:"tribalhouse_slave",name:"Slave",artist:"Peven Everett",year:2003,bpm:125,tonic:5,progId:"deepHouse",baseTemplate:"tribalhouse",narrative:"ostinato",vary:.3,sync:0,tip:"A Chicago tribal/deep-house cut on Ubiquity where Everett's falsetto hook loops with almost no variation over a long, driving percussion break. `ostinato` at low vary reflects how little the vocal cell actually changes across the record."},{id:"tribalhouse_loveandhappiness",name:"Love & Happiness (Yemaya Y Ochun)",artist:"Micky More & Andy Tee ft. Kimara Lovelace",year:2003,bpm:126,tonic:2,progId:"andalusian",baseTemplate:"tribalhouse",narrative:"chant",vary:.5,sync:1,tip:"A Nervous Records tribal house favourite that layers Yoruba-deity-referencing chants over its percussion break rather than a conventional verse-chorus vocal. `chant` is that reciting-pitch, rhythm-driven hook; the Latin-modal progression matches its Santer\xEDa-referencing palette."},{id:"tribalhouse_needinu",name:"Needin' U",artist:"David Morales presents The Face",year:1997,bpm:128,tonic:0,progId:"deepHouse",baseTemplate:"tribalhouse",narrative:"archSong",vary:.7,sync:1,tip:"Morales's garage-tribal anthem became a defining late-'90s club record on the strength of one sampled diva vocal phrase given a full song arc over a relentless, driving percussion loop. `archSong` gives that phrase its one clear rise-and-fall across the whole track."},{id:"tribalhouse_elements",name:"Elements",artist:"Danny Tenaglia",year:1998,bpm:126,tonic:7,progId:"aeolian",baseTemplate:"tribalhouse",narrative:"wave",vary:.5,sync:1,tip:"Another Tourism-album tribal house epic, largely instrumental, that lets a long percussion arrangement swell and recede in slow waves rather than build to a single drop. `wave` is that long undulation."},{id:"filterhouse_dafunk",name:"Da Funk",artist:"Daft Punk",year:1995,bpm:108,tonic:5,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"ostinato",vary:.3,sync:1,tip:"The duo's breakout single is one squelchy analogue-synth riff opened and closed by a filter sweep for the whole record's length \u2014 no verse, no chorus, just the loop and the filter automation. `ostinato` writes that single repeating cell exactly."},{id:"filterhouse_aroundtheworld",name:"Around the World",artist:"Daft Punk",year:1997,bpm:121,tonic:9,progId:"aeolian",baseTemplate:"filterhouse",narrative:"ostinato",vary:.2,sync:0,tip:"Famously built from exactly four short vocodered/bass/keys loops assigned to the song's structure and nothing else \u2014 the whole arrangement is which loops are switched in and out. `ostinato` at very low vary matches how mechanically unchanging the actual loops are."},{id:"filterhouse_1999",name:"1999",artist:"Cassius",year:1999,bpm:123,tonic:0,progId:"mixo",baseTemplate:"filterhouse",narrative:"ostinato",vary:.4,sync:1,tip:"Cassius's title track from their debut album loops a chopped funk sample under a filter sweep that opens and closes each section, in the same French-touch mould as their peers. `ostinato` is that repeating disco-funk cell; `mixo` fits its major-key funk-loop harmony."},{id:"filterhouse_ladyhearmetonight",name:"Lady (Hear Me Tonight)",artist:"Modjo",year:2e3,bpm:124,tonic:9,progId:"aeolian",baseTemplate:"filterhouse",narrative:"archSong",vary:.7,sync:1,tip:"Built around a filtered Chic guitar-and-bass loop (from 'Soup for One'), Modjo's record is unusual for the style in carrying an actual sung verse-chorus song over the loop rather than just a vocal chant. `archSong` gives it that one real rise-and-fall arc."},{id:"filterhouse_intro",name:"Intro",artist:"Alan Braxe & Fred Falke",year:2004,bpm:123,tonic:2,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"ostinato",vary:.3,sync:1,tip:"A Vulture Records French-touch instrumental where a single arpeggiated synth loop is the entire arrangement, filtered open and shut across the record's length. `ostinato` is that one repeating cell heard through the filter automation."},{id:"filterhouse_somuchlove",name:"So Much Love to Give",artist:"Together",year:2003,bpm:124,tonic:7,progId:"aeolian",baseTemplate:"filterhouse",narrative:"chant",vary:.3,sync:1,tip:"Thomas Bangalter and DJ Falcon's one-off Roul\xE9 project loops a vocoded phrase over a filtered disco bassline rather than developing a melody, very much in the 'One More Time' mould. `chant` is that held, rhythm-driven repeated phrase."},{id:"filterhouse_robotique",name:"Robotique Music",artist:"Le Knight Club",year:1999,bpm:123,tonic:4,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"ostinato",vary:.3,sync:1,tip:"Braxe and Falke's Vulture-label alias runs one disco-sourced loop through an opening-and-closing filter sweep for its full length, the vocodered title phrase the only 'melody' present. `ostinato` matches that unchanging loop."},{id:"filterhouse_ifeelforyou",name:"I Feel For You",artist:"Bob Sinclar ft. Steve Edwards",year:2006,bpm:124,tonic:9,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"archSong",vary:.6,sync:1,tip:"Sinclar's disco-house hit gives Steve Edwards a genuine sung hook over a filtered disco-loop bed, closer to song structure than the more purely instrumental French-touch records around it. `archSong` gives that vocal one clear rise-and-fall arc."},{id:"filterhouse_prixchoc",name:"Prix Choc",artist:"\xC9tienne de Cr\xE9cy",year:1996,bpm:124,tonic:0,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"ostinato",vary:.2,sync:1,tip:"From de Cr\xE9cy's Super Discount album, a stripped disco-funk loop is opened and closed by a filter for the whole record with almost no other development. `ostinato` at low vary matches that minimal change pass to pass."},{id:"filterhouse_musicsoundsbetter",name:"Music Sounds Better With You",artist:"Stardust",year:1998,bpm:123,tonic:5,progId:"deepHouse",baseTemplate:"filterhouse",narrative:"ostinato",vary:.3,sync:1,tip:"The genre's defining anthem \u2014 one vocoded four-bar phrase looped and filtered rather than developed, the whole song being an opening-and-closing filter sweep over that single cell. `ostinato` writes that same short repeating cell without touching the actual sampled hook."},{id:"nudisco_jealous",name:"Jealous (I Ain't With It)",artist:"Chromeo",year:2014,bpm:111,tonic:10,progId:"rhythm",baseTemplate:"nudisco",narrative:"motif",vary:.7,sync:1,tip:"Chromeo's talkbox-and-synth-bass hook is a short funk cell that gets re-voiced and re-harmonised each time it returns rather than repeating identically, riding their signature chugging offbeat guitar. `motif` is that restated, transformed cell."},{id:"nudisco_babyimyours",name:"Baby I'm Yours",artist:"Breakbot ft. Irfane",year:2012,bpm:120,tonic:9,progId:"axis",baseTemplate:"nudisco",narrative:"archSong",vary:.8,sync:1,tip:"Breakbot's biggest crossover hit pairs a genuinely funky, walking bassline with a real sung verse-chorus structure from Irfane, closer to a pop song than most filter-disco cuts. `archSong` gives it one full rise-and-fall arc across the record."},{id:"nudisco_inspectornorse",name:"Inspector Norse",artist:"Todd Terje",year:2012,bpm:122,tonic:2,progId:"deepHouse",baseTemplate:"nudisco",narrative:"ostinato",vary:.3,sync:1,tip:"Terje's most-played instrumental loops one bright synth riff over a house pump and offbeat groove for its whole length, arrangement interest coming purely from filtering and added percussion layers. `ostinato` is that one repeating hook."},{id:"nudisco_fadenaway",name:"Faden Away",artist:"Dam-Funk & Steve Arrington",year:2013,bpm:108,tonic:5,progId:"neoSoul",baseTemplate:"nudisco",narrative:"wave",vary:.6,sync:0,tip:"From their Higher collaboration album, Arrington's soul vocal glides in slow, long phrases over Dam-Funk's boogie-funk synth bed rather than a tight disco pump. `wave` is that slow undulation; the neo-soul harmony fits Arrington's classic soul writing."},{id:"nudisco_hypnotized",name:"Hypnotized",artist:"Purple Disco Machine ft. Sophie and the Giants",year:2020,bpm:122,tonic:0,progId:"deepHouse",baseTemplate:"nudisco",narrative:"archSong",vary:.8,sync:1,tip:"A modern nu-disco radio hit that pairs a chugging offbeat guitar and house pump with a fully sung verse-chorus vocal from Sophie and the Giants rather than a chant. `archSong` captures that one clear pop rise-and-fall."},{id:"nudisco_barbrastreisand",name:"Barbra Streisand",artist:"Duck Sauce",year:2010,bpm:128,tonic:6,progId:"mixo",baseTemplate:"nudisco",narrative:"chant",vary:.3,sync:1,tip:"Built from a looped disco sample of the singer's name shouted rather than sung, plus a chugging bassline underneath \u2014 one of the clearest examples of nu-disco's sample-loop side. `chant` matches that repeated, rhythm-driven vocal hook."},{id:"nudisco_allyourewaitingfor",name:"All You're Waiting For",artist:"Classixx ft. Nancy Whang",year:2013,bpm:118,tonic:4,progId:"deepHouse",baseTemplate:"nudisco",narrative:"motif",vary:.6,sync:1,tip:"Nancy Whang's cool, understated vocal returns as a short restated cell over Classixx's genuinely funky bassline and house pump rather than developing into a big pop chorus. `motif` is that repeated-with-small-changes cell."},{id:"nudisco_cocaineblues",name:"Cocaine Blues",artist:"Escort",year:2010,bpm:120,tonic:7,progId:"axisMinor",baseTemplate:"nudisco",narrative:"chordLock",vary:.5,sync:1,tip:"The NYC disco-revival band's horn-and-guitar stabs only move because the chord underneath changes, riding a chugging offbeat guitar and a genuinely funky live bassline rather than a synth loop. `chordLock` writes exactly that riff-follows-the-chord behaviour."},{id:"techhouse_flash",name:"Flash",artist:"Green Velvet",year:1995,bpm:130,tonic:0,progId:"axisMinor",baseTemplate:"techhouse",narrative:"ostinato",vary:.2,sync:1,tip:"Cajmere's Green Velvet alias built this Chicago tech-house classic from one hypnotic acid-bass riff that barely develops across the whole track \u2014 the interest is entirely in what filters or drops out, not what's added. `ostinato` at low vary matches that."},{id:"techhouse_doyawannafeel",name:"Do Ya Wanna Feel",artist:"Jamie Jones",year:2013,bpm:125,tonic:9,progId:"deepHouse",baseTemplate:"techhouse",narrative:"chant",vary:.3,sync:1,tip:"A Hot Creations tech-house staple where a chopped vocal sample repeats the title phrase over two very long grooves rather than developing a melody, drops built from subtraction not addition. `chant` is that held, reciting vocal hook."},{id:"techhouse_turnoffthelights",name:"Turn Off the Lights",artist:"Chris Lake",year:2020,bpm:125,tonic:2,progId:"deepHouse",baseTemplate:"techhouse",narrative:"ostinato",vary:.3,sync:1,tip:"Lake's minimal, DJ-tool-styled tech house hit runs one bass-and-percussion groove for most of its length, with the arrangement built almost entirely from strategic drop-outs. `ostinato` matches that barely-changing loop."},{id:"techhouse_forget",name:"Forget",artist:"Patrick Topping",year:2016,bpm:126,tonic:7,progId:"aeolian",baseTemplate:"techhouse",narrative:"chant",vary:.3,sync:1,tip:"A Hot Creations dancefloor weapon built on a single chopped vocal chant looping over a relentless, minimal groove rather than any sung melody. `chant` writes that reciting, rhythm-driven hook."},{id:"techhouse_xtc",name:"XTC",artist:"Solardo",year:2018,bpm:125,tonic:0,progId:"deepHouse",baseTemplate:"techhouse",narrative:"ostinato",vary:.2,sync:1,tip:"Solardo's breakout tech house hit keeps a single chopped-vocal-and-bass groove running almost unchanged, with the track's drama coming entirely from what drops out at the breakdown. `ostinato` at low vary matches that."},{id:"techhouse_buggin",name:"Buggin'",artist:"Hot Since 82",year:2019,bpm:124,tonic:4,progId:"deepHouse",baseTemplate:"techhouse",narrative:"motif",vary:.4,sync:1,tip:"Hot Since 82's hit reworks a short vocal-and-bass cell with small variations across its two long sections rather than introducing much new material. `motif` is that lightly-varied returning cell."},{id:"techhouse_bangbang",name:"Bang Bang",artist:"wAFF",year:2020,bpm:126,tonic:9,progId:"aeolian",baseTemplate:"techhouse",narrative:"chant",vary:.3,sync:1,tip:"wAFF's tech house hit loops a punchy, shouted vocal chop over a relentless minimal groove, the drops entirely a matter of stripping elements back rather than layering more in. `chant` matches that repeated, rhythm-first hook."},{id:"techhouse_yesandiknowit",name:"Yes And I Know It",artist:"Michael Bibi",year:2020,bpm:125,tonic:5,progId:"deepHouse",baseTemplate:"techhouse",narrative:"ostinato",vary:.3,sync:1,tip:"A Solotoko tech house anthem built on one chugging bass-and-vocal-chop groove sustained for most of its runtime, its two big sections distinguished mainly by what's been dropped out. `ostinato` writes that same barely-developing loop."},{id:"deeptech_needu100",name:"Need U (100%)",artist:"Duke Dumont ft. A*M*E",year:2013,bpm:123,tonic:5,progId:"deepHouse",baseTemplate:"deeptech",narrative:"chant",vary:.4,sync:2,tip:"Need U (100%) built its whole hook from a chopped, syncopated vocal sample punched against sustained deep-house chords rather than a sung verse. `chant` keeps that reciting-pitch, rhythm-first character; sync 2 matches how hard the chop pushes off the beat."},{id:"deeptech_besomeone",name:"Be Someone",artist:"CamelPhat & Jake Bugg",year:2018,bpm:122,tonic:10,progId:"deepHouse",baseTemplate:"deeptech",narrative:"archSong",vary:.8,sync:1,tip:"CamelPhat paired their tech-house chord stabs, voiced long here rather than punched, with an actual verse-chorus indie vocal from Jake Bugg. `archSong` traces that single song-wide rise and fall instead of looping a short hook."},{id:"deeptech_cola",name:"Cola",artist:"CamelPhat & Elderbrook",year:2017,bpm:123,tonic:9,progId:"deepHouse",baseTemplate:"deeptech",narrative:"motif",vary:.6,sync:1,tip:"Cola's identity is Elderbrook's falsetto restating the same 'pour me a cola' cell over a lushly held tech-house chord loop that never stabs. `motif` keeps that one short cell recognisable through the arrangement."},{id:"deeptech_losingit",name:"Losing It",artist:"FISHER",year:2018,bpm:125,tonic:2,progId:"mixo",baseTemplate:"deeptech",narrative:"ostinato",vary:.3,sync:1,tip:"Losing It is carried almost entirely by one chopped 'you're always losing it' vocal sample looping under long-held chords, with barely any bar-to-bar development. `ostinato` writes that same fixed, barely-developing cell."},{id:"deeptech_takeit",name:"Take It",artist:"Dom Dolla",year:2018,bpm:123,tonic:0,progId:"mixo",baseTemplate:"deeptech",narrative:"ostinato",vary:.4,sync:2,tip:"Take It's hook is a single 'I could take it' vocal chop stabbed against the beat and never developed into a full line - the motion comes from the filter opening around it. `ostinato` mirrors that fixed cell; sync 2 for how hard the chop lands off-beat."},{id:"deeptech_sanfrandisco",name:"San Frandisco",artist:"Dom Dolla",year:2019,bpm:125,tonic:9,progId:"deepHouse",baseTemplate:"deeptech",narrative:"germ",vary:.6,sync:1,tip:"San Frandisco's bassline riff is the whole hook, and Dolla keeps returning to it slightly re-voiced and further filtered each pass rather than replacing it. `germ` develops that one cell section to section over long, sustained chords."},{id:"deeptech_mk17",name:"17",artist:"MK",year:2017,bpm:122,tonic:0,progId:"deepHouse",baseTemplate:"deeptech",narrative:"climb",vary:.7,sync:1,tip:"MK's '17' is driven by a piano riff that keeps climbing register as the track opens up rather than a sung top-line, the whole lift coming from that rising figure over long chord holds. `climb` is exactly that creeping-upward shape."},{id:"deeptech_readyforyourlove",name:"Ready For Your Love",artist:"Gorgon City ft. MNEK",year:2014,bpm:124,tonic:7,progId:"deepHouse",baseTemplate:"deeptech",narrative:"callResp",vary:.8,sync:1,tip:"MNEK's vocal trades a lead line against its own gospel-tinged backing answers over Gorgon City's long, sustained house chords. `callResp` writes that same call-and-answer shape instead of a single melodic line."},{id:"deeptech_mylove",name:"My Love",artist:"Route 94 ft. Jess Glynne",year:2013,bpm:124,tonic:2,progId:"deepHouse",baseTemplate:"deeptech",narrative:"period",vary:.7,sync:1,tip:"Jess Glynne's top-line moves in tidy two-bar question-and-answer sentences over Route 94's held deep-house chords rather than breaking into a big belted chorus. `period` keeps that same call-then-answer phrasing."},{id:"deeptech_turnoffthelights",name:"Turn Off The Lights",artist:"Chris Lake ft. Alexis Roberts",year:2020,bpm:125,tonic:9,progId:"deepHouse",baseTemplate:"deeptech",narrative:"ostinato",vary:.4,sync:2,tip:"Chris Lake loops Alexis Roberts' title line as a tight vocal chop over long-held chord pads rather than writing it out as a verse. `ostinato` keeps that fixed repeating cell; sync 2 matches how far off the beat the chop sits."},{id:"organichouse_innerbloom",name:"Innerbloom",artist:"R\xDCF\xDCS DU SOL",year:2016,bpm:122,tonic:9,progId:"dorian",baseTemplate:"organichouse",narrative:"wave",vary:.5,sync:0,tip:"Innerbloom stretches one filtered vocal phrase across nine slowly unfolding minutes, texture doing almost all the work as the arrangement opens and closes like a long breath. `wave` is that long, slow undulation; low sync keeps every entrance landing gently on the beat."},{id:"organichouse_youwereright",name:"You Were Right",artist:"R\xDCF\xDCS DU SOL",year:2018,bpm:123,tonic:2,progId:"deepHouse",baseTemplate:"organichouse",narrative:"archSong",vary:.8,sync:1,tip:"You Were Right plays as a real verse-chorus song grafted onto a slow-building house arrangement, its vocal arcing once from hushed verse to open chorus rather than looping a hook. `archSong` traces that single rise-and-fall."},{id:"organichouse_atlas",name:"Atlas",artist:"Ben B\xF6hmer",year:2020,bpm:122,tonic:4,progId:"dorian",baseTemplate:"organichouse",narrative:"climb",vary:.9,sync:0,tip:"Atlas is an instrumental that keeps introducing its lead line a register higher as each section gradually adds another layer, rather than repeating one hook. `climb` matches that steady upward creep, never slamming a new part in."},{id:"organichouse_runaway",name:"Runaway",artist:"Ben B\xF6hmer with Nils Hoffmann feat. Malou",year:2019,bpm:122,tonic:7,progId:"deepHouse",baseTemplate:"organichouse",narrative:"arch",vary:.7,sync:1,tip:"Malou's vocal rises and settles within each phrase rather than pushing to one big peak, sitting inside B\xF6hmer and Hoffmann's slowly filtering pads. `arch` is that phrase-level rise-and-fall."},{id:"organichouse_brightestlights",name:"Brightest Lights",artist:"Lane 8 ft. Solomon Grey",year:2017,bpm:122,tonic:9,progId:"dorian",baseTemplate:"organichouse",narrative:"motif",vary:.6,sync:0,tip:"Solomon Grey's vocal returns to the same restrained melodic cell each
