locked reciting line over a hypnotic acid bassline rather than a sung hook. `chant` is that held vocal shape; low vary keeps it as static as the real loop."},{id:"goatrance_deltaaquarids",name:"Delta Aquarids",artist:"Total Eclipse",year:1995,bpm:142,tonic:7,progId:"dorian",baseTemplate:"goatrance",narrative:"wave",vary:.4,sync:1,tip:"The title track of a defining Goa album, built on a rolling acid bassline under a long, spacious, slowly undulating pad breakdown rather than a melodic hook. `wave` is that same long undulation."},{id:"goatrance_silicontrip",name:"Silicon Trip",artist:"Shakta",year:1997,bpm:146,tonic:10,progId:"aeolian",baseTemplate:"goatrance",narrative:"terraced",vary:.5,sync:1,tip:"A UK Goa trance classic that builds by stacking a short repeating figure a layer higher each pass rather than introducing new melodic material. `terraced` is that same layering shape."},{id:"goatrance_vimana",name:"Vimana",artist:"Etnica",year:1997,bpm:145,tonic:9,progId:"mixo",baseTemplate:"goatrance",narrative:"motif",vary:.6,sync:1,tip:"Italian Goa pioneers Etnica built this around one short, driving melodic cell that keeps returning re-dressed in new synth textures rather than developing into a new tune. `motif` restates that cell, transformed section to section."},{id:"goatrance_teleport",name:"Teleport",artist:"Man With No Name",year:1994,bpm:136,tonic:1,progId:"lydian",baseTemplate:"goatrance",narrative:"ostinato",vary:.3,sync:1,tip:"An early UK Goa staple carried by one hypnotic, rolling acid-bass riff that loops through nearly the entire track rather than developing a melody. `ostinato` matches that minimally-varying repeating cell."},{id:"goatrance_foreverafter",name:"Forever After",artist:"Koxbox",year:1995,bpm:142,tonic:4,progId:"phrygian",baseTemplate:"goatrance",narrative:"germ",vary:.6,sync:1,tip:"The title track of a landmark Danish Goa album \u2014 a small melodic cell gets developed further and re-harmonized each time it returns, over a constantly rolling bassline. `germ` is that same cell-by-cell development."},{id:"goatrance_cannabanoid",name:"Cannabanoid",artist:"Cosmosis",year:1996,bpm:145,tonic:9,progId:"phrygian",baseTemplate:"goatrance",narrative:"ostinato",vary:.3,sync:1,tip:"Cosmosis helped define Goa trance's acid-303 rolling bassline sound, and this track rides one such hypnotic bassline with almost no melodic development on top. `ostinato` keeps that single repeating cell as the actual hook."},{id:"goatrance_godisgod",name:"God Is God",artist:"Juno Reactor",year:1997,bpm:140,tonic:9,progId:"phrygian",baseTemplate:"goatrance",narrative:"chant",vary:.4,sync:1,tip:"Juno Reactor built this around a Middle Eastern-flavoured vocal from Natacha Atlas held as a reciting, rhythm-locked line over a driving rolling bass rather than a Western pop melody. `chant` captures that held reciting shape."},{id:"psytrance_thegathering",name:"The Gathering",artist:"Infected Mushroom",year:1999,bpm:142,tonic:11,progId:"mixo",baseTemplate:"psytrance",narrative:"germ",vary:1,sync:1,tip:"Infected Mushroom's breakthrough is built from one distorted lead riff that keeps mutating in timbre and register across the seven-minute runtime rather than introducing fresh material. `germ` develops that same seed section by section, matching how the real track keeps reworking its one idea."},{id:"psytrance_saeed",name:"Sa'eed",artist:"Infected Mushroom",year:2003,bpm:145,tonic:5,progId:"aeolian",baseTemplate:"psytrance",narrative:"motif",vary:.8,sync:1,tip:"Sa'eed's squelchy central hook keeps returning re-filtered, re-pitched and re-voiced rather than repeating verbatim. `motif` writes that short cell recurring in transformed guise each pass."},{id:"psytrance_mahadeva99",name:"Mahadeva '99",artist:"Astral Projection",year:1999,bpm:138,tonic:5,progId:"mixo",baseTemplate:"psytrance",narrative:"terraced",vary:.5,sync:0,tip:"The '99 remake stacks its Eastern-tinged arpeggio a step higher with each added layer, the classic Astral Projection trick of building density purely through register. `terraced` writes exactly that stepwise layering."},{id:"psytrance_lsd",name:"LSD",artist:"Hallucinogen",year:1995,bpm:137,tonic:2,progId:"aeolian",baseTemplate:"psytrance",bassVoice:"acid",narrative:"ostinato",vary:.2,sync:0,tip:"The genre-founding record: one looping, acid-flavoured sixteenth-note cell barely develops for over six minutes, carried by filter sweeps rather than melodic change. `ostinato` at very low vary keeps that single loop intact, with an acid bass voice standing in for the real track's TB-303-descended squelch."},{id:"psytrance_teleport",name:"Teleport",artist:"Man With No Name",year:1994,bpm:136,tonic:1,progId:"mixo",baseTemplate:"psytrance",bassVoice:"acid",narrative:"ostinato",vary:.3,sync:0,tip:"Teleport's hook is a looped Jeff Goldblum dialogue sample riding a hypnotic acid bassline that repeats near-verbatim throughout. `ostinato` mirrors that spoken-sample loop rather than inventing a sung melody."},{id:"psytrance_jaws",name:"Jaws",artist:"GMS",year:2002,bpm:149,tonic:10,progId:"axis",baseTemplate:"psytrance",narrative:"motif",vary:.6,sync:1,tip:"GMS built Jaws around a stabbing, staccato riff that snaps back in slightly altered shapes between drops rather than looping flat. `motif` restates that short cell with real variation section to section."},{id:"psytrance_memories",name:"Memories (Overdrive (PSY) Remix)",artist:"Vibe Tribe",year:2024,bpm:145,tonic:2,progId:"festival",baseTemplate:"psytrance",narrative:"wave",vary:.6,sync:1,tip:"This remix stretches Vibe Tribe's theme into a slow-breathing pad-and-lead swell rather than a hooky repeating riff. `wave` writes that long undulating shape."},{id:"psytrance_theritual",name:"The Ritual",artist:"1200 Micrograms",year:2016,bpm:143,tonic:4,progId:"aeolian",baseTemplate:"psytrance",narrative:"chant",vary:.4,sync:1,tip:"True to its title, The Ritual keeps circling one insistent, rhythm-driven pitch under shifting percussion rather than a moving melody. `chant` writes that held reciting-tone hook."},{id:"psytrance_into4thdimension",name:"Into the 4th Dimension",artist:"Space Tribe",year:2019,bpm:147,tonic:7,progId:"mixo",baseTemplate:"psytrance",narrative:"climb",vary:.7,sync:1,tip:"Space Tribe push the lead line's register steadily upward across the whole track rather than resetting each section. `climb` captures that continuous ascent."},{id:"fullonpsy_namaste",name:"Namaste",artist:"Vini Vici",year:2015,bpm:156,tonic:2,progId:"edm",baseTemplate:"fullonpsy",narrative:"peak",vary:.8,sync:1,tip:"Namaste is built around withholding its biggest vocal-chant peak until deep into the track \u2014 the anthemic full-on trick of delaying the payoff. `peak` keeps that top note in reserve until then."},{id:"fullonpsy_thetribe",name:"The Tribe",artist:"Vini Vici",year:2015,bpm:138,tonic:4,progId:"axis",baseTemplate:"fullonpsy",narrative:"chant",vary:.4,sync:1,tip:"The Tribe's tribal vocal chant sits on one repeated pitch driven purely by rhythm, over Vini Vici's rolling trademark bass. `chant` writes that same held, rhythm-first hook."},{id:"fullonpsy_deepjunglewalk",name:"Deep Jungle Walk",artist:"Astrix",year:2016,bpm:138,tonic:8,progId:"dorian",baseTemplate:"fullonpsy",narrative:"terraced",vary:.6,sync:1,tip:"Astrix layers tribal percussion and a jungle-toned lead a step higher with each pass, building density the way full-on does without changing the groove. `terraced` mirrors that stepwise layering; the dorian vamp keeps it minor without turning sad."},{id:"fullonpsy_neurochemistry",name:"Neurochemistry",artist:"Ace Ventura ft. Liquid Soul",year:2015,bpm:136,tonic:7,progId:"mixo",baseTemplate:"fullonpsy",narrative:"germ",vary:.9,sync:1,tip:"Neurochemistry keeps reworking one melodic cell into denser variations as the track builds, more layers stacking on the rolling bass than plain psytrance would carry. `germ` develops that seed further each section."},{id:"fullonpsy_whohasthemarijuana",name:"Who Has The Marijuana?",artist:"Alien Project",year:2004,bpm:145,tonic:9,progId:"axis",baseTemplate:"fullonpsy",narrative:"qanda",vary:.5,sync:1,tip:"The title vocal sample is posed, then answered right after it by the bright major-key lead line, a genuinely playful full-on hook. `qanda` writes that same question-and-answer shape."},{id:"fullonpsy_speedfreaks",name:"Speed Freaks",artist:"1200 Micrograms",year:2016,bpm:143,tonic:11,progId:"axis",baseTemplate:"fullonpsy",narrative:"climb",vary:.6,sync:1,tip:"1200 Micrograms build Speed Freaks around a lead line that keeps creeping higher in register as the track's intensity accelerates. `climb` traces that continuous rise."},{id:"fullonpsy_rollercoaster",name:"Rollercoaster",artist:"Sesto Sento",year:2006,bpm:146,tonic:6,progId:"dorian",baseTemplate:"fullonpsy",narrative:"wave",vary:.7,sync:1,tip:"Sesto Sento's Rollercoaster swells and dips in long undulating waves rather than looping a fixed riff, true to its name. `wave` writes that same slow rise-and-fall shape."},{id:"fullonpsy_type1",name:"Type 1",artist:"Astrix",year:2012,bpm:138,tonic:9,progId:"axis",baseTemplate:"fullonpsy",narrative:"motif",vary:.6,sync:1,tip:"Type 1 restates its central riff with small rhythmic tweaks each time it resurfaces rather than looping it flat. `motif` captures that lightly varied recurrence."},{id:"fullonpsy_acid",name:"Acid",artist:"Freedom Fighters & Vini Vici",year:2020,bpm:138,tonic:4,progId:"axis",baseTemplate:"fullonpsy",narrative:"chordLock",vary:.5,sync:1,tip:"Acid's stabbing riff only moves because the chord underneath shifts \u2014 a classic instrumental-stab full-on lead rather than a sung hook. `chordLock` writes exactly that chord-snapped riff."},{id:"darkpsy_battleship",name:"Battleship",artist:"Xerox & Illumination",year:2005,bpm:145,tonic:7,progId:"mixo",baseTemplate:"darkpsy",narrative:"chordLock",vary:.4,sync:2,tip:"Battleship's riff snaps hard to each chord change rather than floating a free melody over it, giving this twilight-era anthem its aggressive, mechanical edge. `chordLock` at the higher sync writes that same chord-locked stab."},{id:"darkpsy_91skriamer",name:"91 Skriamer",artist:"Parasense",year:2003,bpm:145,tonic:3,progId:"mixo",baseTemplate:"darkpsy",narrative:"ostinato",vary:.3,sync:1,tip:"One of Parasense's foundational Russian 'night' tracks: a single hypnotic riff loops with almost no melodic development, the blueprint that fed directly into darkpsy. `ostinato` at low vary keeps that one-cell loop intact, built to disorient rather than resolve."},{id:"darkpsy_element",name:"Element",artist:"Parasense",year:2009,bpm:145,tonic:1,progId:"mixo",baseTemplate:"darkpsy",narrative:"germ",vary:.6,sync:1,tip:"Element restates its central riff in denser, more distorted shapes as the track wears on, years into Parasense's evolution of the night-psy sound. `germ` develops that seed further each section."},{id:"darkpsy_interdisciplinarysubfield",name:"Interdisciplinary Subfield",artist:"Parasense",year:2018,bpm:147,tonic:2,progId:"axis",baseTemplate:"darkpsy",narrative:"motif",vary:.7,sync:1,tip:"This later Parasense cut layers a returning theme with real rhythmic and timbral variation each time it resurfaces rather than looping unchanged. `motif` captures that transformed restatement."},{id:"darkpsy_perpetuummobile",name:"Perpetuum Mobile",artist:"Terrafractyl",year:2024,bpm:144,tonic:5,progId:"aeolian",baseTemplate:"darkpsy",narrative:"ostinato",vary:.2,sync:1,tip:"True to its title, Perpetuum Mobile runs one mechanical minor-key cell almost unchanged for its whole length rather than developing a melody. `ostinato` at very low vary mirrors that endlessly repeating loop."},{id:"darkpsy_borntogrit",name:"Born to Grit",artist:"Kindzadza",year:2023,bpm:200,tonic:2,progId:"axisMinor",baseTemplate:"darkpsy",bassVoice:"reese",narrative:"chant",vary:.3,sync:2,tip:"Kindzadza's hitech-adjacent Born to Grit rides a distorted, rhythm-driven vocal chop at a punishing 200bpm rather than a sung line. `chant` at the higher sync writes that same rhythm-first, pitch-held hook, with a growling reese bass standing in for its distorted low end."},{id:"darkpsy_deeplydisturbed",name:"Deeply Disturbed",artist:"Infected Mushroom",year:1999,bpm:146,tonic:5,progId:"mixo",baseTemplate:"darkpsy",narrative:"germ",vary:.7,sync:1,tip:"One of Infected Mushroom's harshest early cuts, Deeply Disturbed reworks its noisy stab hook into increasingly distorted variations across the track. `germ` develops that seed section by section."},{id:"darkpsy_momentoftruth",name:"Moment of Truth",artist:"Man With No Name",year:1996,bpm:140,tonic:7,progId:"mixo",baseTemplate:"darkpsy",narrative:"terraced",vary:.5,sync:1,tip:"This harder-edged 1996 cut layers its Goa-tech riff a step higher with each new section, building tension purely through register. `terraced` mirrors that stepwise buildup."},{id:"darkpsy_keytotheinnerverse",name:"Key to the Innerverse",artist:"Cosmosis",year:1996,bpm:143,tonic:9,progId:"axis",baseTemplate:"darkpsy",narrative:"wave",vary:.5,sync:0,tip:"Cosmosis's twilight-era classic \u2014 released on the Cosmology album \u2014 undulates in long psychedelic pad swells rather than looping a fixed riff. `wave` captures that slow undulation."},{id:"darkpsy_thecrucible",name:"The Crucible",artist:"Total Eclipse",year:1995,bpm:140,tonic:2,progId:"mixo",baseTemplate:"darkpsy",narrative:"cascade",vary:.5,sync:1,tip:"The Crucible's lead line descends in a repeating falling sequence rather than climbing toward a hook, giving this mid-90s Delta Aquarids-era staple its ominous pull. `cascade` writes that same falling-sequence shape."},{id:"progpsy_birdofparadise",name:"Bird of Paradise",artist:"Ticon",year:2017,bpm:139,tonic:7,progId:"mixo",baseTemplate:"progpsy",narrative:"wave",vary:.6,sync:1,tip:"Ticon favours a long, slow-breathing melodic swell over a hooky stabbing riff \u2014 the groovier, deeper pocket that separates progressive from full-on. `wave` writes that undulating shape instead of a repeating cell."},{id:"progpsy_facethetruth",name:"Face the Truth",artist:"Symphonix",year:2014,bpm:138,tonic:9,progId:"axis",baseTemplate:"progpsy",narrative:"arch",vary:.7,sync:1,tip:"Symphonix build their theme as a phrase that rises and resolves back down within each section rather than looping flat, over their trademark laid-back, sea-deep groove. `arch` traces that rise-and-fall shape."},{id:"progpsy_landmark",name:"Landmark",artist:"Vibrasphere",year:2006,bpm:138,tonic:8,progId:"mixo",baseTemplate:"progpsy",narrative:"climb",vary:.8,sync:0,tip:"Vibrasphere creep the lead register steadily upward across the whole nine-minute arrangement instead of resetting each section \u2014 a classic deep progressive slow-build. `climb` captures that continuous ascent."},{id:"progpsy_leapoffaith",name:"Leap of Faith",artist:"Perfect Stranger",year:2012,bpm:126,tonic:5,progId:"axis",baseTemplate:"progpsy",narrative:"peak",vary:.9,sync:0,tip:"At a deep 126bpm, Perfect Stranger's Leap of Faith withholds its main melodic payoff until very late in its nine-minute run, true to progressive psy's patient, less-frantic pacing. `peak` keeps that top note in reserve."},{id:"progpsy_keytotheuniverse",name:"Key to the Universe",artist:"Sesto Sento",year:2015,bpm:144,tonic:0,progId:"aeolian",baseTemplate:"progpsy",narrative:"qanda",vary:.6,sync:1,tip:"Sesto Sento poses a short lead phrase and answers it with a second, matching one right after it \u2014 an actual question-and-answer structure. `qanda` writes that same call-and-answer shape."},{id:"progpsy_childrenofearth",name:"Children of Earth",artist:"Liquid Soul & Timelock",year:2019,bpm:138,tonic:4,progId:"dorian",baseTemplate:"progpsy",narrative:"period",vary:.6,sync:1,tip:"This collaboration sits in tidy two-bar question-then-answer sentences over a static minor groove rather than a driving anthem. `period` and the dorian vamp both capture that grounded, tech-house-adjacent pocket."},{id:"progpsy_longestjourney",name:"Longest Journey",artist:"Aphid Moon ft. Tron",year:2019,bpm:144,tonic:4,progId:"axis",baseTemplate:"progpsy",narrative:"expand",vary:.8,sync:1,tip:"Aphid Moon and Tron widen the register dramatically at the track's emotional high point rather than building gradually, true to its 'journey' framing. `expand` captures that sudden widening."},{id:"progpsy_matter",name:"Matter",artist:"Sphera",year:2015,bpm:138,tonic:4,progId:"mixo",baseTemplate:"progpsy",narrative:"motif",vary:.5,sync:1,tip:"Sphera restates Matter's central motif with small variations each time it returns, never looping it flat, over a deep, less-frantic groove. `motif` captures that lightly varied recurrence."},{id:"progpsy_thecrow",name:"The Crow",artist:"GMS",year:1997,bpm:145,tonic:0,progId:"axis",baseTemplate:"progpsy",narrative:"lament",vary:.5,sync:0,tip:"GMS's 1997 cut is built on a genuinely descending lead line, giving The Crow's melody its brooding downward pull rather than the genre's usual rising energy. `lament` writes that same descending shape."},{id:"progpsy_pranava",name:"Pranava",artist:"Ace Ventura & Astrix",year:2015,bpm:138,tonic:7,progId:"mixo",baseTemplate:"progpsy",narrative:"germ",vary:.7,sync:1,tip:"Ace Ventura and Astrix keep developing one central seed motif into denser variations as the track deepens, the more melodically-worked feel typical of progressive psy. `germ` captures that section-by-section development."},{id:"ukhardcore_charly",name:"Charly",artist:"The Prodigy",year:1991,bpm:131,tonic:8,progId:"axisMinor",baseTemplate:"ukhardcore",narrative:"ostinato",vary:.3,sync:1,tip:"Built almost entirely around the looped 'Charly says...' public-safety-cartoon sample and a rising synth stab rather than any sung hook \u2014 one of the first UK top-five breakbeat hardcore records. `ostinato` writes that same barely-developed looped cell instead of a real melody."},{id:"ukhardcore_outofspace",name:"Out of Space",artist:"The Prodigy",year:1992,bpm:138,tonic:7,progId:"axisMinor",baseTemplate:"ukhardcore",narrative:"motif",vary:.4,sync:1,tip:"The pitched-down Max Romeo vocal ('I was born...') and the descending bell riff both function as a short motif that returns transformed each section rather than developing into a real tune. `motif` captures that cell-and-restate shape."},{id:"ukhardcore_ragatip",name:"On a Ragga Tip",artist:"SL2",year:1992,bpm:140,tonic:9,progId:"mixo",baseTemplate:"ukhardcore",narrative:"callResp",vary:.6,sync:2,tip:"UK #2 hit built on a ragga MC toast answered by rave piano stabs \u2014 literally the style's call-and-response between chatted vocal and stabbed chords. `callResp` at the higher sync level matches the record's push against the beat."},{id:"ukhardcore_sesamestreet",name:"Sesame's Treet",artist:"Smart E's",year:1992,bpm:142,tonic:10,progId:"axis",baseTemplate:"ukhardcore",narrative:"ostinato",vary:.3,sync:1,tip:"A UK top-two novelty hit made from looping the Sesame Street theme's own riff over breakbeat hardcore drums, barely varied \u2014 `ostinato` writes that same repeated borrowed-melody cell rather than inventing new development."},{id:"ukhardcore_raving",name:"Raving I'm Raving",artist:"Shut Up and Dance",year:1992,bpm:150,tonic:4,progId:"gospel",baseTemplate:"ukhardcore",narrative:"archSong",vary:.5,sync:1,tip:"Built from a speeded-up Marc Cohn 'Walking in Memphis' vocal sample over piano and breaks \u2014 the sample's own gospel-tinged rise-and-fall shape carries the whole record (and got it pulled from sale over clearance). `archSong` mirrors that one-arc-per-song contour."},{id:"ukhardcore_trumpton",name:"A Trip to Trumpton",artist:"Urban Hype",year:1992,bpm:150,tonic:0,progId:"edm",baseTemplate:"ukhardcore",narrative:"terraced",vary:.5,sync:1,tip:"UK top-ten rave record built from sampled dialogue off the kids' TV show Trumpton stacked over layered, rising piano stabs \u2014 `terraced` writes that same short figure re-entering a step higher as each layer piles on."},{id:"ukhardcore_fantasy",name:"Let Me Be Your Fantasy",artist:"Baby D",year:1992,bpm:139,tonic:9,progId:"deepHouse",baseTemplate:"ukhardcore",narrative:"archSong",vary:.6,sync:1,tip:"A UK #1 (on reissue) built on a soaring, sung piano-house-meets-hardcore hook that rises across the whole record rather than looping flat \u2014 `archSong` writes that single wide arc, more melodically developed than the genre's sample-loop norm."},{id:"ukhardcore_bombscare",name:"Bombscare",artist:"2 Bad Mice",year:1992,bpm:150,tonic:2,progId:"aeolian",baseTemplate:"ukhardcore",narrative:"ostinato",vary:.3,sync:1,tip:"A Kickin' Records breakbeat hardcore anthem driven by one chopped break-and-riff cell repeated rather than developed, with the piano stabs doing the euphoric lifting. `ostinato` at low vary matches its loop-first construction."},{id:"ukhardcore_farout",name:"Far Out",artist:"Sonz of a Loop Da Loop Era",year:1992,bpm:150,tonic:7,progId:"axisMinor",baseTemplate:"ukhardcore",narrative:"chant",vary:.3,sync:1,tip:"One of the genre's biggest Suburban Base anthems, built on a chanted 'far out' vocal sample held over rising piano stabs rather than a sung melody. `chant` writes that reciting, rhythm-led hook directly."},{id:"ukhardcore_tripiimoon",name:"Trip II the Moon (Part 2)",artist:"Acen",year:1992,bpm:150,tonic:9,progId:"aeolian",baseTemplate:"ukhardcore",narrative:"wave",vary:.5,sync:1,tip:"A Production House breakbeat hardcore classic that leans on long synth-string swells under the amen chops rather than a stabbed hook \u2014 `wave`'s slow undulation captures that pad-led atmosphere better than a riff-based narrative would."},{id:"jungle_originalnuttah",name:"Original Nuttah",artist:"Shy FX & UK Apachi",year:1994,bpm:161,tonic:11,progId:"aeolian",baseTemplate:"jungle",narrative:"chant",vary:.4,sync:2,tip:"UK Apache's ragga toast rides a chopped amen and rolling sub \u2014 one of jungle's most sampled records, still a rave-scene fixture decades later. `chant` writes that reciting toasted vocal over the syncopated break."},{id:"jungle_incredible",name:"Incredible",artist:"M-Beat ft. General Levy",year:1994,bpm:161,tonic:9,progId:"deepHouse",baseTemplate:"jungle",narrative:"callResp",vary:.5,sync:2,tip:"A UK top-ten jungle crossover where General Levy's hyped ragga hook trades directly against the chopped break and stab hits. `callResp` writes that vocal-and-drum trade rather than a continuous melodic line."},{id:"jungle_terminator",name:"Terminator",artist:"Goldie",year:1992,bpm:150,tonic:6,progId:"axisMinor",baseTemplate:"jungle",narrative:"ostinato",vary:.2,sync:1,tip:"Released as Metalheads, built on a heavily timestretched Terminator film sample and one relentlessly manipulated break \u2014 a foundational darkcore/jungle record precisely because it barely develops harmonically. `ostinato` at low vary matches that one-cell obsession."},{id:"jungle_ricky",name:"Ricky",artist:"Remarc",year:1994,bpm:165,tonic:4,progId:"aeolian",baseTemplate:"jungle",narrative:"germ",vary:.8,sync:2,within:!0,tip:"Remarc's amen work is famous for getting more mangled as the record runs, not less \u2014 the same break cell resliced harder each pass. `germ` develops one cell further section to section, with `within:true` for how it keeps mutating inside a single pass too."},{id:"jungle_wickedestsound",name:"Wickedest Sound",artist:"Rebel MC & Tenor Fly",year:1993,bpm:160,tonic:9,progId:"deepHouse",baseTemplate:"jungle",narrative:"callResp",vary:.5,sync:2,tip:"An early ragga-jungle template \u2014 Tenor Fly's toast answers Rebel MC's productions bar for bar over a chopped break. `callResp` writes that same vocal-trade structure rather than a through-composed line."},{id:"jungle_helicoptertune",name:"The Helicopter Tune",artist:"Deep Blue",year:1993,bpm:160,tonic:2,progId:"aeolian",baseTemplate:"jungle",narrative:"wave",vary:.4,sync:1,tip:"Named for its swirling, siren-like sweep effect that rises and falls under the chopped amen \u2014 the effect is the hook, not a played line. `wave`'s long undulation is a closer fit than a riff-based narrative here."},{id:"jungle_shotinthedark",name:"Shot in the Dark",artist:"DJ Hype",year:1994,bpm:163,tonic:7,progId:"axisMinor",baseTemplate:"jungle",narrative:"ostinato",vary:.3,sync:1,tip:"A dark Ganja Records jungle roller built on one looped bass riff under an increasingly chopped break, with tension coming from the drum edits rather than harmonic movement. `ostinato` matches that flat, loop-first bassline."},{id:"jungle_valleyoftheshadows",name:"Valley of the Shadows",artist:"Origin Unknown",year:1993,bpm:160,tonic:9,progId:"deepHouse",baseTemplate:"jungle",narrative:"peak",vary:.4,sync:1,tip:"RAM Records' defining jungle anthem is built around a long-withheld drop into sub-bass and break \u2014 the arrangement's whole job is delaying that one moment. `peak` writes exactly that withheld payoff."},{id:"jungle_thelighter",name:"The Lighter",artist:"DJ SS",year:1994,bpm:162,tonic:5,progId:"aeolian",baseTemplate:"jungle",narrative:"motif",vary:.4,sync:1,tip:"A Formation Records jungle classic that restates a short sampled horn/vocal stab across sections rather than composing a new line each time. `motif` gives that cell room to return transformed without becoming a real melody."},{id:"jungle_darkstranger",name:"Dark Stranger",artist:"Johnny Jungle",year:1994,bpm:165,tonic:10,progId:"axisMinor",baseTemplate:"jungle",narrative:"germ",vary:.9,sync:2,within:!0,tip:"An early Metalheadz release whose amen gets audibly more aggressive and finely diced as it runs \u2014 the label's whole ethos in one track. `germ` with high vary and `within:true` writes that escalating, self-mutating chop."},{id:"dnb_music",name:"Music",artist:"LTJ Bukem",year:1993,bpm:160,tonic:5,progId:"dorian",baseTemplate:"dnb",narrative:"wave",vary:.5,sync:0,tip:"One of the records that founded 'intelligent' jungle \u2014 long, slow pad chords stated well before the double-time breaks properly lock in. `dorian`'s static minor-but-not-sad color and `wave`'s slow undulation both suit atmosphere-first construction."},{id:"dnb_nitenichiryu",name:"Ni Ten Ichi Ryu (Two Sword Technique)",artist:"Photek",year:1997,bpm:172,tonic:9,progId:"dorian",baseTemplate:"dnb",narrative:"motif",vary:.6,sync:1,tip:"From Photek's Modus Operandi, famous for surgically rearranged breaks under a spare, half-time-feeling bassline pulse. `motif` writes a short cell that returns rearranged, matching that meticulous-programming character."},{id:"dnb_snakestyle",name:"Snake Style",artist:"Source Direct",year:1996,bpm:172,tonic:2,progId:"aeolian",baseTemplate:"dnb",narrative:"germ",vary:.6,sync:1,tip:"A dark techstep landmark built on a reversed, warped vocal/sample cell that mutates further each pass over double-time drums. `germ` develops that one cell rather than introducing new material."},{id:"dnb_western",name:"Western",artist:"PFM",year:1996,bpm:172,tonic:9,progId:"dorian",baseTemplate:"dnb",narrative:"wave",vary:.4,sync:0,tip:"A Metalheadz cornerstone literally built on a slow, half-time bass pulse under fast double-time breaks \u2014 the exact shape this style describes. `wave`'s long undulation and `dorian`'s static minor color both track that low end."},{id:"dnb_silverblade",name:"Silver Blade",artist:"Dillinja",year:1996,bpm:174,tonic:2,progId:"axisMinor",baseTemplate:"dnb",narrative:"chordLock",vary:.4,sync:1,tip:"Dillinja's technical, bass-forward roller moves harmonically only when the sub underneath moves \u2014 the riff is locked to the chord, not singing over it. `chordLock` writes that exact stab-follows-chord relationship."},{id:"dnb_brownpaperbag",name:"Brown Paper Bag",artist:"Roni Size / Reprazent",year:1997,bpm:172,tonic:9,progId:"deepHouse",baseTemplate:"dnb",narrative:"motif",vary:.7,sync:1,tip:"From the Mercury Prize-winning New Forms, its famous double-bass riff is restated and reworked with real jazz-inflected variation section to section. `motif` at higher vary matches that genuine melodic development, unusual for the genre's loop norm."},{id:"dnb_circles",name:"Circles",artist:"Adam F",year:1997,bpm:172,tonic:5,progId:"deepHouse",baseTemplate:"dnb",narrative:"archSong",vary:.6,sync:1,tip:"A global dnb crossover hit that literally opens half-time on a Rhodes-style hook before the double-time breaks drop \u2014 atmosphere stated first, exactly as the style calls for. `archSong` writes that one wide rise-and-fall across the whole record."},{id:"dnb_thenine",name:"The Nine",artist:"Bad Company UK",year:2e3,bpm:174,tonic:0,progId:"axisMinor",baseTemplate:"dnb",narrative:"wave",vary:.4,sync:1,tip:"Opens on a huge, stated string/atmosphere pad well before the breaks properly enter \u2014 a dnb DJ-set staple precisely because of that patient build. `wave` gives the atmosphere its slow-moving own statement first."},{id:"dnb_nineteeneightyfour",name:"1984",artist:"Alix Perez",year:2008,bpm:174,tonic:7,progId:"dorian",baseTemplate:"dnb",narrative:"motif",vary:.5,sync:1,tip:"Alix Perez's breakout Shogun Audio single sits a dark, repeating synth cell over double-time drums with real but restrained development. `motif` and `dorian`'s static-minor color match that tense-but-not-melodic-hook shape."},{id:"liquiddnb_ifweever",name:"If We Ever",artist:"High Contrast",year:2007,bpm:172,tonic:5,progId:"jazz",baseTemplate:"liquiddnb",narrative:"arch",vary:.7,sync:1,tip:"From True Colours, High Contrast's soulful instrumental melody rises and falls within each phrase over a smoothed, rounded sub rather than a snarling reese. `arch` and the `jazz` chords match that melody-led, non-aggressive low end."},{id:"liquiddnb_horizons",name:"Horizons",artist:"LTJ Bukem",year:1995,bpm:165,tonic:8,progId:"jazz",baseTemplate:"liquiddnb",narrative:"wave",vary:.5,sync:0,tip:"A foundational 'intelligent' jungle record built on drifting Rhodes-style jazz chords under the breaks \u2014 melody and atmosphere lead throughout, the template liquid later formalised. `wave` writes that slow harmonic drift."},{id:"liquiddnb_justonesecond",name:"Just One Second",artist:"London Elektricity",year:2005,bpm:172,tonic:2,progId:"neoSoul",baseTemplate:"liquiddnb",narrative:"period",vary:.6,sync:1,tip:"From Hospital Records' Different Drums, its horn-and-vocal phrasing works in tidy question-then-answer two-bar sentences over a round, musical sub. `period` writes that same call-and-settle phrase structure."},{id:"liquiddnb_evenif",name:"Even If",artist:"Calibre",year:2003,bpm:172,tonic:9,progId:"deepHouse",baseTemplate:"liquiddnb",narrative:"lament",vary:.5,sync:1,tip:"Calibre's Signature-era liquid sits a wistful, descending vocal-adjacent melody over a soft sub rather than an aggressive bassline. `lament`'s falling line is the direct match for that mood."},{id:"liquiddnb_realise",name:"Realise",artist:"Marcus Intalex & ST Files",year:2004,bpm:172,tonic:4,progId:"aeolian",baseTemplate:"liquiddnb",narrative:"arch",vary:.6,sync:1,tip:"Marcus Intalex's melodic, jazzy wing of dnb built its reputation on tunes like this one \u2014 a warm minor-key melody that rises and settles within each phrase over a rounded low end rather than a growling one."},{id:"liquiddnb_lk",name:"LK (Carolina Carol Bela)",artist:"DJ Marky & XRS ft. Stamina MC",year:2003,bpm:174,tonic:0,progId:"bossa",baseTemplate:"liquiddnb",narrative:"period",vary:.7,sync:2,tip:"Built on a sampled Brazilian nursery-rhyme melody (Toquinho's 'Carolina Carol Bela') with a live MC trading over it \u2014 the `bossa` progression nods to that samba-jazz source and `period` matches its sung-phrase call-and-answer."},{id:"liquiddnb_rain",name:"Rain",artist:"S.P.Y",year:2011,bpm:174,tonic:7,progId:"dorian",baseTemplate:"liquiddnb",narrative:"wave",vary:.5,sync:1,tip:"S.P.Y's liquid roller leans on a slow, drifting pad and a round sub rather than a hooky top-line \u2014 the mood is the melody. `wave`'s long undulation fits that atmosphere-led writing."},{id:"liquiddnb_videovertigo",name:"Video Vertigo",artist:"Etherwood",year:2014,bpm:172,tonic:9,progId:"neoSoul",baseTemplate:"liquiddnb",narrative:"arch",vary:.6,sync:1,tip:"Etherwood's Med School-era liquid sits a warm, soulful synth-lead melody that rises and resolves within each phrase over a soft, rounded bassline. `arch` is the phrase-level shape that mood keeps returning to."},{id:"liquiddnb_morningsun",name:"Morning Sun",artist:"Fred V & Grafix",year:2014,bpm:174,tonic:0,progId:"futureBass",baseTemplate:"liquiddnb",narrative:"expand",vary:.6,sync:1,tip:"A Hospital Records liquid hit where the register visibly widens into a bright, major-key hook at the drop rather than staying narrow. `expand` and `futureBass`'s major lift both capture that brightening at the hook."},{id:"liquiddnb_lovehasgone",name:"Love Has Gone",artist:"Netsky",year:2010,bpm:174,tonic:5,progId:"deepHouse",baseTemplate:"liquiddnb",narrative:"archSong",vary:.6,sync:1,tip:"From Netsky's self-titled debut, a melodic vocal hook rises and falls once across the whole record rather than looping flat \u2014 one of the tracks that took liquid's jazzy, song-like wing to a much bigger audience. `archSong` writes that single wide arc."},{id:"neurofunk_cyanide",name:"Cyanide",artist:"Konflict",year:1998,bpm:174,tonic:9,progId:"axisMinor",baseTemplate:"neurofunk",narrative:"chordLock",vary:.3,sync:1,tip:"A genre-defining No U-Turn/Renegade Hardware release \u2014 the distorted reese only moves when the underlying chord does, engineering tension through pure sound design rather than melody. `chordLock` writes that riff-follows-chord relationship exactly."},{id:"neurofunk_wormhole",name:"Wormhole",artist:"Ed Rush & Optical",year:1998,bpm:174,tonic:2,progId:"aeolian",baseTemplate:"neurofunk",narrative:"ostinato",vary:.3,sync:1,tip:"From the Wormhole album that helped codify neurofunk, one grinding reese cell carries the drop with almost no harmonic development. `ostinato` at low vary matches that single-cell, sound-design-first drop."},{id:"neurofunk_machinegun",name:"Machine Gun",artist:"Noisia",year:2010,bpm:174,tonic:0,progId:"axisMinor",baseTemplate:"neurofunk",narrative:"chordLock",vary:.3,sync:2,tip:"Noisia's biggest crossover neurofunk moment \u2014 a stuttering, hyper-processed reese stab that snaps to the chord changes rather than singing over them. `chordLock` at the more aggressive sync captures that mechanical push."},{id:"neurofunk_rooted",name:"Rooted",artist:"Black Sun Empire",year:2005,bpm:174,tonic:7,progId:"aeolian",baseTemplate:"neurofunk",narrative:"ostinato",vary:.3,sync:1,tip:"A Black Sun Empire dancefloor staple built on one dark, distorted bass cell that barely develops \u2014 the tension comes from the sound design, not the arrangement. `ostinato` matches that flat, engineered repetition."},{id:"neurofunk_diplodocus",name:"Diplodocus",artist:"Noisia",year:2005,bpm:174,tonic:4,progId:"axisMinor",baseTemplate:"neurofunk",narrative:"motif",vary:.5,sync:1,tip:"An early Noisia release whose central riff mutates and re-processes itself as the track runs rather than restating flat. `motif` gives that cell room to return audibly changed each pass."},{id:"neurofunk_larva",name:"Larva",artist:"Phace",year:2011,bpm:174,tonic:9,progId:"aeolian",baseTemplate:"neurofunk",narrative:"chordLock",vary:.3,sync:2,tip:"A Neosignal Recordings neurofunk cut where the growling low end is locked hard to sparse chord stabs rather than carrying its own tune. `chordLock` is the direct fit for that riff-under-chord relationship."},{id:"neurofunk_emulate",name:"Emulate",artist:"Mefjus",year:2014,bpm:174,tonic:2,progId:"axisMinor",baseTemplate:"neurofunk",narrative:"ostinato",vary:.3,sync:2,tip:"Mefjus built his name on exactly this kind of mechanically precise, distorted reese drop with minimal harmonic movement. `ostinato` at the higher sync level matches that engineered, machine-tight repetition."},{id:"neurofunk_sinister",name:"Sinister",artist:"Evol Intent",year:2005,bpm:174,tonic:0,progId:"aeolian",baseTemplate:"neurofunk",narrative:"chordLock",vary:.4,sync:1,tip:"US neurofunk act Evol Intent build the drop around a distorted bass riff that only shifts when the chord underneath does. `chordLock` writes that same stab-led, chord-anchored bass movement."},{id:"neurofunk_bricks",name:"Bricks",artist:"The Upbeats",year:2011,bpm:174,tonic:7,progId:"axisMinor",baseTemplate:"neurofunk",narrative:"ostinato",vary:.3,sync:2,tip:"A New Zealand neurofunk anthem carried by one hard, distorted bass cell with almost no melodic elaboration \u2014 the drop's identity is the sound design. `ostinato` matches that engineered flatness."},{id:"neurofunk_deceiver",name:"Deceiver",artist:"Black Sun Empire & Noisia",year:2010,bpm:174,tonic:5,progId:"aeolian",baseTemplate:"neurofunk",narrative:"chordLock",vary:.4,sync:2,tip:"A Counterstrike collaboration (Black Sun Empire and Noisia) built on a snarling reese that snaps to sparse chord stabs \u2014 tension built entirely by sound design and rhythm. `chordLock` at high sync captures that mechanical bite."},{id:"halftimewave_gullyhalves",name:"Gully Halves",artist:"Alix Perez",year:2013,bpm:140,tonic:7,progId:"dorian",baseTemplate:"halftimewave",narrative:"wave",vary:.5,sync:1,tip:"Named for its half-time gait, cited by Ivy Lab among the genre's defining tracks \u2014 a dnb-tempo reese growl felt at half speed rather than a straight dubstep drop. `wave`'s long undulation matches its slow-motion low end."},{id:"halftimewave_pipedream",name:"Pipe Dream",artist:"Eprom",year:2013,bpm:140,tonic:0,progId:"axisMinor",baseTemplate:"halftimewave",narrative:"ostinato",vary:.3,sync:1,tip:"An Ivy Lab-cited halftime touchstone from West Coast bass producer Eprom, built on one warped, dnb-derived bass cell rather than a developed melody. `ostinato` matches that loop-first, sound-design-forward drop."},{id:"halftimewave_phantomforce",name:"Phantom Force (Fracture Remix)",artist:"Digital & Spirit",year:2014,bpm:140,tonic:2,progId:"aeolian",baseTemplate:"halftimewave",narrative:"motif",vary:.5,sync:1,tip:"Fracture's remix of the '90s Digital & Spirit dnb anthem recasts it at half-time \u2014 one of the tracks Ivy Lab named as genre-defining for showing how a jungle-era cell reads completely differently slowed to halftime's gait."},{id:"halftimewave_ayo",name:"Ayo",artist:"Sam Binga & Redders",year:2014,bpm:140,tonic:9,progId:"deepHouse",baseTemplate:"halftimewave",narrative:"chant",vary:.4,sync:2,tip:"A Critical Music halftime cut built on a chopped, reciting vocal hook over a growling dnb-tempo reese slowed to a half-time pocket. `chant` writes that rhythm-driven, repeated-syllable vocal directly."},{id:"halftimewave_hopscotch",name:"Hopscotch",artist:"Mr. Carmack",year:2013,bpm:140,tonic:4,progId:"dorian",baseTemplate:"halftimewave",narrative:"ostinato",vary:.3,sync:2,tip:"Named by Ivy Lab as a defining halftime cut from a producer working the trap/dubstep border of the scene \u2014 a single syncopated bass cell over a halftime pocket rather than a built melody."},{id:"halftimewave_brockwild",name:"Brockwild",artist:"Darkhouse Family",year:2015,bpm:140,tonic:5,progId:"aeolian",baseTemplate:"halftimewave",narrative:"motif",vary:.5,sync:1,tip:"A dark, dubstep-adjacent halftime cut from the Darkhouse Family crew, built on a repeating reese-growl cell that shifts register section to section rather than a sung line. `motif` gives that cell room to return altered."},{id:"halftimewave_shadesminotaur",name:"Shades (Minotaur)",artist:"Alix Perez & Eprom",year:2015,bpm:140,tonic:9,progId:"axisMinor",baseTemplate:"halftimewave",narrative:"wave",vary:.5,sync:1,tip:"A transatlantic wave/halftime collaboration pairing Alix Perez's dnb pedigree with Eprom's West Coast bass design \u2014 a slow-moving reese swell under a halftime pocket rather than a hooky top-line."},{id:"halftimewave_solarcycle",name:"Solar Cycle",artist:"Om Unit & Kromestar",year:2014,bpm:140,tonic:2,progId:"dorian",baseTemplate:"halftimewave",narrative:"ostinato",vary:.4,sync:1,tip:"A Cosmic Bridge collaboration cited among Ivy Lab's ten defining halftime tracks \u2014 jungle-tempo drum science reworked into a halftime bass roller with one dominant, barely-varied low-end cell."},{id:"halftimewave_inviteonly",name:"Invite Only",artist:"Great Dane",year:2014,bpm:140,tonic:0,progId:"aeolian",baseTemplate:"halftimewave",narrative:"chordLock",vary:.4,sync:2,tip:"A halftime cut Ivy Lab singled out for its blunt, stabbed bass hits that move only with the chord under them rather than carrying an independent tune. `chordLock` is the direct match for that stab-led writing."},{id:"halftimewave_neujack",name:"Neujack",artist:"Machinedrum",year:2013,bpm:140,tonic:7,progId:"dorian",baseTemplate:"halftimewave",narrative:"motif",vary:.6,sync:2,tip:"Machinedrum's footwork-inflected halftime cut, cited by Ivy Lab as one of the scene's defining tracks \u2014 a short, off-kilter cell restated with syncopated variation rather than a straight dnb roller. `motif` and the higher sync track that footwork-derived skip."},{id:"jumpup_supersharpshooter",name:"Super Sharp Shooter",artist:"Ganja Kru",year:1996,bpm:172,tonic:9,progId:"deepHouse",baseTemplate:"jumpup",narrative:"motif",vary:.4,sync:1,tip:"A jump-up landmark from the DJ Hype/DJ Zinc/Pascal camp \u2014 a comic, hooky bassline riff is the whole point of the drop, restated with small twists rather than atmosphere. `motif` gives that bouncy cell room to return varied."},{id:"jumpup_138trek",name:"138 Trek",artist:"DJ Zinc",year:1997,bpm:172,tonic:2,progId:"aeolian",baseTemplate:"jumpup",narrative:"ostinato",vary:.3,sync:1,tip:"One of the definitive jump-up basslines \u2014 a single bouncy, comic riff looped rather than developed, built purely for the dancefloor bounce. `ostinato` at low vary matches that flat, hook-first repetition."},{id:"jumpup_bodyrock",name:"Body Rock",artist:"Andy C & Shimon",year:2002,bpm:174,tonic:7,progId:"axisMinor",baseTemplate:"jumpup",narrative:"motif",vary:.4,sync:1,tip:"A perennial Andy C DJ-set closer built on a bright, party-oriented bassline hook that returns with small tweaks each drop rather than developing into a real tune. `motif` captures that hook-and-restate shape."},{id:"jumpup_rockit",name:"Rock It",artist:"Sub Focus",year:2007,bpm:174,tonic:0,progId:"deepHouse",baseTemplate:"jumpup",narrative:"chordLock",vary:.4,sync:1,tip:"Sub Focus's breakout single leans on a bouncy, stabbed bass hook that snaps to the chord underneath rather than singing over it \u2014 bright and hooky rather than atmospheric, exactly this style's brief."},{id:"jumpup_easternjam",name:"Eastern Jam",artist:"Chase & Status",year:2005,bpm:174,tonic:9,progId:"phrygian",baseTemplate:"jumpup",narrative:"motif",vary:.4,sync:1,tip:"An early Chase & Status jump-up cut whose bouncy bassline hook borrows an Eastern-scale flavour for its comic, dancefloor-first riff. `phrygian`'s flattened-second colour nods to that modal flavour without copying it."},{id:"jumpup_sportsday",name:"Sports Day",artist:"DJ Hazard",year:2007,bpm:174,tonic:5,progId:"aeolian",baseTemplate:"jumpup",narrative:"ostinato",vary:.3,sync:1,tip:"A Playaz-era DJ Hazard jump-up cut built on one bouncy, comic bassline riff repeated with almost no harmonic movement \u2014 the joke and the hook are the same thing. `ostinato` matches that flat repetition."},{id:"jumpup_trueromance",name:"True Romance",artist:"DJ Hype & Zinc",year:1997,bpm:172,tonic:4,progId:"deepHouse",baseTemplate:"jumpup",narrative:"callResp",vary:.4,sync:1,tip:"A Ganja Records collaboration where two bouncy bassline riffs trade back and forth across the drop rather than sitting under one continuous hook. `callResp` writes that riff-trading structure directly."},{id:"jumpup_ganjababy",name:"Ganja Baby",artist:"Serial Killaz",year:2007,bpm:174,tonic:2,progId:"axisMinor",baseTemplate:"jumpup",narrative:"chant",vary:.4,sync:2,tip:"A ragga-flavoured jump-up cut built on a chopped, chanted vocal hook over a bouncy bassline rather than a sung melody. `chant` writes that reciting re the actual focus. `wave` gives the pad its own slow movement without competing with the drums."},{id:"drumfunk_acidrain",name:"Acid Rain",artist:"Equinox",year:2005,bpm:172,tonic:4,progId:"axisMinor",baseTemplate:"drumfunk",narrative:"motif",vary:.5,sync:1,tip:"Later remixed by Breakage, this Inperspective release keeps the same intricate, funk-descended breakbeat-science approach with the bass staying firmly in a supporting role."},{id:"drumfunk_themutant",name:"The Mutant",artist:"DJ Trace",year:1996,bpm:165,tonic:0,progId:"aeolian",baseTemplate:"drumfunk",narrative:"germ",vary:.6,sync:1,tip:"Released on DJ Trace's own Prototype Recordings, part of the techstep/breakbeat-science lineage that fed directly into drumfunk's intricate drum-editing style, bass kept spare underneath."},{id:"drumfunk_vulcanpunch",name:"Vulcan Punch",artist:"Fracture",year:2009,bpm:172,tonic:9,progId:"dorian",baseTemplate:"drumfunk",narrative:"germ",vary:.7,sync:1,within:!0,tip:"Released on Fracture's own Astrophonica label, part of the breakbeat-science revival that carried drumfunk's intricate, funk-descended drum programming into a new decade. `within:true` reflects breaks that keep shifting inside a single pass."},{id:"drumfunk_skylined",name:"Skylined",artist:"Break",year:2005,bpm:172,tonic:5,progId:"aeolian",baseTemplate:"drumfunk",narrative:"motif",vary:.5,sync:1,tip:"From Break's breakbeat-science era before he moved toward jump-up \u2014 dense, live-feel drum editing carries the record while the bassline stays understated in support."},{id:"drumfunk_retrograde",name:"Retrograde",artist:"Skeptical",year:2013,bpm:172,tonic:2,progId:"dorian",baseTemplate:"drumfunk",narrative:"germ",vary:.6,sync:1,tip:"Skeptical's breakbeat-science output on Med School continues the drumfunk lineage of intricate, funk-derived drum programming taking centre stage over a restrained low end."},{id:"drumfunk_chrysalis",name:"Chrysalis",artist:"Instra:mental",year:2007,bpm:172,tonic:7,progId:"aeolian",baseTemplate:"drumfunk",narrative:"wave",vary:.4,sync:0,tip:"An early Instra:mental release (Nonplus Records) from the breakbeat-science lineage bridging drumfunk's intricate edits and the more atmospheric 'autonomic' sound that followed \u2014 the drums do the intricate work while the pad sits back."},{id:"drumfunk_therain",name:"The Rain",artist:"Photek",year:1995,bpm:165,tonic:9,progId:"dorian",baseTemplate:"drumfunk",narrative:"germ",vary:.6,sync:1,tip:"Photek's meticulous hi-hat and snare editing on this record is frequently cited as a direct influence on drumfunk's intricate-breaks aesthetic, with the bassline kept minimal underneath the drum work."},{id:"breakcore_hajnal",name:"Hajnal",artist:"Venetian Snares",year:2005,bpm:180,tonic:2,progId:"aeolian",baseTemplate:"breakcore",narrative:"germ",vary:.8,sync:2,within:!0,tip:"From Rossz Csillag Alatt Sz\xFCletett, the album that popularised breakcore by splicing Bart\xF3k- and Stravinsky-style string writing into relentlessly chopped amen breaks. `germ` with `within:true` writes material that keeps mutating even inside one pass."},{id:"breakcore_look",name:"Look",artist:"Venetian Snares",year:2005,bpm:180,tonic:9,progId:"axisMinor",baseTemplate:"breakcore",narrative:"germ",vary:.8,sync:2,within:!0,tip:"Another cut from the same landmark album, maximalist and chaotic by design \u2014 breaks stuttered and rearranged track-long rather than settling into a groove. `germ` at high vary matches that constant reinvention."},{id:"breakcore_szamarmadar",name:"Szam\xE1r Mad\xE1r",artist:"Venetian Snares",year:2005,bpm:180,tonic:4,progId:"aeolian",baseTemplate:"breakcore",narrative:"cascade",vary:.7,sync:2,tip:"Its classical string sequence tumbles downward before being fed straight into the chopped-break chaos \u2014 `cascade`'s falling sequence captures that source material's own shape before the breakcore stuttering takes over."},{id:"breakcore_comeonmyselector",name:"Come On My Selector",artist:"Squarepusher",year:1997,bpm:180,tonic:7,progId:"dorian",baseTemplate:"breakcore",narrative:"germ",vary:.8,sync:2,tip:"A drill'n'bass/breakcore-boundary Warp release where live-feel bass and drum interplay gets more frantic and rearranged as the track runs, never settling into a repeat. `germ` matches that continual escalation."},{id:"breakcore_cometodaddy",name:"Come to Daddy (Little Lord Faulteroy Mix)",artist:"Aphex Twin",year:1997,bpm:180,tonic:9,progId:"axisMinor",baseTemplate:"breakcore",narrative:"chant",vary:.4,sync:2,tip:"The pitched, screamed 'I want your soul' vocal hook is rhythm-driven and reciting rather than sung, sitting over relentlessly chopped breaks that heavily influenced the breakcore scene's aggression. `chant` writes that hook directly."},{id:"breakcore_straightouttacompton",name:"Straight Outta Compton",artist:"Kid606",year:2e3,bpm:180,tonic:0,progId:"aeolian",baseTemplate:"breakcore",narrative:"ostinato",vary:.3,sync:2,tip:"Kid606's notorious mash-up cover loops the N.W.A hook itself into a stuttering breakcore cell rather than building new melodic material \u2014 one of the scene's defining, maximalist provocations."},{id:"breakcore_fullenglishbreakfat",name:"Full English Breakfat",artist:"Shitmat",year:2003,bpm:180,tonic:2,progId:"aeolian",baseTemplate:"breakcore",narrative:"germ",vary:.8,sync:2,tip:"A Planet Mu breakcore landmark stacking chopped samples and breaks into relentless, maximalist chaos rather than any steady groove. `germ` at high vary matches its constantly mutating sample-and-break collage."},{id:"breakcore_feedthepigs",name:"Feed the Pigs",artist:"Nasenbluten",year:1996,bpm:190,tonic:9,progId:"axisMinor",baseTemplate:"breakcore",narrative:"chant",vary:.4,sync:2,tip:"Australian gabber-breakcore act Nasenbluten fuse hardcore aggression with chopped breaks and a shouted, reciting vocal hook rather than a melodic one. `chant` writes that confrontational, rhythm-first shout."},{id:"breakcore_veryoccult",name:"Very Occult",artist:"Igorrr",year:2010,bpm:180,tonic:4,progId:"phrygian",baseTemplate:"breakcore",narrative:"germ",vary:.9,sync:2,within:!0,tip:"Igorrr splices baroque and metal motifs directly into stuttered, chopped breaks, mutating the material relentlessly within the track itself. `germ` with `within:true` and the `phrygian` colour both match that maximalist genre-collision."},{id:"breakcore_kimochiguuwai",name:"Kimochi Guuwa\xEF",artist:"DJ Scotch Egg",year:2005,bpm:180,tonic:7,progId:"aeolian",baseTemplate:"breakcore",narrative:"chant",vary:.5,sync:2,tip:"DJ Scotch Egg's chiptune-breakcore fuses 8-bit game-console tones with chopped breaks and a chanted, rhythm-led vocal hook rather than a sung line. `chant` matches that reciting, hyperactive delivery."},{id:"digitalhardcore_deutschland",name:"Deutschland (Has Gotta Die)",artist:"Atari Teenage Riot",year:1993,bpm:190,tonic:9,progId:"axisMinor",baseTemplate:"digitalhardcore",narrative:"chant",vary:.3,sync:2,tip:"From the Delete Yourself! EP that helped launch Digital Hardcore Recordings \u2014 a shouted, confrontational vocal hook sits over blown-out breakcore breaks and distorted noise. `chant` writes that reciting, punk-shouted delivery directly."},{id:"digitalhardcore_sicktodeath",name:"Sick to Death",artist:"Atari Teenage Riot",year:1997,bpm:190,tonic:0,progId:"aeolian",baseTemplate:"digitalhardcore",narrative:"chant",vary:.3,sync:2,tip:"From The Future of War, ATR's fusion of breakcore's chopped chaos with punk-shout aggression, faster and harsher than straight breakcore. `chant` matches its shouted, rhythm-first vocal hook."},{id:"digitalhardcore_speed",name:"Speed",artist:"Atari Teenage Riot",year:1997,bpm:200,tonic:2,progId:"axisMinor",baseTemplate:"digitalhardcore",narrative:"ostinato",vary:.2,sync:2,tip:"One of ATR's fastest, most punishing cuts from The Future of War \u2014 a single blown-out riff repeated at punk-tempo intensity rather than developed into a melody. `ostinato` matches that relentless, undeveloped repetition."},{id:"digitalhar chine-like by design."},{id:"digitalhardcore_chromosonedamage",name:"Chromosone Damage",artist:"The Panacea",year:1999,bpm:190,tonic:2,progId:"axisMinor",baseTemplate:"digitalhardcore",narrative:"germ",vary:.6,sync:2,tip:"German producer The Panacea works the breakcore/digital-hardcore border, feeding one harsh industrial break cell through increasingly mangled reprocessing as the track runs. `germ` matches that escalating mutation."},{id:"digitalhardcore_scylla",name:"Scylla",artist:"Christoph De Babalon",year:1997,bpm:190,tonic:7,progId:"aeolian",baseTemplate:"digitalhardcore",narrative:"wave",vary:.4,sync:1,tip:"From If You're Into It, I'm Out of It, De Babalon layers dark ambient sheets under blown-out, punishing breaks \u2014 the harsh digital-hardcore aggression sits over a slow-moving atmospheric bed. `wave` gives that pad its own drift beneath the noise."},{id:"happyhardcore_prettygreeneyes",name:"Pretty Green Eyes",artist:"Ultrabeat",year:2003,bpm:162,tonic:11,progId:"axis",baseTemplate:"happyhardcore",narrative:"arch",vary:.6,sync:1,tip:"A UK #2 hit built on a piano-stab intro and a soaring major-key vocal hook that's the whole emotional payload of the record; `arch` gives that hook its rise-and-fall shape inside each chorus without quoting its actual melody."},{id:"happyhardcore_elysium",name:"Elysium (I Go Crazy)",artist:"Ultrabeat",year:2006,bpm:144,tonic:0,progId:"edm",baseTemplate:"happyhardcore",narrative:"expand",vary:.7,sync:1,tip:"A piano-and-vocal happy hardcore anthem where the chorus opens the register right up over a relentless four-on-the-floor pulse; `expand` writes that widening without copying the sung line."},{id:"happyhardcore_wonderfuldays",name:"Wonderful Days",artist:"Charly Lownoise & Mental Theo",year:1995,bpm:166,tonic:10,progId:"axis",baseTemplate:"happyhardcore",narrative:"terraced",vary:.5,sync:1,tip:"This Dutch duo's biggest UK hit rides a repeating piano riff that keeps re-entering a step higher through the build; `terraced` is exactly that layering trick, without lifting the actual riff."},{id:"happyhardcore_sesamestreet",name:"Sesame's Treet",artist:"Smart E's",year:1992,bpm:145,tonic:7,progId:"aeolian",baseTemplate:"happyhardcore",narrative:"ostinato",vary:.3,sync:1,tip:"Built almost entirely from a looped, pitched-up sample of the Sesame Street theme rather than a composed melody \u2014 one of the records that accidentally invented happy hardcore's cartoon-rave sound; `ostinato` keeps the cell barely developed the way the sample loop is."},{id:"happyhardcore_hyperhyper",name:"Hyper Hyper",artist:"Scooter",year:1994,bpm:160,tonic:6,progId:"festival",baseTemplate:"happyhardcore",narrative:"chant",vary:.4,sync:2,tip:'H.P. Baxxter\'s shouted "Hyper! Hyper!" is a chanted, rhythm-driven hook rather than a sung line, riding on top of the pushed offbeats that make this early record feel so hyperactive; `chant` at the harder syncopation setting captures that.'},{id:"happyhardcore_rainbowinthesky",name:"Rainbow in the Sky",artist:"DJ Paul Elstak",year:1995,bpm:150,tonic:2,progId:"aeolian",baseTemplate:"happyhardcore",narrative:"wave",vary:.5,sync:1,tip:"The record that pulled Dutch gabber toward happy-hardcore territory, wrapping a children's-choir sample and strings around the same pounding kick; `wave` gives it that long, slow melodic swell rather than a hard-edged riff."},{id:"happyhardcore_luvumore",name:"Luv U More",artist:"DJ Paul Elstak",year:1995,bpm:150,tonic:7,progId:"mixo",baseTemplate:"happyhardcore",narrative:"motif",vary:.6,sync:1,tip:"Built around a chopped reggae vocal sample restated through the arrangement rather than a fresh top-line each section, which is what makes it read as one hook rather than a song; `motif` restates and reshapes that one cell."},{id:"happyhardcore_gonfigon",name:"Everybody Gonfi-Gon",artist:"Two Cowboys",year:1994,bpm:140,tonic:9,progId:"axis",baseTemplate:"happyhardcore",narrative:"qanda",vary:.5,sync:1,tip:"This Italian duo's novelty hardcore hit trades its nonsense-word hook back and forth between two short phrases like call-and-answer; `qanda` writes that same question-and-answer pairing across the hook."},{id:"happyhardcore_foreveryoung",name:"Forever Young",artist:"Interactive",year:1992,bpm:150,tonic:2,progId:"axis",baseTemplate:"happyhardcore",narrative:"archSong",vary:.6,sync:1,tip:"A breakbeat-hardcore cover of the Alphaville synth-pop ballad, sped up and pitched into rave territory while keeping the original's single long rise-and-fall shape across the whole song; `archSong` preserves that arc."},{id:"happyhardcore_whoiselvis",name:"Who Is Elvis?",artist:"Charly Lownoise & Mental Theo",year:1994,bpm:155,tonic:0,progId:"axis",baseTemplate:"happyhardcore",narrative:"chant",vary:.4,sync:2,tip:"A novelty hardcore hit that repeats its title as a shouted, rhythmically-locked catchphrase rather than developing a sung melody; `chant` matches that reciting-pitch delivery over the pushed sixteenths."},{id:"gabber_poing",name:"Poing",artist:"Rotterdam Termination Source",year:1992,bpm:148,tonic:9,progId:"aeolian",baseTemplate:"gabber",narrative:"ostinato",vary:.2,sync:0,tip:'The foundational Rotterdam gabber record \u2014 a single pounding kick and a "poing" boing sound looped for the whole track with almost nothing else. `ostinato` at very low variation matches a record built on one cell that never moves.'},{id:"gabber_allesnaardeklote",name:"Alles Naar De Klote!",artist:"Euromasters",year:1992,bpm:150,tonic:9,progId:"aeolian",baseTemplate:"gabber",narrative:"chant",vary:.2,sync:2,tip:"The other founding Rotterdam gabber anthem, built on a shouted Dutch football-terrace chant over a distorted, oversized kick rather than any sung melody; `chant` at the harder syncopation setting captures that terrace-shout delivery."},{id:"gabber_dominatin",name:"Dominatin'",artist:"The Prophet",year:1993,bpm:150,tonic:4,progId:"axisMinor",baseTemplate:"gabber",narrative:"chordLock",vary:.3,sync:1,tip:"Early Rotterdam gabber from one of the scene's Dreamteam DJs, where the riff only moves because the chord under the distorted kick changes; `chordLock` writes that same chord-snapped stab instead of a separate lead line."},{id:"gabber_searchanddestroy",name:"Search and Destroy",artist:"Ruffneck",year:1995,bpm:155,tonic:2,progId:"axisMinor",baseTemplate:"gabber",narrative:"motif",vary:.4,sync:1,tip:"Belgian gabber producer Ruffneck builds the track from one aggressive short cell pushed into a different register each section rather than a fully developed melody; `motif` restates and reshapes that cell."},{id:"gabber_haveyoueverbeenmellow",name:"Have You Ever Been Mellow",artist:"Party Animals",year:1996,bpm:150,tonic:5,progId:"axis",baseTemplate:"gabber",narrative:"archSong",vary:.5,sync:1,tip:"A Dutch pop-gabber #1 built by taking Olivia Newton-John's soft-rock ballad and blasting it over a distorted four-on-the-floor kick, keeping the original's single long rise and fall; `archSong` preserves that shape."},{id:"gabber_braincracking",name:"Braincracking",artist:"Neophyte",year:1998,bpm:163,tonic:7,progId:"aeolian",baseTemplate:"gabber",narrative:"motif",vary:.4,sync:1,tip:"Built from a chopped sample of Tracy Bonham's \"Mother Mother\" vocal hook restated and twisted harder each pass over Neophyte's pounding Rotterdam kick; `motif` develops that one cell further each section."},{id:"gabber_blowyourmind",name:"We're Gonna Blow Your Mind",artist:"Rotterdam Terror Corps",year:1999,bpm:155,tonic:9,progId:"axisMinor",baseTemplate:"gabber",narrative:"chant",vary:.3,sync:1,tip:"RTC's kick is mixed as the loudest thing on the record, with a shouted title-phrase hook riding on top rather than a sung line; `chant` writes that reciting, rhythm-driven vocal shape."},{id:"gabber_raiseyourfist",name:"Raise Your Fist",artist:"Angerfist",year:2004,bpm:159,tonic:11,progId:"axisMinor",baseTemplate:"gabber",narrative:"chant",vary:.3,sync:1,tip:"Angerfist's breakthrough anthem is carried almost entirely by its pounding distorted kick and a shouted title-hook stab, with barely any sung melody to speak of; `chant` captures that hook without inventing a tune it never had."},{id:"gabber_godisagabber",name:"God Is A Gabber",artist:"Rotterdam Terror Corps",year:2013,bpm:161,tonic:4,progId:"aeolian",baseTemplate:"gabber",narrative:"chordLock",vary:.3,sync:1,tip:"A modern RTC record where the riff-stab is locked to the chord changes under a mixed-hot kick, the classic gabber balance of power; `chordLock` writes that same harmony-follows-the-stab relationship."},{id:"gabber_wearethecore",name:"We Are The Core",artist:"Rotterdam Terror Corps",year:2022,bpm:180,tonic:1,progId:"edm",baseTemplate:"gabber",narrative:"chant",vary:.4,sync:1,tip:"A newer, faster RTC anthem where the pounding kick still sits loudest in the mix and the title is shouted as a rhythm-locked chant over it; `chant` matches that hook at gabber's harder modern tempo."},{id:"hardstyle_getup",name:"Get Up",artist:"Showtek",year:2001,bpm:150,tonic:9,progId:"axisMinor",baseTemplate:"hardstyle",narrative:"chordLock",vary:.4,sync:1,tip:"One of the records that defined early Dutch hardstyle, where the kick itself carries the bassline as a distorted screech and the riff only shifts because the chord under it does; `chordLock` is that exact relationship."},{id:"hardstyle_theway",name:"The Way",artist:"Zatox",year:2008,bpm:150,tonic:7,progId:"festival",baseTemplate:"hardstyle",narrative:"peak",vary:.6,sync:1,tip:"A euphoric-hardstyle anthem that holds its biggest lead line back until the final drop rather than front-loading it; `peak` withholds the top note the same way."},{id:"hardstyle_mynameishardstyle",name:"My Name Is Hardstyle",artist:"Ran-D & Adaro",year:2009,bpm:144,tonic:11,progId:"axisMinor",baseTemplate:"hardstyle",narrative:"chant",vary:.4,sync:1,tip:"The title itself is the hook, repeated as a rhythm-locked chant over the pitched, reverse-tailed kick that carries the whole bassline; `chant` matches that reciting
